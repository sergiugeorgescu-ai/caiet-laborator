<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lucrarea 1 · Caiet de Laborator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E9EEF1; --surface-3:#DFE6EA;
  --line:#D5DEE4; --line-strong:#BCC9D1;
  --ink:#121A20; --ink-2:#44535E; --ink-3:#6E8090;
  --accent:#0D6875; --accent-ink:#FFFFFF; --accent-soft:#DCEDF0; --accent-line:#8FC3CB;
  --good:#2C7248; --good-soft:#DFF0E5;
  --warn:#8C6212; --warn-soft:#F6EBD3;
  --crit:#A93A38; --crit-soft:#F7E2E1;
  --shadow:0 1px 2px rgba(18,26,32,.06),0 6px 18px -10px rgba(18,26,32,.22);
  --radius:10px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
    --line:#2A3945; --line-strong:#3B4D5B;
    --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
    --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
    --good:#66C18C; --good-soft:#12301F;
    --warn:#D7AB55; --warn-soft:#332813;
    --crit:#E2817C; --crit-soft:#361D1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
  --line:#2A3945; --line-strong:#3B4D5B;
  --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
  --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
  --good:#66C18C; --good-soft:#12301F;
  --warn:#D7AB55; --warn-soft:#332813;
  --crit:#E2817C; --crit-soft:#361D1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:16px;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);
  padding:6px 8px;border-radius:6px;white-space:nowrap;border:0;cursor:pointer}
.mark:hover{filter:brightness(1.1)}
.brand h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topActions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:grid;place-items:center}

main{flex:1;width:100%;max-width:1140px;margin:0 auto;padding:22px 16px 56px}
.pagefoot{border-top:1px solid var(--line);padding:14px 16px 26px;font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.tiny{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500;flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=email],select,textarea{
  font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:7px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- layout with rail ---------- */
.shell{display:grid;grid-template-columns:minmax(0,232px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}
.rail{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.rail{position:static}}
.rail a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink-2);font-size:13px;
  padding:6px 9px;border-radius:7px;border-left:2px solid transparent}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.done{color:var(--ink-3)}
.rail a .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;width:18px}
.rail a.done .n{color:var(--good)}
.progWrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:8px}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ---------- lab text ---------- */
.doc{font-size:15px;line-height:1.68;max-width:70ch}
.doc h2{font-size:19px;margin:24px 0 8px}
.doc h3{font-size:16px;margin:20px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin:3px 0}
.doc code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--accent-line);background:var(--accent-soft);border-radius:0 7px 7px 0}
.doc blockquote p:last-child{margin:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.tableWrap{overflow-x:auto;margin:0 0 14px}
.doc table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.doc th{background:var(--surface-2);font-weight:600;font-family:var(--sans)}
.doc td.num,.doc th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px}
.doc img,.opt img,.figpick img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;margin:2px 0}
.doc p > img{margin:6px auto}
.doc em{color:var(--ink-2)}
.doc table td img{margin:0 auto}
.imgmiss{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--crit);background:var(--crit-soft);padding:2px 7px;border-radius:5px}

/* ---------- questions ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;scroll-margin-top:80px}
.q + .q{margin-top:12px}
.gq{padding:14px 0 4px;scroll-margin-top:80px}
.gq + .gq{border-top:1px solid var(--line);margin-top:12px;padding-top:18px}
.qhead{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.qnum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.qtext{font-size:15px;line-height:1.6;margin-bottom:12px}
.val{font-family:var(--mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (max-width:620px){.opts.grid{grid-template-columns:minmax(0,1fr)}}
.opts.grid .opt{flex-wrap:wrap;align-items:center}
.opts.grid .opt > span:last-child{flex:1 1 100%;min-width:0;margin-top:7px}
.qrwrap{text-align:center}
.qrwrap svg{width:min(76vw,360px);height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.qrwrap.big svg{width:min(88vw,66vh)}
.qrwrap.small svg{width:min(60vw,190px);padding:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.figitem{position:relative}
.figitem .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:12px;cursor:pointer;color:var(--crit);padding:0}
.rank{display:flex;flex-direction:column;gap:6px}
.rankrow{display:grid;grid-template-columns:28px minmax(90px,1fr) minmax(70px,2fr) 46px 46px;gap:10px;align-items:center;
  padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.rankrow.top{border-color:var(--accent);background:var(--accent-soft)}
.rankrow .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:right}
.rankrow.top .pos{color:var(--accent);font-weight:600}
.rankrow .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .barw{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.rankrow .barw i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rankrow .pctv{font-size:12.5px;color:var(--ink-2);text-align:right}
.rankrow .notav{font-size:14px;font-weight:600;text-align:right}
@media (max-width:560px){.rankrow{grid-template-columns:24px 1fr 44px 44px}.rankrow .barw{display:none}}
.meter{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.qrwrap .who{font-family:var(--mono);font-size:13px;margin-bottom:10px;color:var(--ink-2)}
.qrwrap .after{font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:44ch;margin-left:auto;margin-right:auto}
.linkbox{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
@media print{
  body > *{display:none!important}
  #modal{display:block!important;position:static;background:none;padding:0}
  .modalBox{border:0;box-shadow:none;max-height:none;width:100%}
  .modalBox > header button,.modalBox > footer{display:none}
  .qrwrap svg{width:15cm;border:0}
  .qrwrap.big svg{width:15cm}
}
.figpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.figpick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;text-align:left;font-size:11px}
.figpick button:hover{border-color:var(--accent)}
.figpick code{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);min-width:0}
.opt > span{min-width:0}
.opt:hover{border-color:var(--accent-line);background:var(--surface-2)}
.opt input{margin:3px 0 0;accent-color:var(--accent);flex-shrink:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .lt{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex-shrink:0;width:14px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--crit);background:var(--crit-soft)}
.numline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numline input{max-width:200px;font-family:var(--mono);font-size:15px}
.unit{font-family:var(--mono);font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:6px 9px;border-radius:6px;border:1px solid var(--line)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.given span{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.fb{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--crit-soft);color:var(--crit)}
.fb.note{background:var(--surface-2);color:var(--ink-2)}
.fb b{font-weight:600}

/* ---------- tables (catalog / editor) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3);font-size:13.5px}

/* ---------- editor ---------- */
.qedit{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:13px;margin-top:10px}
.qedit .qeHead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.optedit{display:flex;gap:7px;align-items:center;margin-top:6px}
.optedit input[type=radio]{accent-color:var(--accent);flex-shrink:0}
.varrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr)) 34px;gap:7px;align-items:end;margin-top:7px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- code box ---------- */
.codebox{font-family:var(--mono);font-size:11.5px;line-height:1.45;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:11px;word-break:break-all;max-height:150px;overflow-y:auto;color:var(--ink-2)}
.scoreBig{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;color:var(--accent)}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(8,14,18,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modalBox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modalBox > header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modalBox > .body{padding:18px;overflow-y:auto}
.modalBox > footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

   cu revenire automată la localStorage dacă IndexedDB nu este disponibil. */
const Store = (function () {
  let handle, tried = false;
  function open() {
    return new Promise(res => {
      if (typeof indexedDB === "undefined") return res(null);
      let req;
      try { req = indexedDB.open("caiet-laborator", 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => { try { req.result.createObjectStore("kv"); } catch (e) { } };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
      setTimeout(() => res(null), 4000);
    });
  }
  async function ready() { if (!tried) { tried = true; handle = await open(); } return handle; }
  return {
    available: async () => !!(await ready()),
    async get(k, d) {
      const h = await ready();
      if (!h) return LS.get(k, d);
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readonly").objectStore("kv").get(k);
          rq.onsuccess = () => res(rq.result === undefined ? LS.get(k, d) : rq.result);
          rq.onerror = () => res(LS.get(k, d));
        } catch (e) { res(LS.get(k, d)); }
      });
    },
    async set(k, v) {
      const h = await ready();
      if (!h) { LS.set(k, v); return false; }
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readwrite").objectStore("kv").put(v, k);
          rq.onsuccess = () => res(true);
          rq.onerror = () => { LS.set(k, v); res(false); };
        } catch (e) { LS.set(k, v); res(false); }
      });
    }
  };
})();

      out += "<blockquote>" + renderMd(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (/^\s*[-*+]\s+/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      out += "<ul>" + buf.map(b => "<li>" + inl(b) + "</li>").join("") + "</ul>"; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      out += "<ol>" + buf.map(b => "<li>" + inl(b) + "</li>").join("") + "</ol>"; continue;
    }
    const par = []; while (i < lines.length && lines[i].trim() && !/^\s*(#{2,4}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(lines[i])) { par.push(lines[i]); i++; }
    out += "<p>" + inl(par.join(" ")) + "</p>";
  }
  return out;
}

/* ============================ platforma de eLearning (SCORM) ============================ */
/* Când aplicația rulează într-un curs Moodle, ia numele studentului din platformă
   și raportează înapoi finalizarea lucrării. În afara platformei, totul e inactiv. */
const LMS = (function () {
  let api = null, started = false, tried = false;
  function find() {
    let w = window, n = 0;
    while (w && n++ < 12) {
      try { if (w.API) return w.API; } catch (e) { }
      try { w = (w.parent && w.parent !== w) ? w.parent : null; } catch (e) { w = null; }
    }
    try { if (window.opener && window.opener.API) return window.opener.API; } catch (e) { }
    return null;
  }
  function get() { if (!tried) { tried = true; api = find(); } return api; }
  return {
    present() { return !!get(); },
    init() {
      const a = get(); if (!a || started) return false;
      try { started = a.LMSInitialize("") === "true" || a.LMSInitialize("") === true; } catch (e) { started = false; }
      return started;
    },
    student() {
      const a = get(); if (!a) return null;
      try {
        const raw = a.LMSGetValue("cmi.core.student_name") || "";
        const id = a.LMSGetValue("cmi.core.student_id") || "";
        const nume = String(raw).replace(/,/g, " ").replace(/\s+/g, " ").trim();
        return nume ? { name: nume, id: String(id) } : null;
      } catch (e) { return null; }
    },
    done(procent) {
      const a = get(); if (!a) return;
      try {
        a.LMSSetValue("cmi.core.lesson_status", "completed");
        if (isFinite(procent)) {
          a.LMSSetValue("cmi.core.score.raw", String(Math.round(procent)));
          a.LMSSetValue("cmi.core.score.min", "0");
          a.LMSSetValue("cmi.core.score.max", "100");
        }
        a.LMSCommit("");
      } catch (e) { }
    },
    finish() { const a = get(); if (!a || !started) return; try { a.LMSFinish(""); } catch (e) { } }
  };
})();

/* ============================ criptare ============================ */
/* Fișele studenților se închid cu o pereche de chei: cheia publică ajunge la
   studenți (prin codul QR), cheia privată rămâne doar la cadrul didactic.
   Un student nu poate deschide codul altui student. */
const Crypt = {
  ok() { try { return !!(typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.deriveBits); } catch (e) { return false; } },
  async genPair() {
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    return {
      pub: b64enc(new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey))),
      priv: await crypto.subtle.exportKey("jwk", kp.privateKey)
    };
  },
  async aesFrom(bits) {
    return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", bits), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  },
  async encrypt(bytes, pubB64) {
    const teacher = await crypto.subtle.importKey("raw", b64dec(pubB64), { name: "ECDH", namedCurve: "P-256" }, false, []);
    const eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: teacher }, eph.privateKey, 256);
    const key = await Crypt.aesFrom(bits);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, bytes));
    const ep = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
    const out = new Uint8Array(ep.length + 12 + ct.length);
    out.set(ep, 0); out.set(iv, ep.length); out.set(ct, ep.length + 12);
    return out;
  },
  async decrypt(bytes, privJwk) {
    const ep = bytes.slice(0, 65), iv = bytes.slice(65, 77), ct = bytes.slice(77);
    const priv = await crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    const pub = await crypto.subtle.importKey("raw", ep, { name: "ECDH", namedCurve: "P-256" }, false, []);
    const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: pub }, priv, 256);
    const key = await Crypt.aesFrom(bits);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct));
  },
  /* amprentă scurtă, ca să recunoști cheia */
  fingerprint(pubB64) {
    if (!pubB64) return "";
    const h = hashStr(pubB64).toString(36).toUpperCase();
    return (h + "000000").slice(0, 6);
  }
};
let PRIV = undefined;
async function privKey() {
  if (PRIV === undefined) PRIV = await Store.get(K.priv, null);
  return PRIV;
}
function pubKey() { return LS.get(K.pub, "") || ""; }
function cryptReady() { return !!(pubKey() && Crypt.ok()); }

/* ============================ codec cod de predare ============================ */
function b64enc(bytes) {
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(str) {
  let s = str.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* varianta compactă, pentru codul QR: valorile generate se recalculează din seed */
function compactSub(sub) {
  return { v: 2, l: sub.labId, t: sub.labTitle, n: sub.name, g: sub.group, s: sub.seed, d: sub.submittedAt, a: sub.answers };
}
function normalizeSub(o) {
  if (o && typeof o === "object" && o.v === 2 && o.a && o.l)
    return { v: 2, labId: o.l, labTitle: o.t, name: o.n, group: o.g, seed: o.s, submittedAt: o.d, answers: o.a, __enc: o.__enc };
  return o;
}
async function deflate(bytes) {
  if (typeof CompressionStream !== "function") return null;
  try {
    const cs = new CompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
  } catch (e) { return null; }
}
async function inflate(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
/* LAB0 simplu · LAB1 comprimat · LAB2 comprimat+criptat · LAB3 criptat */
async function encodePayload(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  const packed = await deflate(raw);
  const body = packed || raw;
  const tagPlain = packed ? "LAB1." : "LAB0.";
  const pub = pubKey();
  if (pub && Crypt.ok()) {
    try {
      const enc = await Crypt.encrypt(body, pub);
      return (packed ? "LAB2." : "LAB3.") + b64enc(enc);
    } catch (e) { }
  }
  return tagPlain + b64enc(body);
}
async function decodePayload(code) {
  const s = String(code || "").trim().replace(/\s+/g, "");
  const i = s.indexOf(".");
  if (i < 0) throw new Error("Cod invalid");
  const tag = s.slice(0, i), data = s.slice(i + 1);
  let bytes = b64dec(data), enc = false;
  if (tag === "LAB2" || tag === "LAB3") {
    if (!Crypt.ok()) throw new Error("Browserul nu poate descifra coduri criptate.");
    const pk = await privKey();
    if (!pk) throw new Error("Cod criptat: lipsește cheia privată. Importă cheia în fila „Acces studenți”.");
    try { bytes = await Crypt.decrypt(bytes, pk); }
    catch (e) { throw new Error("Cod criptat cu altă cheie decât a ta."); }
    enc = true;
  } else if (tag !== "LAB0" && tag !== "LAB1") {
    throw new Error("Format necunoscut: " + tag);
  }
  if (tag === "LAB1" || tag === "LAB2") bytes = await inflate(bytes);
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (o && typeof o === "object") o.__enc = enc;
  return o;
}
function csvCell(v) { const s = String(v == null ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(rows) { return "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n"); }

/* ============================ laboratoare demonstrative ============================ */
const BUILTIN = [
 {
  "id": "lucrarea-1",
  "title": "Prezentarea generală a unei instalații de uscare",
  "course": "Lucrarea 1 · Uscarea lemnului",
  "teacher": "",
  "teacherEmail": "",
  "duration": "2 ore",
  "date": "",
  "selfCheck": true,
  "objectives": [
   "Descrie construcția propriu-zisă a unei instalații de uscare: scheletul, carcasa, ușile și planșeul intermediar.",
   "Identifice elementele componente ale instalației de uscare și rolul fiecăruia.",
   "Cunoască principalele caracteristici tehnice ale unei instalații de uscare.",
   "Pregătească instalația în vederea uscării unei noi șarje."
  ],
  "body": "## 1.1. Introducere\n\nÎn orice întreprindere de prelucrare a lemnului, uscarea constituie un proces tehnologic obligatoriu, prin care se urmărește reducerea umidității lemnului până la un anumit nivel, în funcție de destinație. În acest fel se preîntâmpină schimbările dimensionale sau de formă, asigurându-se una dintre condițiile de bază ale interschimbabilității reperelor în cadrul unui produs.\n\nPentru a asigura reducerea uniformă a umidității materialului pe secțiunea și lungimea pieselor, precum și în cuprinsul întregului lot de material, parametrii mediului de uscare trebuie să poată fi controlați riguros. Acest lucru nu este posibil în cazul uscării naturale (în aer liber), ci doar în interiorul unor instalații speciale, dotate cu sursă de încălzire, umezire și circulație forțată a aerului. Aceste agregate poartă denumirea de **instalații de uscare**.\n\nExistența unor fabrici cu diferite capacități de uscare a impus un **sistem constructiv modulat** al instalațiilor de uscare, care să permită adaptarea capacității instalației la necesitățile fabricii. Instalațiile moderne sunt construite din prefabricate modulate, care permit realizarea oricăror dimensiuni ale carcasei.\n\nÎn cadrul Laboratorului de Tratamente Termice ale Lemnului se găsește o instalație tip **SEBA**, cu ventilatoare axiale acționate individual, amplasate deasupra planșeului intermediar (Fig. 1.1), care funcționează după principiul uscării cu schimb de aer cu mediul exterior (uscare „convențională”).\n\n![Instalația de uscare SEBA — schemă](l1-fig11)\n\n*Fig. 1.1. Instalație de uscare cu ventilatoare axiale acționate individual (SEBA): 1 — stiva de cherestea; 2 — țevi de calorifer; 3 — țeavă de pulverizare a apei; 4 — ventilator axial cu motor electric montat direct pe ax; 5 — coșuri de admisie/evacuare a aerului; 6 — planșeu intermediar.*\n\n## 1.2. Construcția propriu-zisă\n\nElementele constructive ale oricărei instalații de uscare sunt: **scheletul de rezistență** și **carcasa propriu-zisă**, formată din pereți, planșeu superior și ușă. În funcție de materialele folosite în structura lor, instalațiile de uscare pot fi metalice, din zidărie sau din beton.\n\nCele mai răspândite sunt **instalațiile metalice**, datorită avantajelor pe care le oferă: etanșeitate foarte bună, protecție deosebită împotriva coroziunii, izolare termică și hidrofugă foarte bună. În plus, necesită un spațiu de amplasare mai redus decât cele din zidărie, pot fi transportate ușor, se montează rapid direct la beneficiar, pe o platformă betonată, și nu necesită întreținere.\n\nInstalația de uscare din laborator este de construcție metalică, cu carcasa realizată din **panouri prefabricate cu structură de tip „sandwich”** (Fig. 1.2). La instalația SEBA, panourile cuprind **două table de aluminiu cu grosimea de 2 mm, cu un strat de poliuretan de 100 mm între ele**. La exterior se poate folosi și un alt material (de exemplu, tablă neagră de oțel), întrucât partea exterioară a carcasei trebuie să reziste numai la intemperii, nu și la acțiunea corozivă a acizilor degajați din lemn.\n\n![Structura tip sandwich a panourilor](l1-fig12)\n\n*Fig. 1.2. Structura tip „sandwich” a panourilor prefabricate.*\n\n**Ușile** instalațiilor de uscare au aceeași structură constructivă tip sandwich. Ele trebuie să asigure o etanșeitate absolută pe contur, fiind prevăzute în acest scop cu garnituri, care trebuie reînnoite periodic. Dintre variantele de deschidere, cea mai frecventă este **ușa glisantă cu sistem de rulare laterală** (Fig. 1.3a) — vezi instalația SEBA.\n\n| ![Ușă glisantă](l1-fig13a) | ![Uși cu canaturi](l1-fig13b) |\n| a — ușă glisantă, cu sistem de rulare laterală | b — uși cu canaturi |\n\n*Fig. 1.3. Tipuri de uși.*\n\n**Planșeul intermediar** desparte spațiul util de uscare (în care este amplasată stiva) de spațiul tehnic (în care sunt amplasate caloriferul, ventilatoarele etc.). În mod uzual este o placă din aluminiu ondulat — vezi instalația SEBA.\n\n## 1.3. Elemente componente\n\nPentru a funcționa ca instalație de uscare, incinta închisă trebuie dotată cu o serie de **agregate specifice**:\n\n- calorifer (țevi de încălzire);\n- țeavă de umezire;\n- sistem de circulație forțată a aerului prin stive;\n- coșuri pentru schimbul de aer cu mediul exterior.\n\nÎn afara acestor componente obligatorii, instalațiile de uscare mai sunt prevăzute, de obicei, cu un sistem de stivuire și transport, precum și cu aparatură specifică de măsurare, reglare și control.\n\n### Caloriferul\n\nAre rolul de **ridicare și menținere a temperaturii** la valoarea de regim. Se folosesc în general țevi cu aripioare, prin care circulă agentul termic: apă încălzită sub presiune, vapori, ulei termic etc. Există și posibilitatea utilizării unor încălzitoare electrice, dar consumul energetic este foarte mare, având în vedere durata lungă a proceselor de uscare.\n\nLa instalația SEBA, de construcție mai modernă, s-au utilizat **țevi bimetalice** (Fig. 1.4), realizate dintr-un miez de oțel inoxidabil și un înveliș cu aripioare din aluminiu. Aluminiul rezistă foarte bine la acțiunea acizilor, este mai maleabil și asigură un transfer termic mai bun decât oțelul inoxidabil; în schimb, oțelul inoxidabil este mai rezistent în medii alcaline. De aceea, construcția bimetalică este considerată în prezent soluția optimă: țevile de încălzire sunt supuse atât contactului cu un mediu alcalin (agentul termic din interiorul țevii), cât și cu un mediu acid (aerul din instalație, încărcat cu acizii eliminați odată cu apa din lemn).\n\n![Țeavă bimetalică](l1-fig14)\n\n*Fig. 1.4. Țeavă bimetalică.*\n\nȚevile de încălzire trebuie amplasate **în secțiunea de intrare a aerului în stivă**. La instalațiile cu ventilatoare amplasate deasupra stivelor, țevile de calorifer sunt amplasate orizontal, în partea superioară a instalației, puțin deasupra planșeului intermediar (ca la instalația SEBA).\n\n### Țeava de umezire\n\nAre rolul de **ridicare a umidității relative a aerului** din interiorul camerei de uscare, atunci când este necesar. Agentul de umezire poate fi apă rece sau vapori umezi. La instalația SEBA, țeava de umezire este prevăzută cu **duze de pulverizare** (Fig. 1.5), care transformă apa în ceață (picături foarte fine de apă în suspensie). Țeava se amplasează cu orificiile orientate astfel încât curentul de aer să preia ușor agentul de umezire.\n\n![Țeavă de umezire cu duze](l1-fig15)\n\n*Fig. 1.5. Țeavă de umezire cu duze de pulverizare a apei.*\n\n### Ventilatoarele\n\nPentru o uscare corespunzătoare, **viteza aerului în stivă trebuie să fie de cel puțin 1,5 m/s la uscarea foioaselor și de cel puțin 2,5 m/s la uscarea rășinoaselor**. Pentru aceasta, instalațiile de uscare sunt dotate în general cu ventilatoare axiale, amplasate central deasupra planșeului intermediar și acționate individual de un motor electric montat direct pe axul ventilatorului (Fig. 1.6) — vezi instalația SEBA. În acest caz, motoarele electrice necesită o carcasare specială, pentru a rezista acțiunii corozive a aerului din interiorul instalației.\n\n![Ventilator axial](l1-fig16)\n\n*Fig. 1.6. Ventilator axial cu motor electric montat direct pe ax.*\n\nLa instalațiile moderne, motorul de antrenare a ventilatorului este prevăzut și cu un **variator continuu de turație**. Acesta permite schimbarea sensului de rotație la anumite intervale de timp, precum și varierea vitezei aerului în stivă pe parcursul procesului: viteză mai mare la începutul procesului, când se evaporă apa liberă din lemn, și mai mică spre final, pentru a economisi energie.\n\n### Coșurile pentru schimbul de aer cu mediul exterior\n\nAu rolul de a **primeni (desumidifica) aerul** din interiorul instalației. Atunci când umiditatea aerului din instalație devine mai mare decât cea prevăzută de regim, prin deschiderea coșurilor se elimină o parte din acest aer „utilizat” și, simultan, se admite o cantitate egală de aer „proaspăt”, cu umiditate relativă mai mică. Coșurile de aer pot avea secțiune dreptunghiulară (vezi instalația SEBA) sau circulară.\n\nEle se prevăd **întotdeauna în număr par și de secțiune egală**, astfel încât cantitatea de aer admis și cea de aer evacuat să fie întotdeauna egale. Pentru reglarea debitului de aer schimbat cu exteriorul, coșurile sunt prevăzute cu clapete de reglare (Fig. 1.7a), care pot fi acționate și manual, dar de regulă sunt prevăzute cu servomotoare pentru acționarea automată (Fig. 1.7b).\n\n| ![Coșuri de aer — vedere de ansamblu](l1-fig17a) | ![Acționarea clapetei](l1-fig17b) |\n| a — vedere de ansamblu | b — detaliu privind acționarea clapetei |\n\n*Fig. 1.7. Coș de aer prevăzut cu clapetă pentru reglarea debitului de aer.*\n\n### Sistemul de stivuire și transport\n\nPermite încărcarea și descărcarea rapidă a instalației, precum și susținerea stivei în timpul uscării. De cele mai multe ori, încărcarea și descărcarea camerei se fac cu un stivuitor cu furci; stiva, susținută de un palet, se așază direct pe grinzi distanțiere puse pe pardoseala betonată a camerei — vezi instalația SEBA.\n\n### Aparatura de măsurare, reglare și control\n\nPentru buna desfășurare a procesului de uscare este necesară monitorizarea continuă a parametrilor de proces: umiditatea lemnului, temperatura și umiditatea aerului. Aceasta se poate realiza și manual, dar instalațiile moderne sunt prevăzute în general cu sisteme automate de conducere a procesului, care măsoară și reglează parametrii de la distanță. Construcția acestor aparate și modul lor de utilizare fac obiectul unor lucrări ulterioare.\n\n## 1.4. Caracteristicile tehnice ale instalațiilor de uscare\n\nOrice instalație de uscare este caracterizată de o serie de date tehnice, care permit evaluarea performanțelor ei și compararea cu alte instalații similare:\n\n- dimensiunile de gabarit — necesare pentru planificarea amplasării;\n- dimensiunile interioare;\n- dimensiunile stivelor (în funcție de mijlocul de stivuire utilizat) — necesare pentru estimarea capacității de încărcare;\n- capacitatea de încărcare;\n- caracteristicile caloriferului, suprafața de încălzire;\n- caracteristicile țevilor de umezire;\n- numărul de ventilatoare, diametrul și debitul acestora;\n- puterea instalată și turația motoarelor electrice;\n- masa instalației etc.\n\n**Tabelul 1.1. Caracteristicile tehnice ale instalației de uscare tip SEBA**\n\n| Caracteristici tehnice | Instalația SEBA |\n|---|---|\n| Dimensiuni de gabarit (lungime × lățime/adâncime × înălțime), m | 4,0 × 2,7 × 3,4 |\n| Dimensiuni interioare (lungime × lățime/adâncime × înălțime utilă), m | 3,8 × 2,5 × 2,2 |\n| Dimensiunile stivei (lungime × lățime/adâncime × înălțime), m | 3,0 × 1,25 × 2,0 |\n| Capacitatea maximă de încărcare, m³/șarjă | 6 |\n| Caracteristicile țevilor de încălzire | 6 țevi bimetalice, cu aripioare |\n| Suprafața de încălzire a caloriferului, m² | 30 |\n| Caracteristicile țevilor de umezire | 2 țevi de pulverizare a apei, cu duze atomizoare speciale și filtru încorporat |\n| Numărul de ventilatoare | 2 |\n| Diametrul ventilatoarelor, mm | 900 |\n| Debitul de aer, m³/h | 30000 |\n| Turația motoarelor electrice | variabilă continuu, 0...1400 rpm |\n| Puterea instalată, kW | 2 × 1,5 |\n| Posibilitate de inversare a sensului aerului prin stivă | da |\n| Numărul și dimensiunile coșurilor de aer | 4, secțiune pătrată cu latura a = 30 cm |\n\n## 1.5. Pregătirea instalației în vederea uscării\n\nÎnainte de a introduce o nouă șarjă de cherestea la uscare, se verifică:\n\n- etanșeitatea ventilelor de pe conducta de alimentare a caloriferului;\n- etanșeitatea ventilelor de pe conducta de alimentare a țevii de umezire și faptul că orificiile acesteia nu sunt înfundate;\n- dacă ventilatoarele sunt echilibrate (să nu „bată”);\n- funcționarea ușoară a clapetelor din coșurile de aer;\n- integritatea cablurilor, în cazul folosirii unor senzori de măsurare de la distanță;\n- etanșeitatea ușilor pe contur etc.\n\n---\n\n## Referatul lucrării\n\nRăspunsurile la întrebările cu răspuns liber de mai jos reprezintă referatul aferent acestei lucrări. Schema instalației SEBA, cerută la întrebarea despre agregatele componente, se desenează pe hârtie și se predă odată cu referatul.\n\n---\n\n*Sursa textului și a figurilor: îndrumarul de laborator al disciplinei.*\n",

/* Modul profesor este închis cu un cod ales de cadrul didactic. Codul nu se
   păstrează niciodată în clar — se compară o amprentă a lui. */
const PIN_SALT = "caiet-laborator|";
async function hashPin(pin) {
  const txt = PIN_SALT + String(pin);
  try {
    if (typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return "h" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { }
  /* pagina deschisă direct de pe disc nu are funcții criptografice */
  return "s" + hashStr(txt).toString(36) + hashStr(txt + "|2" + pin).toString(36);
}
function pinSet() { return !!LS.get(K.pin, ""); }
function sessUnlocked() {
  try { return sessionStorage.getItem("cl.unlocked") === "1"; } catch (e) { return false; }
}
function setUnlocked(v, keep) {
  S.unlocked = v;
  try { v ? sessionStorage.setItem("cl.unlocked", "1") : sessionStorage.removeItem("cl.unlocked"); } catch (e) { }
  if (keep === true) LS.set(K.keep, true);
  if (keep === false || !v) LS.del(K.keep);
}
function lockProf() {
  setUnlocked(false, false);

async function submitGate() {
  const first = !pinSet();
  const v1 = ($("#pin1") || {}).value || "";
  if (first) {
    const v2 = ($("#pin2") || {}).value || "";
    if (v1.length < 4) return pinError("Codul trebuie să aibă cel puțin 4 caractere.");
    if (v1 !== v2) return pinError("Cele două coduri nu coincid.");
    LS.set(K.pin, await hashPin(v1));
    setUnlocked(true, false);
    closeModal(); S.role = "prof"; LS.set(K.role, "prof"); S.tab = "labs"; render();
    toast("Cod salvat — modul profesor este deschis");
    return;
  }
  const want = LS.get(K.pin, "");
  if ((await hashPin(v1)) !== want) return pinError("Cod greșit.");
  const keep = !!(($("#pinKeep") || {}).checked);
  setUnlocked(true, keep);
  closeModal(); S.role = "prof"; LS.set(K.role, "prof"); S.tab = "labs"; render(); window.scrollTo(0, 0);
}

/* Lucrările livrate cu pagina (BUILTIN) rămân în pagină. În browser se salvează
   doar lucrările create sau modificate de profesor — acestea pot avea figuri proprii. */
let USER_LABS = [], HIDDEN = [];
/* Paginile publice nu conțin baremul (vezi tools/barem.py). Profesorul îl
   încarcă o dată, ca fișier; se păstrează doar în browserul lui. */
let BAREM = {};
function withBarem(l) {
  const b = l.stripped && BAREM[l.id];
  if (!b) return l;
  (l.questions || []).forEach(q => Object.assign(q, (b.questions || {})[q.id] || {}));
  delete l.stripped;
  return l;
}
/* Punctajul imediat: cheia de punctare stă în pagină codificată (`k`), nu ca
   text citibil. Studentul vede doar totalul, nu și care răspunsuri sunt corecte.
   Nu e o încuietoare: cine citește codul-sursă o poate decoda. */
function scoringLab(l) {
  if (!l || !l.k) return l;
  let keys = null;
  try {
    const b = Uint8Array.from(atob(l.k), c => c.charCodeAt(0));
    for (let i = 0; i < b.length; i++) b[i] ^= (l.id.charCodeAt(i % l.id.length) + i * 31) & 255;
    keys = JSON.parse(new TextDecoder().decode(b));
  } catch (e) { return l; }
  const c = JSON.parse(JSON.stringify(l));
  (c.questions || []).forEach(q => { const k = keys[q.id] || {}; Object.keys(k).forEach(f => { if (q[f] == null) q[f] = k[f]; }); });
  return c;
}
function hideKey(r) {
  r.scoreOnly = true;
  r.items.forEach(it => { it.ok = null; it.correct = null; it.earned = null; });
  return r;
}
function rebuildLabs() {
  const byId = {};
  USER_LABS.forEach(l => { if (l && l.id) byId[l.id] = l; });
  const out = [];
  BUILTIN.forEach(b => {
    if (HIDDEN.indexOf(b.id) >= 0) return;
    out.push(withBarem(byId[b.id] ? byId[b.id] : JSON.parse(JSON.stringify(b))));
  });
  USER_LABS.forEach(l => { if (!BUILTIN.some(b => b.id === l.id) && HIDDEN.indexOf(l.id) < 0) out.push(l); });
  S.labs = out;
  if (!S.labId || !S.labs.some(l => l.id === S.labId)) S.labId = S.labs[0] ? S.labs[0].id : null;
}
let saveErr = false;
async function persistLabs() {
  const ok1 = await Store.set(K.labs, USER_LABS);
  await Store.set(K.hidden, HIDDEN);
  if (!ok1 && !saveErr) { saveErr = true; toast("Spațiu de salvare limitat — exportă pachetul de lucrări ca siguranță"); }
}
function storeLab(l) {
  const copy = JSON.parse(JSON.stringify(l));
  const i = USER_LABS.findIndex(x => x.id === copy.id);
  if (i >= 0) USER_LABS[i] = copy; else USER_LABS.push(copy);
  HIDDEN = HIDDEN.filter(id => id !== copy.id);
  rebuildLabs(); persistLabs();
}
function removeLab(id) {
  USER_LABS = USER_LABS.filter(x => x.id !== id);
  if (HIDDEN.indexOf(id) < 0) HIDDEN.push(id);
  rebuildLabs(); persistLabs();
}
function restoreBuiltins() { HIDDEN = []; rebuildLabs(); persistLabs(); }
/* O lucrare livrată cu pagina, dar salvată (modificată sau importată) în acest browser:
   copia locală are prioritate, inclusiv la corectare. */
function localCopyOf(id) { return isBuiltin(id) ? USER_LABS.find(x => x && x.id === id) || null : null; }
function differsFromBuiltin(id) {
  const c = localCopyOf(id), b = BUILTIN.find(x => x.id === id);
  if (!c || !b) return false;
  return c.title !== b.title || c.body !== b.body || JSON.stringify(c.questions) !== JSON.stringify(b.questions);
}
function resetToBuiltin(id) {

}
function isBuiltin(id) { return BUILTIN.some(b => b.id === id); }

function lab() { return S.labs.find(l => l.id === S.labId) || null; }
function totalPts(l) { return (l.questions || []).reduce((a, q) => a + (Number(q.points) || 0), 0); }
function autoPts(l) { return (l.questions || []).filter(q => q.type !== "open").reduce((a, q) => a + (Number(q.points) || 0), 0); }
function mySeed() { const l = lab(); return l ? seedFor(S.student.name, S.student.group, l.id) : 0; }
function identOK() { return (S.student.name || "").trim().length > 2 && (S.student.group || "").trim().length > 0; }

function stripLab(l) {
  const c = JSON.parse(JSON.stringify(l));
  c.stripped = true;
  (c.questions || []).forEach(q => {
    delete q.explain; delete q.model; delete q.solution;
    if (!l.selfCheck) { delete q.correct; delete q.expr; delete q.tolPct; delete q.tolAbs; }
  });
  if (!l.selfCheck) c.selfCheck = false;
  return c;
}
/* corectare automată; `full` = laboratorul cu răspunsuri (la profesor) */
function givenFor(q, sub) {
  if (q.type !== "num") return {};
  if (sub.given && sub.given[q.id]) return sub.given[q.id];
  if (sub.seed != null) return genVars(q, sub.seed);
  return {};
}
function gradeSub(full, sub) {
  full = scoringLab(full);
  const res = { items: [], auto: 0, autoMax: 0, openMax: 0 };
  (full.questions || []).forEach(q => {
    const pts = Number(q.points) || 0;
    const given = givenFor(q, sub);
    const a = sub.answers ? sub.answers[q.id] : undefined;
    const it = { id: q.id, type: q.type, points: pts, answer: a, given: given, ok: null, earned: 0, correct: null };
    if (q.type === "mcq") {
      res.autoMax += pts;
      if (typeof q.correct === "number") { it.correct = q.correct; it.ok = Number(a) === q.correct; it.earned = it.ok ? pts : 0; res.auto += it.earned; }
    } else if (q.type === "num") {
      res.autoMax += pts;
      if (q.expr) {
        const cv = evalExpr(q.expr, given);
        it.correct = cv;
        const av = parseNum(a);
        const tol = Math.max(Number(q.tolAbs) || 0, (Number(q.tolPct) || 0) / 100 * Math.abs(cv));
        it.ok = isFinite(av) && isFinite(cv) && Math.abs(av - cv) <= (tol || Math.abs(cv) * 0.02);
        it.earned = it.ok ? pts : 0; res.auto += it.earned;
      }
    } else { res.openMax += pts; }
    res.items.push(it);
  });
  return res;
}

/* Toate grilele unei lucrări formează un singur test „Grilă”, afișat în locul primei grile.

function qBlocks(l) {

  let n = 0;

    if (q === mcqs[0]) out.push({ grila: true, items: mcqs.map(m => ({ q: m, i: n++ })) });
  });
  return out;
}

function canShare() { try { return typeof navigator !== "undefined" && typeof navigator.share === "function"; } catch (e) { return false; } }
function subjectFor(l) {

function mailtoFor(l, r) {
  const body = "Bună ziua,\n\nTrimit codul de predare pentru laboratorul „" + l.title + "”.\n\n" + r.code +
    "\n\n" + (S.student.name || "") + ", grupa " + (S.student.group || "");
  return "mailto:" + encodeURIComponent(l.teacherEmail || "") + "?subject=" + encodeURIComponent(subjectFor(l)) + "&body=" + encodeURIComponent(body);

async function shareSubmission() {
  const l = lab(), r = S.result;
  if (!l || !r) return;
  const payload = { title: subjectFor(l), text: subjectFor(l) + "\n\n" + r.code };
  try { await navigator.share(payload); return; }
  catch (e) { if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) { if (e.name === "AbortError") return; } }
  await copyText(r.code);
  toast("Partajarea nu e disponibilă aici — codul a fost copiat");
}

function guessLink() {
  const sb = siteBase();
  if (sb) return sb;
  const saved = LS.get(K.link, "");
  if (saved) return saved;
  try {
    const r = document.referrer || "";
    if (/^https:\/\/(www\.)?claude\.ai\//.test(r)) return r.split("#")[0];
  } catch (e) { }
  try {
    const h = location.href;
    if (/^https?:/.test(h)) return h.split("#")[0];
  } catch (e) { }
  return "";
}
function keyParam() { const k = pubKey(); return k ? "&k=" + k : ""; }

/* Site-ul (GitHub Pages): index.html = toate lucrările, lucrari/<id>.html = doar lucrarea respectivă.
   Adresa vine din setari.json („site”) sau, pe paginile site-ului („auto”), din adresa paginii. */
function siteBase() {
  try {
    const P = window.__CL_PRESET || {}, s = String(P.site || "");
    if (!s) return "";
    if (s !== "auto") return /\/$/.test(s) ? s : s + "/";
    const h = String(location.href).split("#")[0].split("?")[0];
    if (!/^https?:/i.test(h)) return "";
    const i = h.indexOf("/lucrari/");
    return i >= 0 ? h.slice(0, i + 1) : h.replace(/[^/]*$/, "");
  } catch (e) { return ""; }
}
function labUrl(l) {
  if (!l) return appLink();
  if (l.link) return l.link;

}
function onClaude() { return /^https:\/\/([a-z0-9-]+\.)*claude\.ai\//i.test(guessLink()); }
function appLink() {
  const sb = siteBase();

/* ---------- situația studenților ---------- */
function studKey(c) {
  return (c.name || "").trim().toLowerCase().replace(/\s+/g, " ") + "|" + (c.group || "").trim().toLowerCase();
}
function notaOf(c) {
  const r = catRow(c);
  const typed = c.nota != null && String(c.nota).trim() !== "" ? parseNum(c.nota) : NaN;
  if (isFinite(typed)) return { nota: typed, propusa: false, r: r };
  if (r.max) return { nota: 1 + 9 * r.total / r.max, propusa: true, r: r };
  return { nota: null, propusa: true, r: r };
}
function gradebook() {
  const order = S.labs.map(l => l.id);
  const used = [], byStud = {};
  S.catalog.forEach(c => {
    const k = studKey(c);
    if (!byStud[k]) byStud[k] = { key: k, name: c.name, group: c.group, labs: {} };
    const n = notaOf(c);
    const prev = byStud[k].labs[c.labId];
    /* dacă un student a predat de două ori aceeași lucrare, rămâne fișa cea mai recentă */
    if (!prev || String(c.submittedAt || "") >= String(prev.submittedAt || "")) {
      byStud[k].labs[c.labId] = { nota: n.nota, propusa: n.propusa, total: n.r.total, max: n.r.max, pending: n.r.pending, submittedAt: c.submittedAt, subKey: c.key };
    }
    if (used.indexOf(c.labId) < 0) used.push(c.labId);
  });
  used.sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const rows = Object.keys(byStud).map(k => {
    const st = byStud[k];
    const notes = used.map(id => st.labs[id] ? st.labs[id].nota : null).filter(n => n != null && isFinite(n));
    st.count = notes.length;
    st.final = notes.length ? notes.reduce((a, b) => a + b, 0) / notes.length : null;
    let tot = 0, max = 0;
    used.forEach(id => { const x = st.labs[id]; if (x && x.max) { tot += x.total; max += x.max; } });
    st.pct = max ? tot / max * 100 : null;
    st.anyPending = used.some(id => st.labs[id] && st.labs[id].pending);
    return st;
  }).sort((a, b) => (a.group + " " + a.name).localeCompare(b.group + " " + b.name, "ro"));
  return { used: used, rows: rows };
}
function labShort(id) {
  const l = S.labs.find(x => x.id === id);
  if (!l) return id;
  const m = String(l.course || l.title).match(/(\d+)/);
  return m ? "L" + m[1] : (l.course || l.title).slice(0, 8);
}

function renderHelp() {
  return '<div class="card doc" style="max-width:76ch">' + renderMd(
    "## Confiden\u021bialitatea r\u0103spunsurilor\n\n\u00cen fila *Acces studen\u021bi*, butonul **Genereaz\u0103 cheile** creeaz\u0103 o pereche de chei: cheia **public\u0103** pleac\u0103 la studen\u021bi \u00een codurile QR, cheia **privat\u0103** r\u0103m\u00e2ne doar la tine. De atunci, fiecare fi\u0219\u0103 predat\u0103 este criptat\u0103 pentru tine: nici studentul care a scris-o, nici colegii lui nu o mai pot deschide, chiar dac\u0103 \u00ee\u0219i trimit codurile \u00eentre ei. \u00cen catalog, fi\u0219ele primite criptat sunt marcate cu un lac\u0103t.\n\n> **P\u0103streaz\u0103 fi\u0219ierul cheii.** La generare se descarc\u0103 automat un fi\u0219ier `cheie-profesor-XXXXXX.json`. Cheia privat\u0103 exist\u0103 doar \u00een browserul acestui calculator; dac\u0103 o pierzi, fi\u0219ele deja primite nu mai pot fi deschise de nimeni. Pune fi\u0219ierul \u00een dou\u0103 locuri sigure \u0219i import\u0103-l pe orice alt calculator pe care corectezi.\n\nStudentul deschide fi\u0219a prin codul QR, care con\u021bine \u0219i cheia. Dac\u0103 ajunge la aplica\u021bie altfel \u0219i nu are cheia, codul lui iese necriptat \u0219i aplica\u021bia \u00eei spune asta \u2014 tu \u00eel vezi \u00een catalog f\u0103r\u0103 lac\u0103t. Pe calculatoarele din laborator, deschide aplica\u021bia o dat\u0103 cu adresa care con\u021bine cheia (o g\u0103se\u0219ti sub fiecare cod QR): aplica\u021bia o re\u021bine pentru urm\u0103toarele deschideri de pe acel calculator.\n\n## Accesul la modul profesor\n\nModul profesor este \u00eenchis cu un cod pe care \u00eel alegi tu, la prima intrare. Studen\u021bii care deschid linkul v\u0103d doar fi\u0219a de laborator \u2014 comutatorul *Student / Profesor* nici nu apare la ei. Ca s\u0103 intri, apas\u0103 insigna **LAB** din col\u021bul st\u00e2nga sus \u0219i scrie codul; la ie\u0219ire, ape\u0219i lac\u0103tul din dreapta sus. Pe calculatoarele din laborator **nu bifa** „\u021aine minte pe acest calculator\u201d.\n\n> Codul \u021bine studen\u021bii departe de editor, de catalog \u0219i de note. Nu este \u00eens\u0103 o \u00eencuietoare de seif: cine se pricepe poate citi codul-surs\u0103 al paginii. Pentru lucr\u0103ri notate, apărarea real\u0103 r\u0103m\u00e2ne faptul c\u0103 fiecare student prime\u0219te alte date numerice.\n\n## Pe scurt\n\n1. **Creezi sau editezi lucrarea** \u00een fila *Editor*: antet, descriere, figuri, \u00eentreb\u0103ri gril\u0103, aplica\u021bii numerice cu date generate individual \u0219i \u00eentreb\u0103ri cu r\u0103spuns liber.\n2. **Afi\u0219ezi codul QR** al lucr\u0103rii din fila *Acces studen\u021bi*. Fiecare lucrare are propriul cod, care se actualizeaz\u0103 singur c\u00e2nd ad\u0103ugi sau sco\u021bi lucr\u0103ri.\n3. **Studentul** \u00ee\u0219i scrie numele \u0219i grupa (a\u0219a prime\u0219te propriul set de date numerice), r\u0103spunde \u0219i apas\u0103 *Finalizeaz\u0103*. Fi\u0219a se salveaz\u0103 automat pe parcurs, deci poate \u00eenchide pagina \u0219i relua mai t\u00e2rziu.\n4. **Trimiterea**: dintr-o ap\u0103sare, prin e-mail, WhatsApp sau Teams \u2014 sau, f\u0103r\u0103 semnal, ca un cod QR pe care \u00eel scanezi de pe ecranul lui.\n5. **Tu** lipe\u0219ti \u00een *Catalog* tot ce ai primit \u2014 un e-mail, o conversa\u021bie, oric\u00e2t text: aplica\u021bia g\u0103se\u0219te singur\u0103 toate codurile. Corecteaz\u0103 automat grilele \u0219i aplica\u021biile numerice; tu acorzi punctajul la r\u0103spunsurile libere.\n6. **Nota final\u0103** apare \u00een fila *Note finale*: media notelor de la lucr\u0103rile predate, cu export \u00een Excel \u0219i clasament pe grupe pentru proiec\u021bie.\n\n## Cum adaugi o lucrare nou\u0103, f\u0103r\u0103 ajutor din afar\u0103\n\n1. *Laboratoare* \u2192 **Laborator nou**.\n2. Completezi antetul \u0219i descrierea. Textul accept\u0103 titluri (`## Titlu`), liste, \u00eengro\u0219at (`**text**`), tabele cu `|`, indici `x_{i}` \u0219i exponen\u021bi `x^{2}`.\n3. **Figurile**: butonul *Figuri disponibile* \u2192 *Adaug\u0103 figuri din calculator*. Aplica\u021bia le mic\u0219oreaz\u0103 singur\u0103 \u0219i le salveaz\u0103 \u00een lucrare; le inserezi cu un clic, care copiaz\u0103 codul `![descriere](cheie)`.\n4. Adaugi \u00eentreb\u0103rile \u0219i ape\u0219i *Salveaz\u0103*. Lucrarea apare imediat \u00een list\u0103 \u0219i prime\u0219te automat propriul cod QR.\n5. Din c\u00e2nd \u00een c\u00e2nd apas\u0103 **Export\u0103 pachetul** \u2014 un singur fi\u0219ier cu toate lucr\u0103rile \u0219i figurile lor, pe care \u00eel po\u021bi reimporta oric\u00e2nd, pe orice calculator.\n\n## Aplica\u021bii numerice individuale\n\nFiecare aplica\u021bie numeric\u0103 poate avea variabile cu interval, pas \u0219i unitate de m\u0103sur\u0103. Valorile se genereaz\u0103 dintr-un *cod de date* derivat din numele \u0219i grupa studentului: sunt diferite de la student la student, dar identice la fiecare redeschidere pentru acela\u0219i student. Corectarea folose\u0219te exact valorile primite de el. Dac\u0103 pui aceea\u0219i valoare la *min* \u0219i la *max*, \u00eentrebarea devine fix\u0103, cu datele din \u00eendrumar.\n\n## R\u0103spunsurile corecte\n\nCu *autoevaluarea* pornit\u0103, studentul \u00ee\u0219i vede punctajul imediat \u2014 dar r\u0103spunsurile corecte se afl\u0103 \u00een pachetul trimis lui. Pentru lucr\u0103ri notate, oprete autoevaluarea: pachetul studentului va con\u021bine doar enun\u021burile, iar corectarea se face la tine.\n\nLucrările livrate cu pagina publică nu conțin baremul: studentul își vede doar punctajul total, nu și care răspunsuri sunt corecte. Pe calculatorul tău, încarcă o dată fișierul de barem (`barem-lucrari.json`) din *Laboratoare* → **Importă…**: aplicația îl păstrează în acest browser și corectează cu el. Nu îl încărca pe calculatoarele din laborator și nu îl pune pe site.\n\n## Unde se p\u0103streaz\u0103 datele\n\nLucr\u0103rile livrate cu pagina vin odat\u0103 cu fi\u0219ierul. Lucr\u0103rile pe care le creezi sau le modifici tu, figurile lor \u0219i catalogul se salveaz\u0103 **\u00een browserul acestui calculator**, \u00eentr-o baz\u0103 de date local\u0103 care suport\u0103 \u0219i imagini. Nu se sincronizeaz\u0103 \u00eentre dispozitive \u0219i se pierd dac\u0103 \u0219tergi datele browserului \u2014 de aceea *Export\u0103 pachetul* \u0219i *Backup JSON* din Catalog sunt importante.\n\n## \u0218tergerea unei lucr\u0103ri\n\n*\u0218terge* scoate lucrarea din list\u0103 \u0219i o \u021bine ascuns\u0103 \u0219i dup\u0103 reînc\u0103rcarea paginii. Dac\u0103 te r\u0103zg\u00e2nde\u0219ti, \u00een capul listei apare butonul *Readu-le*.") + "</div>";
}

async function doSubmit() {
  const l = lab(); if (!l || !identOK()) return;
  const n = (l.questions || []).length, d = answeredCount(l);
  if (d < n) {
    const ok = await confirmModal("Fișă incompletă", "Ai completat " + d + " din " + n + " întrebări. Întrebările necompletate se punctează cu zero. Trimiți fișa acum?", "Trimit fișa");

  }
  const given = {}, answers = {};
  (l.questions || []).forEach(q => {

function fileToDataURL(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error("citire"));
    r.readAsDataURL(f);
  });
}
/* micșorează imaginea în browser, ca fișierul lucrării să rămână mic */
function shrinkImage(dataUrl, maxW) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const w = Math.min(maxW || 900, im.naturalWidth || maxW);
      const h = Math.max(1, Math.round((im.naturalHeight || 1) * w / (im.naturalWidth || w)));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      let out = null;
      try { out = c.toDataURL("image/webp", 0.8); } catch (e) { }
      if (!out || out.indexOf("data:image/webp") !== 0) { try { out = c.toDataURL("image/jpeg", 0.82); } catch (e) { out = null; } }
      res(out || dataUrl);
    };
    im.onerror = () => res(null);
    im.src = dataUrl;
  });
}
function slugKey(name, taken) {
  let b = String(name || "figura").replace(/\.[^.]+$/, "").toLowerCase()
    .replace(/[ăâà]/g, "a").replace(/[îí]/g, "i").replace(/ș|ş/g, "s").replace(/ț|ţ/g, "t").replace(/[éè]/g, "e")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28);
  if (!b) b = "figura";
  let k = b, n = 2;
  while (taken.indexOf(k) >= 0) { k = b + "-" + n; n++; }
  return k;
}
async function addFigures() {
  if (!S.edit) return;
  const files = (await pickFile("image/*", true)).filter(f => /^image\//.test(f.type));
  if (!files.length) return;
  S.edit.images = S.edit.images || {};
  let added = 0, failed = 0;
  for (const f of files) {
    try {
      const raw = await fileToDataURL(f);
      const small = await shrinkImage(raw, 900);
      if (!small) { failed++; continue; }
      const k = slugKey(f.name, Object.keys(S.edit.images).concat(Object.keys(IMG)));
      S.edit.images[k] = small;
      added++;
    } catch (e) { failed++; }
  }
  toast(added + " figuri adăugate" + (failed ? " · " + failed + " nu au putut fi citite" : ""));
  openFigModal();
}

/* ============================ import / export ============================ */
function pickFile(accept, multiple) {
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = accept || ".json,.txt"; if (multiple) inp.multiple = true;
    inp.style.display = "none"; document.body.appendChild(inp);
    inp.addEventListener("change", () => { const f = Array.from(inp.files || []); inp.remove(); res(f); });
    inp.click();
  });
}
async function readFiles(files) { return Promise.all(files.map(f => f.text())); }
async function parseAny(text) {
  const t = String(text || "").trim();
  if (!t) throw new Error("gol");
  if (t[0] === "{" || t[0] === "[") return JSON.parse(t);
  return await decodePayload(t);
}
function isLab(o) { return o && typeof o === "object" && Array.isArray(o.questions) && o.title != null; }
function isSub(o) { return o && typeof o === "object" && ((o.answers && o.labId) || (o.a && o.l)); }

async function importLabText(text) {
  const o = await parseAny(text);
  if (o && o.caietBarem && o.labs) {
    Object.assign(BAREM, o.labs);
    await Store.set(K.barem, BAREM);
    rebuildLabs(); restoreDraft();
    toast("Baremul a fost încărcat pentru " + Object.keys(o.labs).length + " lucrări");
    return;
  }
  const arr = Array.isArray(o) ? o : [o];
  let n = 0;
  arr.forEach(x => {
    if (!isLab(x)) return;
    if (!x.id) x.id = uid("lab");
    storeLab(x);
    S.labId = x.id; n++;
  });
  if (!n) throw new Error("Fișierul nu conține un laborator valid.");
  restoreDraft();
  toast(n + " laborator(oare) importate");
}
function subKey(s) { return hashStr((s.labId || "") + "|" + (s.name || "").toLowerCase().trim() + "|" + (s.group || "").toLowerCase().trim() + "|" + (s.submittedAt || "")).toString(36); }
async function importSubsText(text) {
  let added = 0, dup = 0, bad = 0;
  const push = (raw) => {
    const sb = normalizeSub(raw);
    if (!isSub(sb)) { bad++; return; }
    const key = subKey(sb);
    if (S.catalog.some(c => c.key === key)) { dup++; return; }
    S.catalog.push(Object.assign({}, sb, { key: key, manual: {}, feedback: "", nota: null, importedAt: new Date().toISOString() }));
    added++;
  };
  const ingest = async (o) => {
    if (o && typeof o === "object" && o.code && !o.answers && !o.a) {
      try { o = await decodePayload(o.code); } catch (e) { bad++; return; }
    }
    push(o);
  };
  const t = String(text || "").trim();
  let handled = false;
  /* un fișier JSON întreg (exportul unui student sau un backup de catalog) */
  if (t[0] === "{" || t[0] === "[") {
    try {
      const o = JSON.parse(t);
      const arr = Array.isArray(o) ? o : [o];
      for (const x of arr) await ingest(x);
      handled = true;
    } catch (e) { }
  }
  /* altfel: se caută toate codurile de predare din text, oriunde ar fi */
  if (!handled) {
    const codes = t.match(/LAB[0-3]\.[A-Za-z0-9_-]{8,}/g) || [];
    if (codes.length) {
      for (const c of codes) {
        try { await ingest(await decodePayload(c)); } catch (e) { bad++; }
      }
    } else { bad++; }
  }
  saveCat();
  toast(added + " fișe adăugate" + (dup ? " · " + dup + " deja existau" : "") + (bad ? " · " + bad + " neinterpretabile" : ""));
}
