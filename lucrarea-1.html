    S.ans = {}; S.result = null; render(); window.scrollTo(0, 0); return;
  }
  if (t.id === "btnImportLab") { importModal("lab"); return; }

  /* profesor — listă */
  if (t.id === "btnNewLab") { S.edit = newLab(); S.tab = "editor"; render(); return; }
  if (t.dataset.act === "copyLink") { copyText(labUrl(t.dataset.id ? S.labs.find(x => x.id === t.dataset.id) : null)); return; }
  if (t.dataset.act === "qrBig") {
    const id = t.dataset.id, l3 = id ? S.labs.find(x => x.id === id) : null;
    const u = labUrl(l3);
    openModal(l3 ? l3.course || l3.title : "Cod QR — aplicația",
      qrBlock(u, { big: true, who: l3 ? l3.title : "", after: u }),
      '<button type="button" class="btn" id="btnPrintQR">Printează</button><button type="button" class="btn" data-mclose>Închide</button>');
    return;
  }
  if (t.id === "btnPrintQR") { printModal(); return; }
  if (t.id === "btnRestore") { restoreBuiltins(); render(); toast("Lucrările incluse în pagină au fost readuse"); return; }
  if (t.id === "btnGenKey") {
    if (pubKey()) {
      const ok = await confirmModal("Ai deja o cheie", "Generarea unei chei noi face imposibilă deschiderea fișelor criptate cu cheia veche. Continui?", "Generează alta");
      if (!ok) return;
    }
    try {
      const kp = await Crypt.genPair();
      LS.set(K.pub, kp.pub); PRIV = kp.priv; await Store.set(K.priv, kp.priv);
      render();
      await saveFile("cheie-profesor-" + Crypt.fingerprint(kp.pub) + ".json",
        JSON.stringify({ tip: "cheie-caiet-laborator", amprenta: Crypt.fingerprint(kp.pub), creata: new Date().toISOString(), pub: kp.pub, priv: kp.priv }, null, 1));
      toast("Cheile au fost create — păstrează fișierul descărcat");
    } catch (e) { toast("Nu am putut genera cheile: " + (e && e.message ? e.message : "")); }
    return;
  }
  if (t.id === "btnExpKey") {
    const pk = await privKey();
    if (!pk) { toast("Cheia privată lipsește din acest browser"); return; }
    saveFile("cheie-profesor-" + Crypt.fingerprint(pubKey()) + ".json",
      JSON.stringify({ tip: "cheie-caiet-laborator", amprenta: Crypt.fingerprint(pubKey()), pub: pubKey(), priv: pk }, null, 1));
    return;
  }
  if (t.id === "btnImpKey") {
    const fs = await pickFile(".json", false);
    if (!fs.length) return;
    try {
      const o = JSON.parse(await fs[0].text());
      if (!o || !o.pub || !o.priv) throw new Error("fișier necorespunzător");
      LS.set(K.pub, o.pub); PRIV = o.priv; await Store.set(K.priv, o.priv);
      render(); toast("Cheia a fost importată · " + Crypt.fingerprint(o.pub));
    } catch (e) { toast("Fișierul nu conține o cheie validă"); }
    return;
  }
  if (t.id === "btnDelKey") {
    const ok = await confirmModal("Ștergi cheia?", "Fișele criptate primite până acum nu vor mai putea fi deschise pe acest calculator, iar fișele viitoare vor fi din nou necriptate. Asigură-te că ai fișierul cheii salvat.", "Șterge cheia");
    if (!ok) return;
    LS.del(K.pub); PRIV = null; await Store.set(K.priv, null);
    render(); toast("Cheia a fost ștearsă din acest browser");
    return;
  }
  if (t.id === "btnPack") { exportPack(); return; }
  if (t.id === "btnExportApp") { exportApp(); return; }
  if (t.dataset.act === "labQR") { S.tab = "access"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "btnImportSub") { importModal("sub"); return; }
  if (t.id === "btnCSV") { exportCSV(); return; }
  if (t.id === "btnNotesCSV") { exportNotesCSV(); return; }
  if (t.id === "btnRank") {
    openModal("Clasament pe grupe", renderRank(),
      '<button type="button" class="btn" id="btnPrintQR">Printează</button><button type="button" class="btn" data-mclose>Închide</button>');
    return;
  }
  if (t.id === "btnBackup") { saveFile("catalog-laborator.json", JSON.stringify(S.catalog, null, 1)); return; }

  const act = t.dataset.act;
  if (act === "edit") { const l = S.labs.find(x => x.id === t.dataset.id); S.edit = JSON.parse(JSON.stringify(l)); S.tab = "editor"; render(); return; }
  if (act === "preview") { S.labId = t.dataset.id; restoreDraft(); S.role = "student"; render(); window.scrollTo(0, 0); return; }
  if (act === "resetLab") {
    const ok = await confirmModal("Folosești versiunea din pagină?", "Copia lucrării salvată în acest browser se șterge și se folosește lucrarea livrată cu pagina, inclusiv la corectarea fișelor deja primite.", "Folosește versiunea din pagină");
    if (!ok) return;
    resetToBuiltin(t.dataset.id); restoreDraft(); render(); toast("Se folosește versiunea din pagină"); return;
  }
  if (act === "packStud") { const l = S.labs.find(x => x.id === t.dataset.id); saveFile(l.id + "-student.json", JSON.stringify(stripLab(l), null, 1)); return; }
  if (act === "packFull") { const l = S.labs.find(x => x.id === t.dataset.id); saveFile(l.id + "-complet.json", JSON.stringify(l, null, 1)); return; }
  if (act === "dup") {
    const l = JSON.parse(JSON.stringify(S.labs.find(x => x.id === t.dataset.id)));
    l.id = uid("lab"); l.title = l.title + " (copie)"; delete l.demo;
    storeLab(l); render(); toast("Laborator duplicat"); return;
  }
  if (act === "delLab") {
    const l = S.labs.find(x => x.id === t.dataset.id);
    const ok = await confirmModal("Ștergi laboratorul?", "„" + l.title + "” va fi eliminat din acest browser. Fișele deja primite rămân în catalog, dar nu mai pot fi corectate automat.", "Șterge");
    if (!ok) return;
    removeLab(t.dataset.id);
    if (S.labId === t.dataset.id) { S.labId = S.labs[0] ? S.labs[0].id : null; }
    restoreDraft(); render(); return;
  }
  if (act === "openSub") { openSubModal(t.dataset.id); return; }
  if (act === "delSub") {
    const ok = await confirmModal("Ștergi fișa?", "Fișa va fi eliminată din catalog. Poți reimporta oricând codul primit de la student.", "Șterge");
    if (!ok) return;
    S.catalog = S.catalog.filter(x => x.key !== t.dataset.id); saveCat(); render(); return;
  }
  if (t.id === "btnSaveGrade") { saveGrade(); return; }
  if (t.id === "btnSugg") { const c = S.catalog.find(x => x.key === S.openSub); const r = catRow(c); $("#notaIn").value = fmt(1 + 9 * r.total / r.max, 2); return; }

  /* profesor — editor */
  if (!S.edit) return;
  const e = S.edit, i = Number(t.dataset.i), k = Number(t.dataset.k);
  if (t.id === "btnEdSave") {
    delete e.demo;
    storeLab(e); S.labId = e.id; restoreDraft(); S.tab = "labs"; render(); toast("Laborator salvat"); return;
  }
  if (t.id === "btnEdCancel") { S.edit = null; S.tab = "labs"; render(); return; }
  if (t.id === "btnEdPreview") {
    storeLab(e); S.labId = e.id; restoreDraft(); S.role = "student"; render(); window.scrollTo(0, 0); return;
  }
  if (t.id === "btnAddQ") { e.questions = e.questions || []; e.questions.push(blankQ($("#newQType").value)); render(); return; }
  if (t.id === "btnMdPrev") { openModal("Previzualizare text", '<div class="doc">' + renderMd(e.body) + "</div>"); return; }
  if (t.id === "btnFigs") { openFigModal(); return; }
  if (t.id === "btnAddFig") { addFigures(); return; }
  if (t.dataset.delfig) {
    ev.stopPropagation();
    const kf = t.dataset.delfig;
    const okf = await confirmModal("\u0218tergi figura?", "Figura \u201e" + kf + "\u201d va fi eliminat\u0103 din lucrare. Dac\u0103 este folosit\u0103 \u00een text, va ap\u0103rea un semn de figur\u0103 lips\u0103.", "\u0218terge");
    if (okf && S.edit && S.edit.images) { delete S.edit.images[kf]; }
    openFigModal();
    return;
  }
  if (t.dataset.fig) { copyText("![" + t.dataset.fig + "](" + t.dataset.fig + ")"); return; }
  if (act === "qDel") { e.questions.splice(i, 1); render(); return; }
  if (act === "qUp") { const q = e.questions.splice(i, 1)[0]; e.questions.splice(i - 1, 0, q); render(); return; }
  if (act === "qDown") { const q = e.questions.splice(i, 1)[0]; e.questions.splice(i + 1, 0, q); render(); return; }
  if (act === "optAdd") { e.questions[i].options.push(""); render(); return; }
  if (act === "optDel") { e.questions[i].options.splice(k, 1); if (e.questions[i].correct >= e.questions[i].options.length) e.questions[i].correct = 0; render(); return; }
  if (act === "setCorrect") { e.questions[i].correct = k; return; }
  if (act === "varAdd") { e.questions[i].vars.push({ name: "x" + (e.questions[i].vars.length + 1), min: 1, max: 10, step: 1, dec: 0, unit: "" }); render(); return; }
  if (act === "varDel") { e.questions[i].vars.splice(k, 1); render(); return; }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target && (ev.target.id === "pin1" || ev.target.id === "pin2")) { ev.preventDefault(); submitGate(); }
});

document.addEventListener("input", (ev) => {
  const el = ev.target;
  /* student */
  if (el.dataset.ident !== undefined) {
    S.student[el.dataset.ident] = el.value; LS.set(K.stud, S.student);
    const b = $("#btnSubmit"); if (b) b.disabled = !identOK();
    refreshIdentitySoon();
    return;
  }
  if (el.dataset.q !== undefined && el.type !== "radio") { S.ans[el.dataset.q] = el.value; saveDraft(); updateProgress(); return; }
  /* editor */
  if (!S.edit) return;
  const e = S.edit, f = el.dataset.f;
  if (el.dataset.qi !== undefined) {
    const q = e.questions[Number(el.dataset.qi)]; if (!q) return;
    if (el.dataset.vi !== undefined) {
      const v = q.vars[Number(el.dataset.vi)]; if (!v) return;
      v[f] = el.type === "number" ? parseNum(el.value) : el.value;
      return;
    }
    if (el.dataset.opt !== undefined) { q.options[Number(el.dataset.opt)] = el.value; return; }
    if (f) q[f] = el.type === "number" ? parseNum(el.value) : el.value;
    return;
  }
  if (f === "objectives") { e.objectives = el.value.split("\n").map(s => s.trim()).filter(Boolean); return; }
  if (f && f !== "selfCheck") { e[f] = el.value; return; }
});

document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "labPick") { S.labId = el.value; restoreDraft(); render(); window.scrollTo(0, 0); return; }
  if (el.id === "linkIn") { LS.set(K.link, el.value.trim()); render(); return; }
  if (el.dataset.ident !== undefined) { LS.set(K.stud, S.student); refreshIdentity(); return; }
  if (el.type === "radio" && el.dataset.q !== undefined) { S.ans[el.dataset.q] = Number(el.value); saveDraft(); updateProgress(); return; }
  if (el.id === "rankNames") { S.rankNames = el.checked; $("#modalBody").innerHTML = renderRank(); return; }
  if (S.edit && el.dataset.f === "selfCheck") { S.edit.selfCheck = el.checked; return; }
});

/* Scrie o copie a aplicației, cu cheia publică și lucrările tale incluse.
   Copia e pentru studenți: baremul lucrărilor tale este eliminat. */
async function exportApp() {
  let src = null;
  try {
    const r = await fetch(location.href, { cache: "no-store" });
    if (r.ok) src = await r.text();
  } catch (e) { }
  if (!src || src.indexOf("/*PRESET-START*/") < 0) {
    openModal("Exportul nu este disponibil aici",
      '<div class="doc">' + renderMd(
        "Aplica\u021bia \u00ee\u0219i poate scrie o copie doar c\u00e2nd este deschis\u0103 **de la o adres\u0103 web** \u2014 de pe platforma eLearning sau de la o g\u0103zduire.\n\nDintr-un fi\u0219ier deschis cu dublu-click, browserul nu \u00eei d\u0103 voie s\u0103 \u00ee\u0219i citeasc\u0103 propriul con\u021binut. Urc\u0103 o dat\u0103 fi\u0219ierul pe platform\u0103, deschide-l de acolo \u0219i apas\u0103 din nou acest buton.") + "</div>");
    return;
  }
  const A = "/*PRESET-START*/", B = "/*PRESET-END*/";
  const i = src.indexOf(A), j = src.indexOf(B);
  if (j < i) { toast("Fișierul sursă nu are locul pentru setări"); return; }
  const preset = {
    v: 1, creat: new Date().toISOString(),
    pub: pubKey(),
    link: guessLink(),
    hidden: HIDDEN.slice(),
    labs: USER_LABS.map(l => stripLab(l))
  };
  const js = "window.__CL_PRESET=" + JSON.stringify(preset).replace(/</g, "\\u003c").replace(/\*\//g, "*\\/") + ";";
  const out = src.slice(0, i + A.length) + js + src.slice(j);
  await saveFile("caiet-laborator-studenti.html", out);
  toast("Copia pentru studenți a fost creată" + (pubKey() ? " · cheia este inclusă" : " · fără cheie de criptare"));
}

/* pachetul complet: toate lucrările, cu figurile lor proprii */
function exportPack() {
  const pack = S.labs.map(l => JSON.parse(JSON.stringify(l)));
  saveFile("pachet-lucrari-" + todayISO() + ".json", JSON.stringify(pack, null, 1));
}
function exportNotesCSV() {
  const g = gradebook();
  const head = ["Nume", "Grupa"].concat(g.used.map(id => {
    const l = S.labs.find(x => x.id === id);
    return l ? (l.course || l.title) : id;
  })).concat(["Lucrari predate", "Nota finala"]);
  const rows = [head];
  g.rows.forEach(st => {
    rows.push([st.name, st.group]
      .concat(g.used.map(id => st.labs[id] && st.labs[id].nota != null ? fmt(st.labs[id].nota, 2) : ""))
      .concat([st.count, st.final != null ? fmt(st.final, 2) : ""]));
  });
  saveFile("note-finale-" + todayISO() + ".csv", toCSV(rows));
}
function exportCSV() {
  const rows = [["Nume", "Grupa", "Laborator", "Data predarii", "Punctaj automat", "Punctaj manual", "Punctaj total", "Punctaj maxim", "Procent", "Nota", "Observatii"]];
  S.catalog.slice().sort((a, b) => (a.group + a.name).localeCompare(b.group + b.name, "ro")).forEach(c => {
    const r = catRow(c);
    rows.push([c.name, c.group, c.labTitle || c.labId, roDate(c.submittedAt),
    r.g ? r.g.auto : "", r.manual || "", r.max != null ? r.total : "", r.max != null ? r.max : "",
    r.max ? Math.round(r.total / r.max * 100) + "%" : "", c.nota == null ? "" : c.nota, c.feedback || ""]);
  });
  saveFile("catalog-laborator.csv", toCSV(rows));
}

/* ============================ pornire ============================ */
/* lucrarea cerută prin link: ...#lab=lucrarea-3 */
function hashLab() {
  try {
    const m = (location.hash || "").match(/lab=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  } catch (e) { return null; }
}
/* cheia publică a cadrului didactic, adusă de codul QR */
function adoptKeyFromHash() {
  try {
    const m = (location.hash || "").match(/[#&]k=([A-Za-z0-9_-]{80,})/);
    if (m && m[1] !== pubKey()) { LS.set(K.pub, m[1]); return true; }
  } catch (e) { }
  return false;
}
async function init() {
  const th = LS.get(K.theme, null);
  if (th) document.documentElement.setAttribute("data-theme", th);
  document.documentElement.style.height = "100%";
  S.unlocked = sessUnlocked() || (pinSet() && LS.get(K.keep, false) === true);
  if (!S.unlocked) S.role = "student";
  rebuildLabs(); render();

  USER_LABS = (await Store.get(K.labs, null)) || LS.get(K.labs, []) || [];
  HIDDEN = (await Store.get(K.hidden, null)) || LS.get(K.hidden, []) || [];
  S.catalog = (await Store.get(K.cat, null)) || LS.get(K.cat, []) || [];
  BAREM = (await Store.get(K.barem, null)) || {};

  /* o singură dată: se elimină laboratoarele demonstrative din versiunile vechi */
  if (!LS.get("cl.mig2", false)) {
    const before = USER_LABS.length;
    USER_LABS = USER_LABS.filter(l => l && l.id !== "demo-vam" && l.id !== "demo-stat");
    HIDDEN = HIDDEN.filter(id => id !== "demo-vam" && id !== "demo-stat");
    LS.set("cl.mig2", true);
    if (before !== USER_LABS.length) persistLabs();
  }

  /* setări livrate odată cu fișierul */
  try {
    const P = window.__CL_PRESET;
    if (P && typeof P === "object") {
      /* cheia publică inclusă în pagină; în browserul profesorului (unde există cheia privată) rămâne cheia lui */
      if (P.pub && P.pub !== pubKey() && !(await privKey())) LS.set(K.pub, P.pub);
      if (P.link && !LS.get(K.link, "")) LS.set(K.link, P.link);
      if (Array.isArray(P.labs) && P.labs.length) {
        P.labs.forEach(l => { if (l && l.id && !USER_LABS.some(x => x.id === l.id)) USER_LABS.push(l); });
      }
      if (Array.isArray(P.hidden) && !HIDDEN.length) HIDDEN = P.hidden.slice();
    }
  } catch (e) { }

  /* nume preluat din platforma eLearning */
  if (LMS.present()) {
    LMS.init();
    const who = LMS.student();
    if (who && who.name) { S.fromLMS = true; S.student.name = who.name; LS.set(K.stud, S.student); }
  }

  adoptKeyFromHash();
  S.unlocked = sessUnlocked() || (pinSet() && LS.get(K.keep, false) === true);
  if (!S.unlocked) { S.role = "student"; }
  const want = hashLab();
  rebuildLabs();
  if (want && S.labs.some(l => l.id === want)) S.labId = want;
  restoreDraft();
  if (S.role === "prof") S.tab = "labs";
  render();
  try { if (/(^|[#&])prof(esor)?(&|$)/.test(location.hash || "") && !S.unlocked) openGate(); } catch (e) { }
}
init();
window.addEventListener("hashchange", () => {
  adoptKeyFromHash();
  const want = hashLab();
  if (want && S.labs.some(l => l.id === want)) { S.labId = want; restoreDraft(); render(); window.scrollTo(0, 0); }
});
