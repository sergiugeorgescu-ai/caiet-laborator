<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lucrarea 2 · Caiet de Laborator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E9EEF1; --surface-3:#DFE6EA;
  --line:#D5DEE4; --line-strong:#BCC9D1;
  --ink:#121A20; --ink-2:#44535E; --ink-3:#6E8090;
  --accent:#0D6875; --accent-ink:#FFFFFF; --accent-soft:#DCEDF0; --accent-line:#8FC3CB;
  --good:#2C7248; --good-soft:#DFF0E5;
  --warn:#8C6212; --warn-soft:#F6EBD3;
  --crit:#A93A38; --crit-soft:#F7E2E1;
  --shadow:0 1px 2px rgba(18,26,32,.06),0 6px 18px -10px rgba(18,26,32,.22);
  --radius:10px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
    --line:#2A3945; --line-strong:#3B4D5B;
    --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
    --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
    --good:#66C18C; --good-soft:#12301F;
    --warn:#D7AB55; --warn-soft:#332813;
    --crit:#E2817C; --crit-soft:#361D1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
  --line:#2A3945; --line-strong:#3B4D5B;
  --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
  --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
  --good:#66C18C; --good-soft:#12301F;
  --warn:#D7AB55; --warn-soft:#332813;
  --crit:#E2817C; --crit-soft:#361D1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:16px;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);
  padding:6px 8px;border-radius:6px;white-space:nowrap;border:0;cursor:pointer}
.mark:hover{filter:brightness(1.1)}
.brand h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topActions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:grid;place-items:center}

main{flex:1;width:100%;max-width:1140px;margin:0 auto;padding:22px 16px 56px}
.pagefoot{border-top:1px solid var(--line);padding:14px 16px 26px;font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.tiny{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500;flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=email],select,textarea{
  font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:7px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- layout with rail ---------- */
.shell{display:grid;grid-template-columns:minmax(0,232px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}
.rail{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.rail{position:static}}
.rail a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink-2);font-size:13px;
  padding:6px 9px;border-radius:7px;border-left:2px solid transparent}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.done{color:var(--ink-3)}
.rail a .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;width:18px}
.rail a.done .n{color:var(--good)}
.progWrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:8px}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ---------- lab text ---------- */
.doc{font-size:15px;line-height:1.68;max-width:70ch}
.doc h2{font-size:19px;margin:24px 0 8px}
.doc h3{font-size:16px;margin:20px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin:3px 0}
.doc code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--accent-line);background:var(--accent-soft);border-radius:0 7px 7px 0}
.doc blockquote p:last-child{margin:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.tableWrap{overflow-x:auto;margin:0 0 14px}
.doc table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.doc th{background:var(--surface-2);font-weight:600;font-family:var(--sans)}
.doc td.num,.doc th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px}
.doc img,.opt img,.figpick img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;margin:2px 0}
.doc p > img{margin:6px auto}
.doc em{color:var(--ink-2)}
.doc table td img{margin:0 auto}
.imgmiss{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--crit);background:var(--crit-soft);padding:2px 7px;border-radius:5px}

/* ---------- questions ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;scroll-margin-top:80px}
.q + .q{margin-top:12px}
.gq{padding:14px 0 4px;scroll-margin-top:80px}
.gq + .gq{border-top:1px solid var(--line);margin-top:12px;padding-top:18px}
.qhead{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.qnum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.qtext{font-size:15px;line-height:1.6;margin-bottom:12px}
.val{font-family:var(--mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (max-width:620px){.opts.grid{grid-template-columns:minmax(0,1fr)}}
.opts.grid .opt{flex-wrap:wrap;align-items:center}
.opts.grid .opt > span:last-child{flex:1 1 100%;min-width:0;margin-top:7px}
.qrwrap{text-align:center}
.qrwrap svg{width:min(76vw,360px);height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.qrwrap.big svg{width:min(88vw,66vh)}
.qrwrap.small svg{width:min(60vw,190px);padding:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.figitem{position:relative}
.figitem .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:12px;cursor:pointer;color:var(--crit);padding:0}
.rank{display:flex;flex-direction:column;gap:6px}
.rankrow{display:grid;grid-template-columns:28px minmax(90px,1fr) minmax(70px,2fr) 46px 46px;gap:10px;align-items:center;
  padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.rankrow.top{border-color:var(--accent);background:var(--accent-soft)}
.rankrow .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:right}
.rankrow.top .pos{color:var(--accent);font-weight:600}
.rankrow .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .barw{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.rankrow .barw i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rankrow .pctv{font-size:12.5px;color:var(--ink-2);text-align:right}
.rankrow .notav{font-size:14px;font-weight:600;text-align:right}
@media (max-width:560px){.rankrow{grid-template-columns:24px 1fr 44px 44px}.rankrow .barw{display:none}}
.meter{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.qrwrap .who{font-family:var(--mono);font-size:13px;margin-bottom:10px;color:var(--ink-2)}
.qrwrap .after{font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:44ch;margin-left:auto;margin-right:auto}
.linkbox{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
@media print{
  body > *{display:none!important}
  #modal{display:block!important;position:static;background:none;padding:0}
  .modalBox{border:0;box-shadow:none;max-height:none;width:100%}
  .modalBox > header button,.modalBox > footer{display:none}
  .qrwrap svg{width:15cm;border:0}
  .qrwrap.big svg{width:15cm}
}
.figpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.figpick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;text-align:left;font-size:11px}
.figpick button:hover{border-color:var(--accent)}
.figpick code{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);min-width:0}
.opt > span{min-width:0}
.opt:hover{border-color:var(--accent-line);background:var(--surface-2)}
.opt input{margin:3px 0 0;accent-color:var(--accent);flex-shrink:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .lt{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex-shrink:0;width:14px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--crit);background:var(--crit-soft)}
.numline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numline input{max-width:200px;font-family:var(--mono);font-size:15px}
.unit{font-family:var(--mono);font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:6px 9px;border-radius:6px;border:1px solid var(--line)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.given span{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.fb{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--crit-soft);color:var(--crit)}
.fb.note{background:var(--surface-2);color:var(--ink-2)}
.fb b{font-weight:600}

/* ---------- tables (catalog / editor) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3);font-size:13.5px}

/* ---------- editor ---------- */
.qedit{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:13px;margin-top:10px}
.qedit .qeHead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.optedit{display:flex;gap:7px;align-items:center;margin-top:6px}
.optedit input[type=radio]{accent-color:var(--accent);flex-shrink:0}
.varrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr)) 34px;gap:7px;align-items:end;margin-top:7px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- code box ---------- */
.codebox{font-family:var(--mono);font-size:11.5px;line-height:1.45;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:11px;word-break:break-all;max-height:150px;overflow-y:auto;color:var(--ink-2)}
.scoreBig{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;color:var(--accent)}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(8,14,18,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modalBox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modalBox > header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modalBox > .body{padding:18px;overflow-y:auto}
.modalBox > footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============================ utilitare ============================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = (p) => (p || "id") + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
/* Stocare: IndexedDB pentru lucrări și catalog (spațiu mare, suportă figuri),
   cu revenire automată la localStorage dacă IndexedDB nu este disponibil. */
const Store = (function () {
  let handle, tried = false;
  function open() {
    return new Promise(res => {
      if (typeof indexedDB === "undefined") return res(null);
      let req;
      try { req = indexedDB.open("caiet-laborator", 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => { try { req.result.createObjectStore("kv"); } catch (e) { } };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
      setTimeout(() => res(null), 4000);
    });
  }
  async function ready() { if (!tried) { tried = true; handle = await open(); } return handle; }
  return {
    available: async () => !!(await ready()),
    async get(k, d) {
      const h = await ready();
      if (!h) return LS.get(k, d);
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readonly").objectStore("kv").get(k);
          rq.onsuccess = () => res(rq.result === undefined ? LS.get(k, d) : rq.result);
          rq.onerror = () => res(LS.get(k, d));
        } catch (e) { res(LS.get(k, d)); }
      });
    },
    async set(k, v) {
      const h = await ready();
      if (!h) { LS.set(k, v); return false; }
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readwrite").objectStore("kv").put(v, k);
          rq.onsuccess = () => res(true);
          rq.onerror = () => { LS.set(k, v); res(false); };
        } catch (e) { LS.set(k, v); res(false); }
      });
    }

      out += "<tbody>" + body.map(r => "<tr>" + cells(r).map(c => {
        const num = c.trim() !== "" && /^[-+]?[\d.,\s]+(?:\s*[-–…]{1,3}\s*[\d.,\s]+)?$/.test(c);
        return '<td class="' + (num ? "num" : "") + '">' + inl(c) + "</td>";
      }).join("") + "</tr>").join("") + "</tbody></table></div>";
      continue;
    }
    if (/^\s*>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out += "<blockquote>" + renderMd(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (/^\s*[-*+]\s+/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      out += "<ul>" + buf.map(b => "<li>" + inl(b) + "</li>").join("") + "</ul>"; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      out += "<ol>" + buf.map(b => "<li>" + inl(b) + "</li>").join("") + "</ol>"; continue;
    }
    const par = []; while (i < lines.length && lines[i].trim() && !/^\s*(#{2,4}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(lines[i])) { par.push(lines[i]); i++; }
    out += "<p>" + inl(par.join(" ")) + "</p>";
  }
  return out;
}

/* ============================ platforma de eLearning (SCORM) ============================ */
/* Când aplicația rulează într-un curs Moodle, ia numele studentului din platformă
   și raportează înapoi finalizarea lucrării. În afara platformei, totul e inactiv. */
const LMS = (function () {
  let api = null, started = false, tried = false;
  function find() {
    let w = window, n = 0;
    while (w && n++ < 12) {
      try { if (w.API) return w.API; } catch (e) { }
      try { w = (w.parent && w.parent !== w) ? w.parent : null; } catch (e) { w = null; }
    }
    try { if (window.opener && window.opener.API) return window.opener.API; } catch (e) { }
    return null;
  }
  function get() { if (!tried) { tried = true; api = find(); } return api; }
  return {
    present() { return !!get(); },
    init() {
      const a = get(); if (!a || started) return false;
      try { started = a.LMSInitialize("") === "true" || a.LMSInitialize("") === true; } catch (e) { started = false; }
      return started;
    },
    student() {
      const a = get(); if (!a) return null;
      try {
        const raw = a.LMSGetValue("cmi.core.student_name") || "";
        const id = a.LMSGetValue("cmi.core.student_id") || "";
        const nume = String(raw).replace(/,/g, " ").replace(/\s+/g, " ").trim();
        return nume ? { name: nume, id: String(id) } : null;
      } catch (e) { return null; }
    },
    done(procent) {
      const a = get(); if (!a) return;
      try {
        a.LMSSetValue("cmi.core.lesson_status", "completed");
        if (isFinite(procent)) {
          a.LMSSetValue("cmi.core.score.raw", String(Math.round(procent)));
          a.LMSSetValue("cmi.core.score.min", "0");
          a.LMSSetValue("cmi.core.score.max", "100");
        }
        a.LMSCommit("");
      } catch (e) { }
    },
    finish() { const a = get(); if (!a || !started) return; try { a.LMSFinish(""); } catch (e) { } }
  };
})();

/* ============================ criptare ============================ */
/* Fișele studenților se închid cu o pereche de chei: cheia publică ajunge la
   studenți (prin codul QR), cheia privată rămâne doar la cadrul didactic.
   Un student nu poate deschide codul altui student. */
const Crypt = {
  ok() { try { return !!(typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.deriveBits); } catch (e) { return false; } },
  async genPair() {
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    return {
      pub: b64enc(new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey))),
      priv: await crypto.subtle.exportKey("jwk", kp.privateKey)
    };
  },
  async aesFrom(bits) {
    return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", bits), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  },
  async encrypt(bytes, pubB64) {
    const teacher = await crypto.subtle.importKey("raw", b64dec(pubB64), { name: "ECDH", namedCurve: "P-256" }, false, []);
    const eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: teacher }, eph.privateKey, 256);
    const key = await Crypt.aesFrom(bits);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, bytes));
    const ep = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
    const out = new Uint8Array(ep.length + 12 + ct.length);
    out.set(ep, 0); out.set(iv, ep.length); out.set(ct, ep.length + 12);
    return out;
  },
  async decrypt(bytes, privJwk) {
    const ep = bytes.slice(0, 65), iv = bytes.slice(65, 77), ct = bytes.slice(77);
    const priv = await crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
    const pub = await crypto.subtle.importKey("raw", ep, { name: "ECDH", namedCurve: "P-256" }, false, []);
    const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: pub }, priv, 256);
    const key = await Crypt.aesFrom(bits);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct));
  },
  /* amprentă scurtă, ca să recunoști cheia */
  fingerprint(pubB64) {
    if (!pubB64) return "";
    const h = hashStr(pubB64).toString(36).toUpperCase();
    return (h + "000000").slice(0, 6);
  }
};
let PRIV = undefined;
async function privKey() {
  if (PRIV === undefined) PRIV = await Store.get(K.priv, null);
  return PRIV;
}
function pubKey() { return LS.get(K.pub, "") || ""; }
function cryptReady() { return !!(pubKey() && Crypt.ok()); }

/* ============================ codec cod de predare ============================ */
function b64enc(bytes) {
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(str) {
  let s = str.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* varianta compactă, pentru codul QR: valorile generate se recalculează din seed */
function compactSub(sub) {
  return { v: 2, l: sub.labId, t: sub.labTitle, n: sub.name, g: sub.group, s: sub.seed, d: sub.submittedAt, a: sub.answers };
}
function normalizeSub(o) {
  if (o && typeof o === "object" && o.v === 2 && o.a && o.l)
    return { v: 2, labId: o.l, labTitle: o.t, name: o.n, group: o.g, seed: o.s, submittedAt: o.d, answers: o.a, __enc: o.__enc };
  return o;
}
async function deflate(bytes) {
  if (typeof CompressionStream !== "function") return null;
  try {
    const cs = new CompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
  } catch (e) { return null; }
}
async function inflate(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
/* LAB0 simplu · LAB1 comprimat · LAB2 comprimat+criptat · LAB3 criptat */
async function encodePayload(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  const packed = await deflate(raw);
  const body = packed || raw;
  const tagPlain = packed ? "LAB1." : "LAB0.";
  const pub = pubKey();
  if (pub && Crypt.ok()) {
    try {
      const enc = await Crypt.encrypt(body, pub);
      return (packed ? "LAB2." : "LAB3.") + b64enc(enc);
    } catch (e) { }
  }
  return tagPlain + b64enc(body);
}
async function decodePayload(code) {
  const s = String(code || "").trim().replace(/\s+/g, "");
  const i = s.indexOf(".");
  if (i < 0) throw new Error("Cod invalid");
  const tag = s.slice(0, i), data = s.slice(i + 1);
  let bytes = b64dec(data), enc = false;
  if (tag === "LAB2" || tag === "LAB3") {
    if (!Crypt.ok()) throw new Error("Browserul nu poate descifra coduri criptate.");
    const pk = await privKey();
    if (!pk) throw new Error("Cod criptat: lipsește cheia privată. Importă cheia în fila „Acces studenți”.");
    try { bytes = await Crypt.decrypt(bytes, pk); }
    catch (e) { throw new Error("Cod criptat cu altă cheie decât a ta."); }
    enc = true;
  } else if (tag !== "LAB0" && tag !== "LAB1") {
    throw new Error("Format necunoscut: " + tag);
  }
  if (tag === "LAB1" || tag === "LAB2") bytes = await inflate(bytes);
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (o && typeof o === "object") o.__enc = enc;
  return o;
}
function csvCell(v) { const s = String(v == null ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(rows) { return "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n"); }

/* ============================ laboratoare demonstrative ============================ */
const BUILTIN = [
 {
  "id": "lucrarea-2",
  "title": "Stivuirea cherestelei, amplasarea stivelor în instalație și determinarea capacității de uscare",
  "course": "Lucrarea 2 · Uscarea lemnului",
  "teacher": "",
  "teacherEmail": "",
  "duration": "2 ore",
  "date": "",
  "selfCheck": true,
  "objectives": [
   "Descrie caracteristicile șipcilor de stivuire.",
   "Specifice regulile de stivuire.",
   "Aplice regulile de amplasare a stivelor în instalațiile de uscare.",
   "Calculeze capacitatea de încărcare a unei instalații de uscare."
  ],
  "body": "## 2.1. Introducere\n\nStivuirea cherestelei este o operație tehnologică de mare importanță, de care depinde atât calitatea uscării, cât și volumul de material care se poate introduce la o șarjă în instalație. Capacitatea de încărcare a unei instalații de uscare depinde de caracteristicile dimensionale ale materialului care se usucă, de dimensiunile și numărul stivelor din instalație, care depind la rândul lor de dimensiunile interioare ale camerei. Aproximarea volumului de cherestea care se usucă la o șarjă este importantă pentru corecta planificare a producției, atât pe termen scurt, cât și pe termen lung, întrucât capacitatea de încărcare a unei instalații determină la rândul ei capacitatea anuală de uscare.\n\n## 2.2. Stivuirea cherestelei\n\nÎn vederea stivuirii corecte, materialul trebuie sortat pe specii și dimensiuni (în special după grosime), astfel încât materialul introdus într-o stivă să fie cât mai omogen: din aceeași specie, aceeași grosime și umiditate inițială cât mai apropiată.\n\n### 2.2.1. Formarea stivei și reguli de stivuire\n\nO stivuire corectă trebuie să asigure:\n\n- spații suficiente pentru circulația aerului printre piesele de cherestea. Pentru aceasta stivuirea se face cu șipci, iar între piese, pe lățimea stivei, se lasă mici spații de 3–5 cm;\n- strângerea materialului pe fețele late pentru a evita deformațiile — se pot folosi dispozitive mecanice de strângere (cu arc) sau plăci grele așezate deasupra stivei (Fig. 2.1);\n- stabilitatea stivei;\n- utilizarea cât mai bună a spațiului util al instalației — pentru aceasta este necesar ca lungimea stivei să fie cât mai complet acoperită cu material, iar înălțimea stivei să fie apropiată de înălțimea utilă a camerei.\n\n| ![Dispozitiv mecanic de strângere](l2-fig21a) | ![Plăci grele de beton](l2-fig21b) |\n| a | b |\n\n*Fig. 2.1. Stive de cherestea și modalități pentru evitarea bombării pieselor (Câmpean și Marinescu 2012): a — dispozitiv mecanic de strângere (cu arc); b — plăci grele de beton.*\n\nȘipcile de stivuire se confecționează de regulă din lemn de molid (U ≈ 15%), pentru a nu păta materialul. Șipcile de stivuire cel mai frecvent utilizate au următoarele dimensiuni:\n\n- grosimea (s_{s}) = 20 mm;\n- lățimea (l_{s}) = 30 mm;\n- lungimea (L_{s}) egală cu lățimea stivei.\n\nÎn cadrul operației de stivuire trebuie respectate câteva reguli de bază:\n\n- șipcile se vor așeza **obligatoriu la capetele stivei**, pentru a evita deformarea pieselor pe lungime;\n- în plan vertical șipcile vor fi strict una sub alta;\n- în interiorul stivei, șipcile se așează la anumite distanțe pentru a se evita deformarea pieselor pe lungime (Tabelul 2.1);\n- piesele cu inimă se vor așeza cu partea dinspre inimă în sus, pentru a evita tendința de deformare a acestora datorită contragerii inegale după direcția radială și respectiv tangențială (Fig. 2.2).\n\n![Tendința de bombare a pieselor în timpul uscării](l2-fig22)\n\n*Fig. 2.2. Tendința de bombare a pieselor în timpul uscării.*\n\nPentru a încetini eliminarea apei prin capetele pieselor și a evita astfel crăpăturile de capăt, în special la sortimentele groase de foioase tari, se pot aplica pe capetele pieselor de cherestea fie agrafe anti-crăpare („S”-uri), fie pelicule de protecție prin pensulare — varianta mai practică. Peliculele de protecție pot fi pe bază de parafină (ex. BOMUL) sau dispersie de ceară.\n\n**Tabelul 2.1. Distanța de amplasare a șipcilor de stivuire (STAS 9701-88)**\n\nDistanța între șipci, aproximativ, în mm, în funcție de grosimea cherestelei:\n\n| Specia lemnoasă | sub 30 mm | 31...60 mm | peste 60 mm |\n|---|---|---|---|\n| Rășinoase | 500 | 1000 | 1500 |\n| Foioase | 300...400 | 401...600 | 601...800 |\n\n### 2.2.2. Dimensiunile stivelor\n\nDimensiunile stivelor se adoptă ținând seama de dimensiunile interioare ale instalației, de dimensiunile pieselor de cherestea și de utilajele de transport și stivuire disponibile. Astfel:\n\n- **lungimea stivei (L_{st})** este în funcție de lungimea maximă a cherestelei. Atunci când piesele de cherestea au lungimi diferite, se recomandă dispunerea decalată stânga-dreapta, astfel încât stiva în ansamblu să păstreze aspectul unui paralelipiped (Fig. 2.3);\n- **lățimea stivei (l_{st})** este cuprinsă, de regulă, între 1 și 1,2 m, uzual fiind de 1,2 m — în cazul încărcării instalației prin intermediul autostivuitoarelor. Atunci când instalația de uscare este prevăzută cu vagonet, lățimea stivei este limitată de lățimea vagonetului;\n- **înălțimea stivei (h_{st})** trebuie să respecte proporția de max. 3:1 față de lățime, pentru a se asigura stabilitatea acesteia (Câmpean și Marinescu 2012). Oricum, și aceasta este limitată de utilajul de transport folosit. În cazul utilizării vagonetelor se recomandă a nu se depăși h_{st} = 2 m. Pentru cazul în care încărcarea camerei se realizează cu ajutorul autostivuitoarelor se pot suprapune până la 4 stive de câte 1 m înălțime fiecare, cu grinzi distanțiere de 10 cm între ele (Fig. 2.4). Grinzile distanțiere trebuie amplasate sub fiecare coloană de șipci de stivuire.\n\n![Stivuirea pieselor de lungimi diferite](l2-fig23)\n\n*Fig. 2.3. Modalitatea de stivuire a pieselor de lungimi diferite (vedere de sus): 1 — șipci de stivuire; 2 — piese de cherestea.*\n\n![Amplasarea stivelor pe înălțimea instalației](l2-fig24)\n\n*Fig. 2.4. Modalitatea de amplasare a stivelor pe înălțimea instalației prin intermediul grinzilor distanțiere: 1 — pardoseală; 2 — grinzi distanțiere; 3 — șipci de stivuire.*\n\n## 2.3. Amplasarea stivelor în instalația de uscare\n\nStivele rezultate se amplasează în instalația de uscare astfel încât să nu se obstrucționeze circulația aerului în cadrul instalației. Prin urmare, trebuie respectate următoarele reguli:\n\n- stivele se așează doar pe zona corespunzătoare planșeului intermediar, astfel încât canalele de distribuție și colectare a aerului să nu fie blocate (Fig. 2.5a și b);\n- pe lățimea camerei se vor lăsa spații de cca. 100 mm între stivele de cherestea (Fig. 2.5b). Aceste spații sunt necesare pentru a nu se obstrucționa trecerea aerului prin celelalte rânduri de stive;\n- pe lungimea camerei se va urmări ca între stive și pereți să rămână un spațiu de cca. 0,5 m (Fig. 2.5b);\n- pe înălțime, stivele se vor amplasa cât mai aproape de planșeul intermediar (Fig. 2.5a). Cu cât spațiul dintre ultima stivă și planșeul intermediar este mai mare, cu atât riscul de „scurtcircuitare” a aerului prin acel spațiu gol este mai mare, în detrimentul uniformității uscării.\n\n| ![Amplasare pe înălțimea și lățimea camerei](l2-fig25a) | ![Amplasare pe lungimea și lățimea camerei](l2-fig25b) |\n| a | b |\n\n*Fig. 2.5. Modalitatea de amplasare a stivelor în interiorul instalației de uscare: a — pe înălțimea și lățimea camerei; b — pe lungimea și lățimea camerei.*\n\n## 2.4. Calculul capacității de încărcare a unei instalații de uscare\n\nCapacitatea de încărcare a unei camere de uscare (V) reprezintă volumul efectiv de material care se introduce la un moment dat în instalație. Ea depinde de dimensiunile și numărul stivelor, dar și de spațiile goale:\n\n> **V = V_{g.st} · n_{st} · K_{st}**  [m³/șarjă]  (2.1)\n\nîn care **V_{g.st}** este volumul de gabarit al unei stive, egal cu produsul dintre lungimea (L_{st}), lățimea (l_{st}) și înălțimea acesteia (h_{st}):\n\n> **V_{g.st} = L_{st} · l_{st} · h_{st}**  [m³]  (2.2)\n\n**n_{st}** — numărul de stive din interiorul instalației;\n\n**K_{st}** — coeficientul de stivuire, care ține seama de spațiile goale sau de aer dintre piese pe lungimea, lățimea și respectiv înălțimea stivei:\n\n> **K_{st} = K_{L} · K_{l} · K_{h}**  (2.3)\n\nîn care:\n\n- **K_{L}** este coeficientul de stivuire pe lungimea stivei; în general se consideră K_{L} = 0,85. Numai dacă toate piesele au exact aceeași lungime și egală cu lungimea stivei se poate considera K_{L} = 1.\n- **K_{l}** este coeficientul de stivuire pe lățimea stivei; în funcție de gradul de tivire a cherestelei se consideră: K_{l} = 0,9 pentru cherestea tivită (Fig. 2.6a); K_{l} = 0,75 pentru cherestea semitivită (Fig. 2.6b); K_{l} = 0,6 pentru cherestea netivită (Fig. 2.6c).\n\n| ![Cherestea tivită](l2-fig26a) | ![Cherestea semitivită](l2-fig26b) | ![Cherestea netivită](l2-fig26c) |\n| a | b | c |\n\n*Fig. 2.6. Cherestea tivită (a), semitivită (b) și netivită (c).*\n\n- **K_{h}** este coeficientul de stivuire pe înălțimea stivei; se calculează în funcție de grosimea cherestelei (s) și de grosimea șipcii de stivuire (s_{s}):\n\n> **K_{h} = s / (s_{s} + 1,08 · s)**  (2.4)\n\nîn care: *s* este grosimea materialului, în mm; *s_{s}* — grosimea șipcilor de stivuire, în mm; *1,08* — coeficient care ține seama de contragerea medie.\n\n## 2.5. Calculul capacității anuale de uscare a unei instalații\n\nCapacitatea anuală de uscare a unei instalații (P_{an}) reprezintă volumul de material lemnos care se poate usca în decursul unui an în instalația respectivă:\n\n> **P_{an} = V · T / Z**  [m³/an]  (2.5)\n\nîn care:\n\n- **V** este capacitatea de încărcare a instalației, calculată conform Ecuației (2.1), în m³/șarjă;\n- **T** — durata de funcționare a instalației în decursul unui an, h/an. Pentru instalațiile metalice se consideră T = 345 zile/an × 24 h/zi × 0,87 (coeficient de utilizare a timpului de lucru) ⇒ **T = 7200 h/an**;\n- **Z** — durata unui ciclu de uscare, h/șarjă; ia în considerare atât durata totală a procesului de uscare (D_{t}), cât și durata de încărcare/descărcare a instalației (D_{î.d.}):\n\n> **Z = D_{t} + D_{î.d.}**  [h]  (2.6)\n\nValorile orientative ale duratei de uscare (D_{t}) în funcție de specia și grosimea cherestelei sunt prezentate în Tabelul 2.2. Durata de încărcare/descărcare a camerei depinde de tipul mijlocului de transport folosit. Orientativ, se poate considera:\n\n- D_{î.d.} = 1 h/vagonet — în cazul utilizării vagonetelor pe șină;\n- D_{î.d.} = 20 minute/stivă — în cazul stivuirii direct în camera de uscare, cu ajutorul unui autostivuitor cu furci.\n\n**Tabelul 2.2. Valori orientative ale duratei de uscare (în zile) în funcție de specia și grosimea cherestelei (U_{i} = 60% și U_{f} = 12%)**\n\n| Grosimea materialului, mm | Brad | Pin, cedru, brad, plop | Mesteacăn, arin | Fag, frasin, paltin, larice | Stejar, carpen |\n|---|---|---|---|---|---|\n| 19...25 | 1...2 | 2 | 3 | 5 | 10 |\n| 26...30 | 2...3 | 2...3 | 4 | 6 | 12 |\n| 30...40 | 3 | 3 | 5 | 6...8 | 15 |\n| 40...50 | 3...4 | 4 | 6 | 10 | 20 |\n| 50...60 | 4...5 | 5 | 8 | 12 | 25 |\n| 60...70 | 6 | 6 | 10 | 15 | 30 |\n| 70...80 | 6...8 | 8 | 12 | 20 | — |\n| 80...90 | 8...10 | 10 | 15 | 25 | — |\n| 91...100 | 10...12 | 12 | 20 | 30 | — |\n\n---\n\n## Aplicațiile de laborator\n\n**Aplicația 1.** Să se calculeze capacitatea de încărcare a unei instalații, pentru care se cunosc următoarele date:\n\n*Varianta A:* specia fag; lungimea pieselor de cherestea 5–6 m; grosimea cherestelei 70 mm; gradul de tivire: tivită; lungimea stivei 6 m; lățimea stivei 1,2 m; înălțimea stivei 1 m; numărul de stive din instalație: 6 buc.\n\n*Varianta B:* specia stejar; lungimea pieselor de cherestea 6 m; grosimea cherestelei 40 mm; gradul de tivire: netivită; lungimea stivei 6 m; lățimea stivei 1,2 m; înălțimea stivei 1 m; numărul de stive din instalație: 6 buc.\n\nRezultatele obținute se vor centraliza în Tabelul 2.3, iar valorile cerute mai jos se completează în aplicațiile numerice.\n\n**Tabelul 2.3. Capacitatea de încărcare a instalației de uscare**\n\n| Varianta | L_{st}, m | l_{st}, m | h_{st}, m | V_{g.st}, m³ | n_{st} | K_{L} | K_{l} | K_{h} | K_{st} | V, m³/șarjă |\n|---|---|---|---|---|---|---|---|---|---|---|\n| A | 6 | 1,2 | 1 | | 6 | | | | | |\n| B | 6 | 1,2 | 1 | | 6 | | | | | |\n\n**Aplicația 2.** Să se determine capacitatea anuală de uscare a instalației pentru care s-a calculat capacitatea de încărcare la aplicația precedentă (Varianta A). Încărcarea instalației se realizează cu: a) vagonete; b) autostivuitorul.\n\n**Tabelul 2.4. Capacitatea anuală de uscare a instalației**\n\n| Mod de încărcare | V, m³/șarjă | T, h/an | D_{t}, h/șarjă | n_{st} | D_{î.d.}, h | P_{an}, m³/an |\n|---|---|---|---|---|---|---|\n| a — vagonete | | 7200 | | 6 | | |\n| b — autostivuitor | | 7200 | | 6 | | |\n\n---\n\n*Sursa textului și a figurilor: îndrumarul de laborator al disciplinei (Bedelean B., Câmpean M.).*\n",

/* Modul profesor este închis cu un cod ales de cadrul didactic. Codul nu se
   păstrează niciodată în clar — se compară o amprentă a lui. */
const PIN_SALT = "caiet-laborator|";
async function hashPin(pin) {
  const txt = PIN_SALT + String(pin);
  try {
    if (typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return "h" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { }
  /* pagina deschisă direct de pe disc nu are funcții criptografice */
  return "s" + hashStr(txt).toString(36) + hashStr(txt + "|2" + pin).toString(36);
}
function pinSet() { return !!LS.get(K.pin, ""); }
function sessUnlocked() {
  try { return sessionStorage.getItem("cl.unlocked") === "1"; } catch (e) { return false; }
}
function setUnlocked(v, keep) {
  S.unlocked = v;
  try { v ? sessionStorage.setItem("cl.unlocked", "1") : sessionStorage.removeItem("cl.unlocked"); } catch (e) { }
  if (keep === true) LS.set(K.keep, true);
  if (keep === false || !v) LS.del(K.keep);
}
function lockProf() {
  setUnlocked(false, false);
  S.role = "student"; LS.set(K.role, "student");
  S.edit = null; S.tab = "labs";
  render(); window.scrollTo(0, 0);
  toast("Modul profesor a fost închis");
}
function openGate() {
  const first = !pinSet();
  const body = first
    ? '<p class="small muted" style="margin-bottom:12px;max-width:58ch">Alege un cod cu care vei intra \u00een modul profesor de pe acest calculator. F\u0103r\u0103 el, cine deschide linkul vede doar fi\u0219a de student.</p>' +
      '<div class="row"><label class="fld"><span>Cod nou</span><input type="password" id="pin1" autocomplete="new-password"></label>' +
      '<label class="fld"><span>Repet\u0103 codul</span><input type="password" id="pin2" autocomplete="new-password"></label></div>' +
      '<div id="pinMsg" class="fb bad" style="display:none"></div>'
    : '<p class="small muted" style="margin-bottom:12px">Introdu codul de profesor.</p>' +
      '<label class="fld" style="max-width:260px"><span>Cod</span><input type="password" id="pin1" autocomplete="current-password"></label>' +
      '<label class="row small" style="gap:7px;margin-top:12px;cursor:pointer"><input type="checkbox" id="pinKeep" style="width:auto;accent-color:var(--accent)">' +
      '<span>\u021aine minte pe acest calculator (nu bifa pe calculatoarele din laborator)</span></label>' +
      '<div id="pinMsg" class="fb bad" style="display:none;margin-top:10px"></div>' +
      '<p class="small muted" style="margin-top:14px">Ai uitat codul? <button type="button" class="btn tiny danger" id="pinReset">Reseteaz\u0103 codul</button></p>';
  openModal(first ? "Setează codul de profesor" : "Acces profesor", body,
    '<button type="button" class="btn" data-mclose>Renun\u021b\u0103</button>' +
    '<button type="button" class="btn primary" id="pinGo">' + (first ? "Salveaz\u0103 codul" : "Intr\u0103") + "</button>");
  setTimeout(() => { const i = $("#pin1"); if (i) i.focus(); }, 60);
}
function pinError(msg) {
  const el = $("#pinMsg"); if (!el) return;
  el.textContent = msg; el.style.display = "";
}
async function submitGate() {
  const first = !pinSet();
  const v1 = ($("#pin1") || {}).value || "";
  if (first) {
    const v2 = ($("#pin2") || {}).value || "";
    if (v1.length < 4) return pinError("Codul trebuie să aibă cel puțin 4 caractere.");
    if (v1 !== v2) return pinError("Cele două coduri nu coincid.");
    LS.set(K.pin, await hashPin(v1));
    setUnlocked(true, false);
    closeModal(); S.role = "prof"; LS.set(K.role, "prof"); S.tab = "labs"; render();
    toast("Cod salvat — modul profesor este deschis");
    return;
  }
  const want = LS.get(K.pin, "");
  if ((await hashPin(v1)) !== want) return pinError("Cod greșit.");
  const keep = !!(($("#pinKeep") || {}).checked);
  setUnlocked(true, keep);
  closeModal(); S.role = "prof"; LS.set(K.role, "prof"); S.tab = "labs"; render(); window.scrollTo(0, 0);
}
async function resetPin() {
  const ok = await confirmModal("Resetezi codul de profesor?",
    "Ca să nu poată intra altcineva, resetarea șterge din acest browser și catalogul cu fișele primite, și lucrările create sau modificate de tine. Lucrările livrate cu pagina rămân. Fă asta doar dacă ai copiile exportate.",
    "Șterge și resetează");
  if (!ok) return;
  LS.del(K.pin); LS.del(K.keep);
  USER_LABS = []; HIDDEN = []; S.catalog = [];
  await persistLabs(); await Store.set(K.cat, []);
  setUnlocked(false, false);
  rebuildLabs(); S.role = "student"; LS.set(K.role, "student"); render();
  toast("Codul și datele de profesor au fost șterse");
}
/* Lucrările livrate cu pagina (BUILTIN) rămân în pagină. În browser se salvează
   doar lucrările create sau modificate de profesor — acestea pot avea figuri proprii. */
let USER_LABS = [], HIDDEN = [];
function rebuildLabs() {
  const byId = {};
  USER_LABS.forEach(l => { if (l && l.id) byId[l.id] = l; });
  const out = [];
  BUILTIN.forEach(b => {
    if (HIDDEN.indexOf(b.id) >= 0) return;
    out.push(byId[b.id] ? byId[b.id] : JSON.parse(JSON.stringify(b)));
  });
  USER_LABS.forEach(l => { if (!BUILTIN.some(b => b.id === l.id) && HIDDEN.indexOf(l.id) < 0) out.push(l); });
  S.labs = out;
  if (!S.labId || !S.labs.some(l => l.id === S.labId)) S.labId = S.labs[0] ? S.labs[0].id : null;
}
let saveErr = false;
async function persistLabs() {
  const ok1 = await Store.set(K.labs, USER_LABS);
  await Store.set(K.hidden, HIDDEN);
  if (!ok1 && !saveErr) { saveErr = true; toast("Spațiu de salvare limitat — exportă pachetul de lucrări ca siguranță"); }
}
function storeLab(l) {
  const copy = JSON.parse(JSON.stringify(l));
  const i = USER_LABS.findIndex(x => x.id === copy.id);
  if (i >= 0) USER_LABS[i] = copy; else USER_LABS.push(copy);
  HIDDEN = HIDDEN.filter(id => id !== copy.id);
  rebuildLabs(); persistLabs();
}
function removeLab(id) {
  USER_LABS = USER_LABS.filter(x => x.id !== id);
  if (HIDDEN.indexOf(id) < 0) HIDDEN.push(id);
  rebuildLabs(); persistLabs();
}
function restoreBuiltins() { HIDDEN = []; rebuildLabs(); persistLabs(); }
/* O lucrare livrată cu pagina, dar salvată (modificată sau importată) în acest browser:
   copia locală are prioritate, inclusiv la corectare. */
function localCopyOf(id) { return isBuiltin(id) ? USER_LABS.find(x => x && x.id === id) || null : null; }
function differsFromBuiltin(id) {
  const c = localCopyOf(id), b = BUILTIN.find(x => x.id === id);
  if (!c || !b) return false;
  return c.title !== b.title || c.body !== b.body || JSON.stringify(c.questions) !== JSON.stringify(b.questions);
}
function resetToBuiltin(id) {
  USER_LABS = USER_LABS.filter(x => !(x && x.id === id));
  HIDDEN = HIDDEN.filter(x => x !== id);
  rebuildLabs(); persistLabs();
}
function isBuiltin(id) { return BUILTIN.some(b => b.id === id); }
function saveCat() { Store.set(K.cat, S.catalog); }
function lab() { return S.labs.find(l => l.id === S.labId) || null; }
function totalPts(l) { return (l.questions || []).reduce((a, q) => a + (Number(q.points) || 0), 0); }
function autoPts(l) { return (l.questions || []).filter(q => q.type !== "open").reduce((a, q) => a + (Number(q.points) || 0), 0); }
function mySeed() { const l = lab(); return l ? seedFor(S.student.name, S.student.group, l.id) : 0; }
function identOK() { return (S.student.name || "").trim().length > 2 && (S.student.group || "").trim().length > 0; }

function stripLab(l) {
  const c = JSON.parse(JSON.stringify(l));
  c.stripped = true;
  (c.questions || []).forEach(q => {
    delete q.explain; delete q.model; delete q.solution;
    if (!l.selfCheck) { delete q.correct; delete q.expr; delete q.tolPct; delete q.tolAbs; }
  });
  if (!l.selfCheck) c.selfCheck = false;
  return c;
}
/* corectare automată; `full` = laboratorul cu răspunsuri (la profesor) */
function givenFor(q, sub) {
  if (q.type !== "num") return {};
  if (sub.given && sub.given[q.id]) return sub.given[q.id];
  if (sub.seed != null) return genVars(q, sub.seed);
  return {};
}
function gradeSub(full, sub) {
  const res = { items: [], auto: 0, autoMax: 0, openMax: 0 };
  (full.questions || []).forEach(q => {
    const pts = Number(q.points) || 0;
    const given = givenFor(q, sub);
    const a = sub.answers ? sub.answers[q.id] : undefined;
    const it = { id: q.id, type: q.type, points: pts, answer: a, given: given, ok: null, earned: 0, correct: null };
    if (q.type === "mcq") {
      res.autoMax += pts;
      if (typeof q.correct === "number") { it.correct = q.correct; it.ok = Number(a) === q.correct; it.earned = it.ok ? pts : 0; res.auto += it.earned; }
    } else if (q.type === "num") {
      res.autoMax += pts;
      if (q.expr) {
        const cv = evalExpr(q.expr, given);
        it.correct = cv;
        const av = parseNum(a);
        const tol = Math.max(Number(q.tolAbs) || 0, (Number(q.tolPct) || 0) / 100 * Math.abs(cv));
        it.ok = isFinite(av) && isFinite(cv) && Math.abs(av - cv) <= (tol || Math.abs(cv) * 0.02);
        it.earned = it.ok ? pts : 0; res.auto += it.earned;
      }
    } else { res.openMax += pts; }
    res.items.push(it);
  });
  return res;
}

/* ============================ vizualizare student ============================ */
function qGiven(q) { return q.type === "num" ? genVars(q, mySeed()) : {}; }
function answeredCount(l) {
  return (l.questions || []).filter(q => {
    const v = S.ans[q.id];
    return v !== undefined && v !== null && String(v).trim() !== "";
  }).length;
}
/* Toate grilele unei lucrări formează un singur test „Grilă”, afișat în locul primei grile.
   Numerotarea urmează ordinea afișată (aceeași cu ordinea din JSON când grilele sunt una după alta). */
function qBlocks(l) {
  const qs = l.questions || [], mcqs = qs.filter(q => q.type === "mcq"), out = [];
  let n = 0;
  qs.forEach(q => {
    if (q.type !== "mcq") { out.push({ q: q, i: n++ }); return; }
    if (q === mcqs[0]) out.push({ grila: true, items: mcqs.map(m => ({ q: m, i: n++ })) });
  });
  return out;
}
function isAnswered(q) { const v = S.ans[q.id]; return v !== undefined && v !== null && String(v).trim() !== ""; }
function renderQList(l, ready, submitted) {
  return qBlocks(l).map(b => b.grila ? renderGrila(b.items, ready, submitted) : renderQ(b.q, b.i, ready, submitted)).join("");
}
function renderGrila(items, ready, submitted) {
  const pts = items.reduce((a, x) => a + (Number(x.q.points) || 0), 0);
  return '<section class="q grila" id="grila">' +
    '<div class="qhead"><span class="qnum">Grilă · ' + items.length + (items.length === 1 ? " întrebare" : " întrebări") + '</span><span class="pill">' + pts + " p</span></div>" +
    '<p class="small muted" style="margin:-3px 0 2px">Alege un singur răspuns la fiecare întrebare.</p>' +
    items.map(x => renderQ(x.q, x.i, ready, submitted, true)).join("") + "</section>";
}
function railLinks(l) {
  return qBlocks(l).map(b => {
    if (b.grila) {
      const n = b.items.length, d = b.items.filter(x => isAnswered(x.q)).length;
      return '<a href="#grila" class="qlink' + (d === n ? " done" : "") + '" data-qg="1"><span class="n">' + (d === n ? "✓" : "▢") + "</span><span>Grilă · " + n +
        (n === 1 ? " întrebare" : " întrebări") + ' <span class="muted" data-qgc>(' + d + "/" + n + ")</span></span></a>";
    }
    const q = b.q, dn = isAnswered(q);
    return '<a href="#' + q.id + '" class="qlink' + (dn ? " done" : "") + '" data-ql="' + q.id + '"><span class="n">' + (dn ? "✓" : (b.i + 1)) + '</span><span>' +
      esc((q.type === "num" ? "Aplicație " : "Răspuns liber ") + (b.i + 1)) + "</span></a>";
  }).join("");
}
function renderStudent() {
  const l = lab();
  if (!l) return emptyLabState();
  const ready = identOK();
  const seed = mySeed();
  const nQ = (l.questions || []).length;
  const done = answeredCount(l);
  const submitted = !!S.result;

  const rail = '<div class="rail">' +
    '<div class="progWrap"><div class="eyebrow">Progres</div>' +
    '<div class="row" style="justify-content:space-between;margin-top:2px"><b class="mono" id="progTxt">' + done + "/" + nQ + '</b><span class="small muted" id="savedTag">' + totalPts(l) + " p</span></div>" +
    '<div class="bar"><i id="progBar" style="width:' + (nQ ? Math.round(done / nQ * 100) : 0) + '%"></i></div></div>' +
    '<a href="#labdoc"><span class="n">§</span><span>Descrierea lucrării</span></a>' +
    railLinks(l) + "</div>";

  let main = "";

  /* identitate */
  main += '<div class="card" id="identCard">' +
    '<div class="spread" style="margin-bottom:12px"><div><div class="eyebrow">Pasul 1</div><h3 style="font-size:16px">Cine completează fișa</h3>' +
    '<button type="button" class="btn tiny ghost" id="btnNewStudent" style="margin-top:4px;padding-left:0"' + (identOK() && !S.fromLMS ? "" : " hidden") + ">Nu ești tu? Șterge și începe altă fișă</button></div>" +
    (S.labs.length > 1 ? '<label class="fld" style="flex:0 1 250px"><span>Laborator</span><select id="labPick">' +
      S.labs.map(x => '<option value="' + esc(x.id) + '"' + (x.id === l.id ? " selected" : "") + ">" + esc(x.title) + "</option>").join("") + "</select></label>" : "") +
    "</div>" +
    '<div class="row">' +
    '<label class="fld"><span>Nume și prenume' + (S.fromLMS ? " · din platformă" : "") + '</span><input type="text" id="sName" data-ident="name" value="' + esc(S.student.name) + '" placeholder="Popescu Ioana" autocomplete="name"' + (submitted || S.fromLMS ? " disabled" : "") + "></label>" +
    '<label class="fld" style="flex:0 1 160px"><span>Grupa</span><input type="text" id="sGroup" data-ident="group" value="' + esc(S.student.group) + '" placeholder="1234A"' + (submitted ? " disabled" : "") + "></label>" +
    "</div>" +
    identNoteHtml() + "</div>";

  /* fișă începută, salvată automat */
  if (!submitted && done > 0) {
    main += '<div class="card" style="margin-top:14px;border-color:var(--accent-line);background:var(--accent-soft)">' +
      '<div class="spread"><div><b style="font-size:14px">Fișă începută — salvată automat</b>' +
      '<div class="small" style="color:var(--ink-2);margin-top:3px">Ai completat ' + done + " din " + nQ +
      " întrebări. Poți închide pagina și continua mai târziu, de pe același dispozitiv.</div></div>" +
      '<button type="button" class="btn tiny" id="btnClear">Începe din nou</button></div></div>';
  }

  /* antetul lucrării */
  main += '<div class="card" id="labdoc" style="margin-top:14px">' +
    '<div class="eyebrow">' + esc(l.course || "Laborator") + "</div>" +
    '<h2 style="font-size:23px;margin:4px 0 10px">' + esc(l.title) + "</h2>" +
    '<div class="row small" style="gap:7px">' +
    (l.teacher ? '<span class="pill">' + esc(l.teacher) + "</span>" : "") +
    (l.duration ? '<span class="pill">⏱ ' + esc(l.duration) + "</span>" : "") +
    (l.date ? '<span class="pill">' + roDate(l.date) + "</span>" : "") +
    '<span class="pill accent">' + nQ + " întrebări · " + totalPts(l) + " puncte</span>" +
    "</div>" +
    ((l.objectives || []).length ? '<hr class="sep"><div class="eyebrow">Obiective</div><ul class="doc" style="margin-top:6px">' +
      l.objectives.map(o => "<li>" + inl(o) + "</li>").join("") + "</ul>" : "") +
    '<hr class="sep"><div class="doc">' + renderMd(l.body) + "</div>" +
    "</div>";

  /* întrebări */
  main += '<h3 style="font-size:18px;margin:26px 0 12px">Întrebări și aplicații</h3>';
  main += '<div id="qlist">' + renderQList(l, ready, submitted) + "</div>";

  /* predare */
  main += renderSubmitCard(l, ready, submitted, done, nQ);

  return '<div class="shell">' + rail + "<div>" + main + "</div></div>";
}

function identNoteHtml() {
  return identOK()
    ? '<p class="small muted" id="identNote" style="margin-top:9px">Cod de date: <b class="mono">#' + mySeed().toString(36).toUpperCase().slice(0, 6) + "</b> — valorile numerice de mai jos sunt generate pentru tine și rămân aceleași la fiecare deschidere.</p>"
    : '<p class="small" id="identNote" style="margin-top:9px;color:var(--warn)">Completează numele și grupa: aplicațiile numerice primesc date individuale, diferite de la student la student.</p>';
}
function refreshIdentity() {
  const l = lab(); if (!l || S.role !== "student") return;
  const seed = mySeed(), ready = identOK();
  const note = $("#identNote"); if (note) note.outerHTML = identNoteHtml();
  const b = $("#btnSubmit"); if (b) b.disabled = !ready;
  const ns = $("#btnNewStudent"); if (ns && !S.result) ns.hidden = !ready || S.fromLMS;
  const h = $("#submitHint");
  if (h) h.textContent = answeredCount(l) + " din " + (l.questions || []).length + " întrebări completate" + (ready ? "" : " · completează numele și grupa");
  /* lista de întrebări se reconstruiește doar când chiar se schimbă datele generate */
  if (S.renderedSeed !== seed || S.renderedReady !== ready) {
    const ql = $("#qlist");
    if (ql) ql.innerHTML = renderQList(l, ready, !!S.result);
    S.renderedSeed = seed; S.renderedReady = ready;
  }
  updateProgress();
}
let identT = null;
function refreshIdentitySoon() { clearTimeout(identT); identT = setTimeout(refreshIdentity, 220); }
function renderQ(q, i, ready, submitted, inGrila) {
  const given = q.type === "num" ? qGiven(q) : {};
  const decMap = {}; (q.vars || []).forEach(v => decMap[v.name] = Number(v.dec) || 0);
  const label = q.type === "num" ? "Aplicație numerică" : q.type === "open" ? "Răspuns liber" : "Întrebare grilă";
  const val = S.ans[q.id];
  let inner = "";

  if (q.type === "mcq") {
    const hasFig = (q.options || []).some(o => /!\[[^\]]*\]\(/.test(String(o)));
    inner = '<div class="opts' + (hasFig ? " grid" : "") + '">' + (q.options || []).map((o, k) => {
      let cls = "opt" + (Number(val) === k ? " sel" : "");
      if (submitted && S.result) {
        const it = S.result.items.find(x => x.id === q.id);
        if (it && it.correct != null) { if (k === it.correct) cls += " ok"; else if (Number(val) === k) cls += " bad"; }
      }
      return '<label class="' + cls + '"><input type="radio" name="opt-' + esc(q.id) + '" value="' + k + '" data-q="' + esc(q.id) + '"' +
        (Number(val) === k ? " checked" : "") + (submitted ? " disabled" : "") + '><span class="lt">' + "abcdefgh"[k] + ")</span><span>" + inl(o) + "</span></label>";
    }).join("") + "</div>";
  } else if (q.type === "num") {
    inner = (ready && (q.vars || []).length ? '<div class="given">' + (q.vars || []).map(v =>
      "<span>" + esc(v.name) + " = " + fmt(given[v.name], Number(v.dec) || 0) + (v.unit ? " " + esc(v.unit) : "") + "</span>").join("") + "</div>" : "") +
      '<div class="numline"><input type="text" inputmode="decimal" data-q="' + esc(q.id) + '" value="' + esc(val == null ? "" : val) + '" placeholder="' + (ready ? "valoarea calculată" : "completează întâi numele") + '"' + (submitted || !ready ? " disabled" : "") + ">" +
      (q.unit ? '<span class="unit">' + esc(q.unit) + "</span>" : "") + "</div>";
  } else {
    inner = '<textarea data-q="' + esc(q.id) + '" rows="' + (Number(q.rows) || 4) + '" placeholder="Scrie răspunsul tău…"' + (submitted ? " disabled" : "") + ">" + esc(val == null ? "" : val) + "</textarea>";
  }

  let fb = "";
  if (submitted && S.result) {
    const it = S.result.items.find(x => x.id === q.id);
    if (it) {
      if (q.type === "open") fb = '<div class="fb note"><b>Se evaluează de către cadrul didactic.</b>' + (q.model ? " Reper: " + inl(q.model) : "") + "</div>";
      else if (it.ok === true) fb = '<div class="fb ok"><b>Corect</b> · ' + it.earned + " p" + (q.explain ? " — " + inl(q.explain) : "") + "</div>";
      else if (it.ok === false) fb = '<div class="fb bad"><b>Greșit</b> · 0 din ' + it.points + " p" +
        (q.type === "num" && it.correct != null ? " — valoarea corectă: <b>" + fmt(it.correct, q.dec == null ? 2 : q.dec) + " " + esc(q.unit || "") + "</b>" : "") +
        (q.solution ? "<br>" + inl(subVars(q.solution, it.given, decMap)) : (q.explain ? " — " + inl(q.explain) : "")) + "</div>";
      else fb = '<div class="fb note">Răspuns înregistrat. Corectarea se face de către cadrul didactic.</div>';
    }
  }

  const tag = inGrila ? "div" : "section";
  return "<" + tag + ' class="' + (inGrila ? "gq" : "q") + '" id="' + esc(q.id) + '">' +
    '<div class="qhead"><span class="qnum">' + (inGrila ? "Întrebarea " + (i + 1) : (i + 1) + " · " + label) + '</span><span class="pill">' + (Number(q.points) || 0) + " p</span></div>" +
    '<div class="qtext">' + inl(subVars(q.text, given, decMap)) + "</div>" + inner + fb + "</" + tag + ">";
}

/* ============================ partajare și coduri QR ============================ */
function canShare() { try { return typeof navigator !== "undefined" && typeof navigator.share === "function"; } catch (e) { return false; } }
function subjectFor(l) {
  return "Laborator: " + (l ? l.title : "") + " — " + (S.student.name || "") + " (" + (S.student.group || "") + ")";
}
function mailtoFor(l, r) {
  const body = "Bună ziua,\n\nTrimit codul de predare pentru laboratorul „" + l.title + "”.\n\n" + r.code +
    "\n\n" + (S.student.name || "") + ", grupa " + (S.student.group || "");
  return "mailto:" + encodeURIComponent(l.teacherEmail || "") + "?subject=" + encodeURIComponent(subjectFor(l)) + "&body=" + encodeURIComponent(body);
}
async function shareSubmission() {
  const l = lab(), r = S.result;
  if (!l || !r) return;
  const payload = { title: subjectFor(l), text: subjectFor(l) + "\n\n" + r.code };
  try { await navigator.share(payload); return; }
  catch (e) { if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) { if (e.name === "AbortError") return; } }
  await copyText(r.code);
  toast("Partajarea nu e disponibilă aici — codul a fost copiat");
}
function qrBlock(text, opts) {
  opts = opts || {};
  try {
    return '<div class="qrwrap' + (opts.big ? " big" : "") + (opts.small ? " small" : "") + '">' +
      (opts.who ? '<div class="who">' + esc(opts.who) + "</div>" : "") +
      qrSvg(text, { ec: opts.ec || "L", label: opts.label || "cod QR" }) +
      (opts.after ? '<div class="after">' + esc(opts.after) + "</div>" : "") + "</div>";
  } catch (e) {
    return '<div class="fb bad">Codul este prea lung pentru un cod QR. Folosește trimiterea pe e-mail sau copierea codului.</div>';
  }
}
function printModal() { try { window.print(); } catch (e) { toast("Tipărirea nu este disponibilă aici"); } }

function renderLabList() {

function guessLink() {
  const sb = siteBase();
  if (sb) return sb;
  const saved = LS.get(K.link, "");
  if (saved) return saved;
  try {
    const r = document.referrer || "";
    if (/^https:\/\/(www\.)?claude\.ai\//.test(r)) return r.split("#")[0];
  } catch (e) { }
  try {
    const h = location.href;
    if (/^https?:/.test(h)) return h.split("#")[0];
  } catch (e) { }
  return "";
}
function keyParam() { const k = pubKey(); return k ? "&k=" + k : ""; }
function labLink(id) {
  const b = guessLink();
  return b ? b.split("#")[0] + "#lab=" + id + keyParam() : "";
}
/* Site-ul (GitHub Pages): index.html = toate lucrările, lucrari/<id>.html = doar lucrarea respectivă.
   Adresa vine din setari.json („site”) sau, pe paginile site-ului („auto”), din adresa paginii. */
function siteBase() {
  try {
    const P = window.__CL_PRESET || {}, s = String(P.site || "");
    if (!s) return "";
    if (s !== "auto") return /\/$/.test(s) ? s : s + "/";
    const h = String(location.href).split("#")[0].split("?")[0];
    if (!/^https?:/i.test(h)) return "";
    const i = h.indexOf("/lucrari/");
    return i >= 0 ? h.slice(0, i + 1) : h.replace(/[^/]*$/, "");
  } catch (e) { return ""; }
}
function labUrl(l) {
  if (!l) return appLink();
  if (l.link) return l.link;
  const sb = siteBase();
  return sb ? sb + "lucrari/" + encodeURIComponent(l.id) + ".html" : labLink(l.id);
}
function onClaude() { return /^https:\/\/([a-z0-9-]+\.)*claude\.ai\//i.test(guessLink()); }
function appLink() {
  const sb = siteBase();
  if (sb) return sb;
  const b = guessLink();

  const k = pubKey();
  return b.split("#")[0] + (k ? "#k=" + k : "");
}

/* ---------- situația studenților ---------- */
function studKey(c) {
  return (c.name || "").trim().toLowerCase().replace(/\s+/g, " ") + "|" + (c.group || "").trim().toLowerCase();
}
function notaOf(c) {
  const r = catRow(c);
  const typed = c.nota != null && String(c.nota).trim() !== "" ? parseNum(c.nota) : NaN;
  if (isFinite(typed)) return { nota: typed, propusa: false, r: r };
  if (r.max) return { nota: 1 + 9 * r.total / r.max, propusa: true, r: r };
  return { nota: null, propusa: true, r: r };
}
function gradebook() {
  const order = S.labs.map(l => l.id);
  const used = [], byStud = {};
  S.catalog.forEach(c => {
    const k = studKey(c);
    if (!byStud[k]) byStud[k] = { key: k, name: c.name, group: c.group, labs: {} };
    const n = notaOf(c);
    const prev = byStud[k].labs[c.labId];
    /* dacă un student a predat de două ori aceeași lucrare, rămâne fișa cea mai recentă */
    if (!prev || String(c.submittedAt || "") >= String(prev.submittedAt || "")) {
      byStud[k].labs[c.labId] = { nota: n.nota, propusa: n.propusa, total: n.r.total, max: n.r.max, pending: n.r.pending, submittedAt: c.submittedAt, subKey: c.key };
    }
    if (used.indexOf(c.labId) < 0) used.push(c.labId);
  });
  used.sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const rows = Object.keys(byStud).map(k => {
    const st = byStud[k];
    const notes = used.map(id => st.labs[id] ? st.labs[id].nota : null).filter(n => n != null && isFinite(n));
    st.count = notes.length;
    st.final = notes.length ? notes.reduce((a, b) => a + b, 0) / notes.length : null;
    let tot = 0, max = 0;
    used.forEach(id => { const x = st.labs[id]; if (x && x.max) { tot += x.total; max += x.max; } });
    st.pct = max ? tot / max * 100 : null;
    st.anyPending = used.some(id => st.labs[id] && st.labs[id].pending);
    return st;
  }).sort((a, b) => (a.group + " " + a.name).localeCompare(b.group + " " + b.name, "ro"));
  return { used: used, rows: rows };
}
function labShort(id) {
  const l = S.labs.find(x => x.id === id);
  if (!l) return id;
  const m = String(l.course || l.title).match(/(\d+)/);
  return m ? "L" + m[1] : (l.course || l.title).slice(0, 8);
}

  h += '<div class="card" style="padding:6px 6px 2px"><div style="overflow-x:auto"><table class="tbl"><thead><tr>' +

    "<th class='num'>Lucrări</th><th class='num'>Nota finală</th></tr></thead><tbody>";

      }).join("") +
      "<td class='num'>" + st.count + "/" + g.used.length + "</td>" +
      "<td class='num'>" + (st.final != null ? '<b style="font-size:15px">' + fmt(st.final, 2) + "</b>" : "—") + "</td></tr>";
  }).join("");
  h += "</tbody></table></div></div>";
  h += '<p class="small muted" style="margin-top:10px">* lucrare cu întrebări deschise încă necorectate.</p>';
  return h;
}
function renderRank() {
  const g = gradebook();
  const groups = {};
  g.rows.forEach(st => { if (st.pct == null) return; (groups[st.group || "—"] = groups[st.group || "—"] || []).push(st); });
  const names = S.rankNames;
  let b = '<label class="row small" style="gap:7px;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="rankNames"' + (names ? " checked" : "") +
    ' style="width:auto;accent-color:var(--accent)"><span>Arată numele studenților</span></label>';
  const keys = Object.keys(groups).sort((a, b2) => a.localeCompare(b2, "ro"));
  if (!keys.length) return b + '<div class="empty">Nicio fișă evaluată încă.</div>';
  b += keys.map(gr => {
    const list = groups[gr].slice().sort((a, b2) => b2.pct - a.pct);
    return '<div style="margin-bottom:20px"><div class="eyebrow" style="margin-bottom:8px">Grupa ' + esc(gr) + "</div>" +
      '<div class="rank">' + list.map((st, i) => {
        const cls = i === 0 ? " top" : "";
        return '<div class="rankrow' + cls + '"><span class="pos">' + (i + 1) + "</span>" +
          '<span class="who">' + esc(names ? st.name : "Student " + (i + 1)) + "</span>" +
          '<span class="barw"><i style="width:' + Math.max(3, Math.round(st.pct)) + '%"></i></span>' +
          '<span class="pctv mono">' + Math.round(st.pct) + "%</span>" +
          '<span class="notav mono">' + (st.final != null ? fmt(st.final, 2) : "—") + "</span></div>";
      }).join("") + "</div></div>";
  }).join("");
  return b;
}
function renderHelp() {
  return '<div class="card doc" style="max-width:76ch">' + renderMd(
    "## Confiden\u021bialitatea r\u0103spunsurilor\n\n\u00cen fila *Acces studen\u021bi*, butonul **Genereaz\u0103 cheile** creeaz\u0103 o pereche de chei: cheia **public\u0103** pleac\u0103 la studen\u021bi \u00een codurile QR, cheia **privat\u0103** r\u0103m\u00e2ne doar la tine. De atunci, fiecare fi\u0219\u0103 predat\u0103 este criptat\u0103 pentru tine: nici studentul care a scris-o, nici colegii lui nu o mai pot deschide, chiar dac\u0103 \u00ee\u0219i trimit codurile \u00eentre ei. \u00cen catalog, fi\u0219ele primite criptat sunt marcate cu un lac\u0103t.\n\n> **P\u0103streaz\u0103 fi\u0219ierul cheii.** La generare se descarc\u0103 automat un fi\u0219ier `cheie-profesor-XXXXXX.json`. Cheia privat\u0103 exist\u0103 doar \u00een browserul acestui calculator; dac\u0103 o pierzi, fi\u0219ele deja primite nu mai pot fi deschise de nimeni. Pune fi\u0219ierul \u00een dou\u0103 locuri sigure \u0219i import\u0103-l pe orice alt calculator pe care corectezi.\n\nStudentul deschide fi\u0219a prin codul QR, care con\u021bine \u0219i cheia. Dac\u0103 ajunge la aplica\u021bie altfel \u0219i nu are cheia, codul lui iese necriptat \u0219i aplica\u021bia \u00eei spune asta \u2014 tu \u00eel vezi \u00een catalog f\u0103r\u0103 lac\u0103t. Pe calculatoarele din laborator, deschide aplica\u021bia o dat\u0103 cu adresa care con\u021bine cheia (o g\u0103se\u0219ti sub fiecare cod QR): aplica\u021bia o re\u021bine pentru urm\u0103toarele deschideri de pe acel calculator.\n\n## Accesul la modul profesor\n\nModul profesor este \u00eenchis cu un cod pe care \u00eel alegi tu, la prima intrare. Studen\u021bii care deschid linkul v\u0103d doar fi\u0219a de laborator \u2014 comutatorul *Student / Profesor* nici nu apare la ei. Ca s\u0103 intri, apas\u0103 insigna **LAB** din col\u021bul st\u00e2nga sus \u0219i scrie codul; la ie\u0219ire, ape\u0219i lac\u0103tul din dreapta sus. Pe calculatoarele din laborator **nu bifa** „\u021aine minte pe acest calculator\u201d.\n\n> Codul \u021bine studen\u021bii departe de editor, de catalog \u0219i de note. Nu este \u00eens\u0103 o \u00eencuietoare de seif: cine se pricepe poate citi codul-surs\u0103 al paginii. Pentru lucr\u0103ri notate, apărarea real\u0103 r\u0103m\u00e2ne faptul c\u0103 fiecare student prime\u0219te alte date numerice.\n\n## Pe scurt\n\n1. **Creezi sau editezi lucrarea** \u00een fila *Editor*: antet, descriere, figuri, \u00eentreb\u0103ri gril\u0103, aplica\u021bii numerice cu date generate individual \u0219i \u00eentreb\u0103ri cu r\u0103spuns liber.\n2. **Afi\u0219ezi codul QR** al lucr\u0103rii din fila *Acces studen\u021bi*. Fiecare lucrare are propriul cod, care se actualizeaz\u0103 singur c\u00e2nd ad\u0103ugi sau sco\u021bi lucr\u0103ri.\n3. **Studentul** \u00ee\u0219i scrie numele \u0219i grupa (a\u0219a prime\u0219te propriul set de date numerice), r\u0103spunde \u0219i apas\u0103 *Finalizeaz\u0103*. Fi\u0219a se salveaz\u0103 automat pe parcurs, deci poate \u00eenchide pagina \u0219i relua mai t\u00e2rziu.\n4. **Trimiterea**: dintr-o ap\u0103sare, prin e-mail, WhatsApp sau Teams \u2014 sau, f\u0103r\u0103 semnal, ca un cod QR pe care \u00eel scanezi de pe ecranul lui.\n5. **Tu** lipe\u0219ti \u00een *Catalog* tot ce ai primit \u2014 un e-mail, o conversa\u021bie, oric\u00e2t text: aplica\u021bia g\u0103se\u0219te singur\u0103 toate codurile. Corecteaz\u0103 automat grilele \u0219i aplica\u021biile numerice; tu acorzi punctajul la r\u0103spunsurile libere.\n6. **Nota final\u0103** apare \u00een fila *Note finale*: media notelor de la lucr\u0103rile predate, cu export \u00een Excel \u0219i clasament pe grupe pentru proiec\u021bie.\n\n## Cum adaugi o lucrare nou\u0103, f\u0103r\u0103 ajutor din afar\u0103\n\n1. *Laboratoare* \u2192 **Laborator nou**.\n2. Completezi antetul \u0219i descrierea. Textul accept\u0103 titluri (`## Titlu`), liste, \u00eengro\u0219at (`**text**`), tabele cu `|`, indici `x_{i}` \u0219i exponen\u021bi `x^{2}`.\n3. **Figurile**: butonul *Figuri disponibile* \u2192 *Adaug\u0103 figuri din calculator*. Aplica\u021bia le mic\u0219oreaz\u0103 singur\u0103 \u0219i le salveaz\u0103 \u00een lucrare; le inserezi cu un clic, care copiaz\u0103 codul `![descriere](cheie)`.\n4. Adaugi \u00eentreb\u0103rile \u0219i ape\u0219i *Salveaz\u0103*. Lucrarea apare imediat \u00een list\u0103 \u0219i prime\u0219te automat propriul cod QR.\n5. Din c\u00e2nd \u00een c\u00e2nd apas\u0103 **Export\u0103 pachetul** \u2014 un singur fi\u0219ier cu toate lucr\u0103rile \u0219i figurile lor, pe care \u00eel po\u021bi reimporta oric\u00e2nd, pe orice calculator.\n\n## Aplica\u021bii numerice individuale\n\nFiecare aplica\u021bie numeric\u0103 poate avea variabile cu interval, pas \u0219i unitate de m\u0103sur\u0103. Valorile se genereaz\u0103 dintr-un *cod de date* derivat din numele \u0219i grupa studentului: sunt diferite de la student la student, dar identice la fiecare redeschidere pentru acela\u0219i student. Corectarea folose\u0219te exact valorile primite de el. Dac\u0103 pui aceea\u0219i valoare la *min* \u0219i la *max*, \u00eentrebarea devine fix\u0103, cu datele din \u00eendrumar.\n\n## R\u0103spunsurile corecte\n\nCu *autoevaluarea* pornit\u0103, studentul \u00ee\u0219i vede punctajul imediat \u2014 dar r\u0103spunsurile corecte se afl\u0103 \u00een pachetul trimis lui. Pentru lucr\u0103ri notate, oprete autoevaluarea: pachetul studentului va con\u021bine doar enun\u021burile, iar corectarea se face la tine.\n\n## Unde se p\u0103streaz\u0103 datele\n\nLucr\u0103rile livrate cu pagina vin odat\u0103 cu fi\u0219ierul. Lucr\u0103rile pe care le creezi sau le modifici tu, figurile lor \u0219i catalogul se salveaz\u0103 **\u00een browserul acestui calculator**, \u00eentr-o baz\u0103 de date local\u0103 care suport\u0103 \u0219i imagini. Nu se sincronizeaz\u0103 \u00eentre dispozitive \u0219i se pierd dac\u0103 \u0219tergi datele browserului \u2014 de aceea *Export\u0103 pachetul* \u0219i *Backup JSON* din Catalog sunt importante.\n\n## \u0218tergerea unei lucr\u0103ri\n\n*\u0218terge* scoate lucrarea din list\u0103 \u0219i o \u021bine ascuns\u0103 \u0219i dup\u0103 reînc\u0103rcarea paginii. Dac\u0103 te r\u0103zg\u00e2nde\u0219ti, \u00een capul listei apare butonul *Readu-le*.") + "</div>";
}

function updateProgress() {
  const l = lab(); if (!l) return;
  const n = (l.questions || []).length, d = answeredCount(l);
  const t = $("#progTxt"), b = $("#progBar");
  if (t) t.textContent = d + "/" + n;
  if (b) b.style.width = (n ? Math.round(d / n * 100) : 0) + "%";
  qBlocks(l).forEach(b => {
    if (b.grila) {
      const a = $("[data-qg]"); if (!a) return;
      const n = b.items.length, d = b.items.filter(x => isAnswered(x.q)).length;
      a.classList.toggle("done", d === n);
      a.querySelector(".n").textContent = d === n ? "✓" : "▢";
      const c = a.querySelector("[data-qgc]"); if (c) c.textContent = "(" + d + "/" + n + ")";
      return;
    }
    const a = $('[data-ql="' + b.q.id + '"]');
    if (!a) return;
    const done = isAnswered(b.q);
    a.classList.toggle("done", done);
    a.querySelector(".n").textContent = done ? "✓" : (b.i + 1);
  });
}

async function doSubmit() {
  const l = lab(); if (!l || !identOK()) return;
  const n = (l.questions || []).length, d = answeredCount(l);
  if (d < n) {
    const ok = await confirmModal("Fișă incompletă", "Ai completat " + d + " din " + n + " întrebări. Întrebările necompletate se punctează cu zero. Trimiți fișa acum?", "Trimit fișa");
    if (!ok) return;
  }
  const given = {}, answers = {};
  (l.questions || []).forEach(q => {
    if (q.type === "num") given[q.id] = genVars(q, mySeed());
    const v = S.ans[q.id];
    if (v !== undefined && String(v).trim() !== "") answers[q.id] = v;
  });
  const sub = {
    v: 1, labId: l.id, labTitle: l.title, name: (S.student.name || "").trim(), group: (S.student.group || "").trim(),
    seed: mySeed(), submittedAt: new Date().toISOString(), answers: answers, given: given
  };
  const r = gradeSub(l, sub);

  r.code = await encodePayload(sub);
  r.qr = await encodePayload(compactSub(sub));
  r.enc = /^LAB[23]\./.test(r.code);
  S.result = r;
  saveDraft();
  if (LMS.present()) { try { LMS.done(r.autoMax ? r.auto / r.autoMax * 100 : 0); } catch (e) { } }
