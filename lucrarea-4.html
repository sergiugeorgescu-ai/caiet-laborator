<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lucrarea 4 · Caiet de Laborator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E9EEF1; --surface-3:#DFE6EA;
  --line:#D5DEE4; --line-strong:#BCC9D1;
  --ink:#121A20; --ink-2:#44535E; --ink-3:#6E8090;
  --accent:#0D6875; --accent-ink:#FFFFFF; --accent-soft:#DCEDF0; --accent-line:#8FC3CB;
  --good:#2C7248; --good-soft:#DFF0E5;
  --warn:#8C6212; --warn-soft:#F6EBD3;
  --crit:#A93A38; --crit-soft:#F7E2E1;
  --shadow:0 1px 2px rgba(18,26,32,.06),0 6px 18px -10px rgba(18,26,32,.22);
  --radius:10px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
    --line:#2A3945; --line-strong:#3B4D5B;
    --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
    --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
    --good:#66C18C; --good-soft:#12301F;
    --warn:#D7AB55; --warn-soft:#332813;
    --crit:#E2817C; --crit-soft:#361D1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#141D23; --surface-2:#1B262E; --surface-3:#22303A;
  --line:#2A3945; --line-strong:#3B4D5B;
  --ink:#E7EEF2; --ink-2:#A8B9C4; --ink-3:#7A8D9A;
  --accent:#4BB8C7; --accent-ink:#06222A; --accent-soft:#12303A; --accent-line:#2E6875;
  --good:#66C18C; --good-soft:#12301F;
  --warn:#D7AB55; --warn-soft:#332813;
  --crit:#E2817C; --crit-soft:#361D1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:16px;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);
  padding:6px 8px;border-radius:6px;white-space:nowrap;border:0;cursor:pointer}
.mark:hover{filter:brightness(1.1)}
.brand h1{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topActions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:grid;place-items:center}

main{flex:1;width:100%;max-width:1140px;margin:0 auto;padding:22px 16px 56px}
.pagefoot{border-top:1px solid var(--line);padding:14px 16px 26px;font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.tiny{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500;flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=email],select,textarea{
  font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:7px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- layout with rail ---------- */
.shell{display:grid;grid-template-columns:minmax(0,232px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}
.rail{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.rail{position:static}}
.rail a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink-2);font-size:13px;
  padding:6px 9px;border-radius:7px;border-left:2px solid transparent}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.done{color:var(--ink-3)}
.rail a .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;width:18px}
.rail a.done .n{color:var(--good)}
.progWrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:8px}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ---------- lab text ---------- */
.doc{font-size:15px;line-height:1.68;max-width:70ch}
.doc h2{font-size:19px;margin:24px 0 8px}
.doc h3{font-size:16px;margin:20px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin:3px 0}
.doc code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--accent-line);background:var(--accent-soft);border-radius:0 7px 7px 0}
.doc blockquote p:last-child{margin:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.tableWrap{overflow-x:auto;margin:0 0 14px}
.doc table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.doc th{background:var(--surface-2);font-weight:600;font-family:var(--sans)}
.doc td.num,.doc th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px}
.doc img,.opt img,.figpick img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;margin:2px 0}
.doc p > img{margin:6px auto}
.doc em{color:var(--ink-2)}
.doc table td img{margin:0 auto}
.imgmiss{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--crit);background:var(--crit-soft);padding:2px 7px;border-radius:5px}

/* ---------- questions ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;scroll-margin-top:80px}
.q + .q{margin-top:12px}
.gq{padding:14px 0 4px;scroll-margin-top:80px}
.gq + .gq{border-top:1px solid var(--line);margin-top:12px;padding-top:18px}
.qhead{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.qnum{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.qtext{font-size:15px;line-height:1.6;margin-bottom:12px}
.val{font-family:var(--mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (max-width:620px){.opts.grid{grid-template-columns:minmax(0,1fr)}}
.opts.grid .opt{flex-wrap:wrap;align-items:center}
.opts.grid .opt > span:last-child{flex:1 1 100%;min-width:0;margin-top:7px}
.qrwrap{text-align:center}
.qrwrap svg{width:min(76vw,360px);height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.qrwrap.big svg{width:min(88vw,66vh)}
.qrwrap.small svg{width:min(60vw,190px);padding:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.figitem{position:relative}
.figitem .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:12px;cursor:pointer;color:var(--crit);padding:0}
.rank{display:flex;flex-direction:column;gap:6px}
.rankrow{display:grid;grid-template-columns:28px minmax(90px,1fr) minmax(70px,2fr) 46px 46px;gap:10px;align-items:center;
  padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.rankrow.top{border-color:var(--accent);background:var(--accent-soft)}
.rankrow .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:right}
.rankrow.top .pos{color:var(--accent);font-weight:600}
.rankrow .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .barw{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.rankrow .barw i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rankrow .pctv{font-size:12.5px;color:var(--ink-2);text-align:right}
.rankrow .notav{font-size:14px;font-weight:600;text-align:right}
@media (max-width:560px){.rankrow{grid-template-columns:24px 1fr 44px 44px}.rankrow .barw{display:none}}
.meter{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.qrwrap .who{font-family:var(--mono);font-size:13px;margin-bottom:10px;color:var(--ink-2)}
.qrwrap .after{font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:44ch;margin-left:auto;margin-right:auto}
.linkbox{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all}
@media print{
  body > *{display:none!important}
  #modal{display:block!important;position:static;background:none;padding:0}
  .modalBox{border:0;box-shadow:none;max-height:none;width:100%}
  .modalBox > header button,.modalBox > footer{display:none}
  .qrwrap svg{width:15cm;border:0}
  .qrwrap.big svg{width:15cm}
}
.figpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.figpick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;text-align:left;font-size:11px}
.figpick button:hover{border-color:var(--accent)}
.figpick code{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);min-width:0}
.opt > span{min-width:0}
.opt:hover{border-color:var(--accent-line);background:var(--surface-2)}
.opt input{margin:3px 0 0;accent-color:var(--accent);flex-shrink:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .lt{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex-shrink:0;width:14px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--crit);background:var(--crit-soft)}
.numline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numline input{max-width:200px;font-family:var(--mono);font-size:15px}
.unit{font-family:var(--mono);font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:6px 9px;border-radius:6px;border:1px solid var(--line)}
.given{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.given span{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.fb{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--crit-soft);color:var(--crit)}
.fb.note{background:var(--surface-2);color:var(--ink-2)}
.fb b{font-weight:600}

/* ---------- tables (catalog / editor) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3);font-size:13.5px}

/* ---------- editor ---------- */
.qedit{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:13px;margin-top:10px}
.qedit .qeHead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.optedit{display:flex;gap:7px;align-items:center;margin-top:6px}
.optedit input[type=radio]{accent-color:var(--accent);flex-shrink:0}
.varrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr)) 34px;gap:7px;align-items:end;margin-top:7px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- code box ---------- */
.codebox{font-family:var(--mono);font-size:11.5px;line-height:1.45;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:11px;word-break:break-all;max-height:150px;overflow-y:auto;color:var(--ink-2)}
.scoreBig{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;color:var(--accent)}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(8,14,18,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modalBox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modalBox > header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modalBox > .body{padding:18px;overflow-y:auto}
.modalBox > footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const Store = (function () {
  let handle, tried = false;
  function open() {
    return new Promise(res => {
      if (typeof indexedDB === "undefined") return res(null);
      let req;
      try { req = indexedDB.open("caiet-laborator", 1); } catch (e) { return res(null); }
      req.onupgradeneeded = () => { try { req.result.createObjectStore("kv"); } catch (e) { } };
      req.onsuccess = () => res(req.result);

    });
  }

    available: async () => !!(await ready()),
    async get(k, d) {
      const h = await ready();
      if (!h) return LS.get(k, d);
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readonly").objectStore("kv").get(k);
          rq.onsuccess = () => res(rq.result === undefined ? LS.get(k, d) : rq.result);
          rq.onerror = () => res(LS.get(k, d));
        } catch (e) { res(LS.get(k, d)); }
      });
    },
    async set(k, v) {
      const h = await ready();
      if (!h) { LS.set(k, v); return false; }
      return new Promise(res => {
        try {
          const rq = h.transaction("kv", "readwrite").objectStore("kv").put(v, k);
          rq.onsuccess = () => res(true);
          rq.onerror = () => { LS.set(k, v); res(false); };
        } catch (e) { LS.set(k, v); res(false); }
      });
    }
  };
})();

/* ============================ platforma de eLearning (SCORM) ============================ */
/* Când aplicația rulează într-un curs Moodle, ia numele studentului din platformă
   și raportează înapoi finalizarea lucrării. În afara platformei, totul e inactiv. */
const LMS = (function () {
  let api = null, started = false, tried = false;
  function find() {
    let w = window, n = 0;
    while (w && n++ < 12) {
      try { if (w.API) return w.API; } catch (e) { }
      try { w = (w.parent && w.parent !== w) ? w.parent : null; } catch (e) { w = null; }

    try { if (window.opener && window.opener.API) return window.opener.API; } catch (e) { }

  function get() { if (!tried) { tried = true; api = find(); } return api; }

    present() { return !!get(); },
    init() {
      const a = get(); if (!a || started) return false;
      try { started = a.LMSInitialize("") === "true" || a.LMSInitialize("") === true; } catch (e) { started = false; }
      return started;
    },
    student() {
      const a = get(); if (!a) return null;
      try {
        const raw = a.LMSGetValue("cmi.core.student_name") || "";
        const id = a.LMSGetValue("cmi.core.student_id") || "";
        const nume = String(raw).replace(/,/g, " ").replace(/\s+/g, " ").trim();
        return nume ? { name: nume, id: String(id) } : null;
      } catch (e) { return null; }
    },
    done(procent) {
      const a = get(); if (!a) return;
      try {
        a.LMSSetValue("cmi.core.lesson_status", "completed");
        if (isFinite(procent)) {
          a.LMSSetValue("cmi.core.score.raw", String(Math.round(procent)));
          a.LMSSetValue("cmi.core.score.min", "0");
          a.LMSSetValue("cmi.core.score.max", "100");
        }
        a.LMSCommit("");
      } catch (e) { }
    },
    finish() { const a = get(); if (!a || !started) return; try { a.LMSFinish(""); } catch (e) { } }
  };
})();

  "body": "## 4.1. Introducere\n\nÎn tehnica uscării lemnului, starea aerului cald și umed din interiorul instalației de uscare se modifică pe parcursul procesului, conform regimului de uscare. În afară de umiditatea lemnului, principalii parametri ai regimurilor de uscare sunt **temperatura, umiditatea și viteza aerului**. Valoarea acestora determină decisiv durata și calitatea uscării:\n\n- **temperatura (T)** este principalul factor de accelerare a procesului de uscare: odată cu creșterea temperaturii cresc atât viteza de evaporare a apei de la suprafața lemnului, cât și viteza de difuziune a apei în interiorul lemnului. Totodată însă, cu creșterea temperaturii crește și riscul de producere a defectelor de uscare (crăpături, colorații);\n- **umiditatea relativă a aerului (φ)** reprezintă gradul de saturare al aerului cu vapori și este un factor de frânare a uscării: cu cât este mai ridicată, cu atât capacitatea aerului de a absorbi umiditatea eliminată din lemn este mai redusă. Din punct de vedere calitativ însă, cu cât umiditatea aerului este mai mare, cu atât regimul de uscare este mai blând, iar uscarea decurge cu risc redus de producere a crăpăturilor;\n- **umiditatea de echilibru (U_{e})** reprezintă umiditatea către care tinde lemnul menținut timp îndelungat într-un mediu caracterizat de o anumită temperatură și umiditate relativă. Pe această proprietate se bazează procesele de uscare și condiționare;\n- **viteza aerului** și uniformitatea acesteia influențează dinamica schimbului de căldură dintre mediul de uscare și lemn, precum și dinamica evaporării apei de la suprafața lemnului. Asemeni temperaturii, viteza este un factor de accelerare a procesului, iar uniformitatea ei în cuprinsul stivei determină uniformitatea distribuției umidității finale. Acestui parametru i se dedică o lucrare separată (Lucrarea 5).\n\nAvând în vedere aceste influențe, pentru fiecare sortiment (în funcție de specie, grosime, nivelul umidității) trebuie respectate anumite limite de variație ale acestor parametri. Acest lucru nu este posibil fără a cunoaște cu exactitate, în orice moment al procesului, valorile lor efective — de aici necesitatea măsurării lor continue pe parcursul procesului.\n\n## 4.2. Măsurarea temperaturii\n\nProcedeele de măsurare a temperaturii se clasifică în două grupe principale:\n\n- pe cale **neelectrică**, cu termometre de dilatație (termometre de sticlă cu lichid, termometre cu tijă, termometre bimetalice) și termometre manometrice;\n- pe cale **electrică**, cu termometre electrice (termorezistențe, termocuple, termistoare).\n\nAlegerea metodei ține cont de domeniul de măsurare, de precizia cerută, de facilitățile oferite (citire de la distanță, conectare într-un circuit de reglare etc.), de compatibilitatea materialului termometrului cu mediul în care este amplasat, de robustețea și simplitatea constructivă și de costul aparatului.\n\nÎn practica uscării se aplică în principal două variante:\n\n- măsurarea cu un **termometru de sticlă cu mercur** (așa-numitul „termometru uscat” al psihrometrului — vezi Fig. 4.3);\n- măsurarea cu **traductori termorezistivi**.\n\nPrima variantă, aplicată numai în absența unui sistem de conducere și reglare automată, are avantajul unei precizii ridicate și al costului redus; principalul dezavantaj este imposibilitatea citirii de la distanță. În marea majoritate a cazurilor, termometrele „reci” au fost înlocuite de termometre electrice, care pot fi conectate într-un sistem automat, permițând citirea de la distanță, comanda automată a elementelor de execuție în vederea reglării și înregistrarea automată a valorilor măsurate.\n\nCele mai utilizate traductoare de temperatură sunt în prezent **termorezistențele** (Fig. 4.1). Constructiv, termorezistența constă dintr-o bobină de dimensiuni reduse (30...60 mm lungime și 4...6 mm lățime sau diametru), cu conductorul sub forma unui fir cu diametrul de 0,05...0,2 mm, înfășurat pe un suport izolator din mică, ceramică sau sticlă (în funcție de temperatura de lucru) și acoperit cu un strat protector împotriva acțiunii corozive externe. Pentru instalare, termorezistențele sunt introduse într-o armătură de protecție (din oțel inox, alamă sau oțel aliat cu nichel și crom), prevăzută cu flanșă de fixare și cu o cutie cu bornele de conexiune (Popa 2012).\n\n| ![Termorezistență — aspect exterior](l4-fig41a) | ![Termorezistență — schemă](l4-fig41b) |\n| a — aspectul exterior al unei termorezistențe | b — schema termorezistenței |\n\n*Fig. 4.1. Termorezistență (Popa 2012): 1 — teacă de protecție; 2 — cutia de borne; 3 — cablu de legătură; 4 — firul traductor; 5 — suport izolator; 6 — borne de conectare a firelor de legătură.*\n\nPrincipiul de măsurare cu termorezistența are la bază **variația rezistenței electrice a unui conductor în funcție de temperatură**. Ca materiale conductoare se utilizează în principal platina, nichelul sau cuprul. În Fig. 4.2 se prezintă variația raportului R_{t}/R_{0} pentru aceste materiale, în funcție de temperatură.\n\n![Variația rezistenței electrice cu temperatura](l4-fig42)\n\n*Fig. 4.2. Curbele de variație a rezistenței electrice în funcție de temperatură pentru nichel, cupru și platină (Chiciuc și Corjan 2002): R_{t} — rezistența la temperatura T; R_{0} — rezistența la 0 °C; T — temperatura mediului, °C.*\n\nMajoritatea instalațiilor de uscare sunt echipate cu **termorezistențe din platină Pt100 sau Pt1000**, montate în interiorul unei carcase de protecție din aluminiu sau oțel inoxidabil.\n\n## 4.3. Determinarea umidității relative a aerului\n\nUmiditatea relativă a aerului (φ) se poate determina fie cu ajutorul psihrometrului, fie prin calcul.\n\n### 4.3.1. Utilizarea psihrometrului\n\nPsihrometrul este un aparat foarte simplu, dar eficient, pentru că permite măsurarea simultană a celor mai importanți doi parametri ai aerului în procesele de uscare: temperatura și umiditatea relativă. Constructiv, psihrometrul (Fig. 4.3) este format din **două termometre identice** (de dilatație, manometrice sau electrice): unul are tija liberă în curentul de aer (**termometrul uscat**), celălalt are tija înfășurată într-un manșon din tifon sau finet umezit permanent cu apă distilată (**termometrul umed**).\n\n| ![Psihrometru — aspect general](l4-fig43a) | ![Psihrometru — detaliu](l4-fig43b) |\n| a — aspectul general al unui psihrometru | b — detaliu privind construcția psihrometrului |\n\n*Fig. 4.3. Psihrometru (Câmpean și Marinescu 2000; CTBA 2002): 1 — termometru uscat; 2 — termometru umed; 3 — tifon; 4 — rezervor cu apă distilată.*\n\n**Termometrul uscat** măsoară temperatura aerului din instalație, numită temperatura termometrului uscat și notată cu *t*.\n\n**Termometrul umed** măsoară temperatura de evaporare a apei la saturație adiabatică — procesul în care căldura necesară evaporării se ia numai din aerul înconjurător din interiorul instalației. În acest proces temperatura aerului scade și, la saturația deplină a aerului cu apă, devine egală cu temperatura apei care se evaporă. Această temperatură, numită temperatura termometrului umed, se notează cu *t_{u}* și este întotdeauna mai mică sau cel mult egală cu *t*.\n\nDiferența **Δt = t − t_{u}** se numește **diferență psihrometrică** și este o măsură a gradului de saturare cu vapori a aerului: cu cât diferența psihrometrică este mai mică, cu atât aerul este mai umed.\n\nPornind de la indicațiile psihrometrului, umiditatea relativă a aerului se determină ușor cu ajutorul **tabelei psihrometrice** (Tabelul 4.1): pe rândul temperaturii termometrului uscat *t* și în coloana diferenței psihrometrice Δt. Valorile din tabel sunt valabile pentru o viteză a aerului de **cel puțin 2 m/s** în jurul tijelor aparatului.\n\n**Tabelul 4.1. Tabela psihrometrică** (Câmpean și Marinescu 2000)\n\n![Tabela psihrometrică](l4-t41)\n\n### 4.3.2. Metoda analitică\n\nUmiditatea relativă a aerului (φ) este, prin definiție, raportul dintre umiditatea absolută (ρ_{v}) și umiditatea absolută maximă (ρ_{s}) la o temperatură dată. Deoarece, prin aproximare cu gazele ideale, densitatea vaporilor se consideră proporțională cu presiunea lor (legea Boyle-Mariotte), rezultă:\n\n> **φ = p_{v} / p_{s} · 100**  [%]  (4.1)\n\nîn care: *p_{s}* este presiunea de saturație a vaporilor la temperatura termometrului uscat, în N/m² (Tabelul 4.2); *p_{v}* — presiunea parțială a vaporilor, în N/m².\n\n**Tabelul 4.2. Valorile presiunii de saturație în funcție de temperatură**\n\n| Temperatura, °C | Presiunea de saturație, N/m² | Temperatura, °C | Presiunea de saturație, N/m² |\n|---|---|---|---|\n| 40 | 7375 | 70 | 31170 |\n| 45 | 9584 | 75 | 38550 |\n| 50 | 12335 | 80 | 47360 |\n| 55 | 15740 | 85 | 57810 |\n| 60 | 19917 | 90 | 70110 |\n| 65 | 25010 | 95 | 84570 |\n| | | 100 | 101325 |\n\nPresiunea parțială a vaporilor se calculează cu Ecuația 4.2:\n\n> **p_{v} = p'_{s} − C · p_{b} · (t − t_{u})**  [N/m²]  (4.2)\n\nîn care: *p'_{s}* este presiunea de saturație a vaporilor la temperatura termometrului umed, în N/m² (se citește tot din Tabelul 4.2); *p_{b}* — presiunea atmosferică; variază cu altitudinea și cu condițiile climatice, dar în calculele tehnice se consideră constantă și egală cu 10^{5} N/m²; *C* — coeficientul psihrometric, care depinde de viteza aerului prin instalație, *v* (m/s):\n\n> **C = (65 + 6,75 / v) · 10^{-5}**  (4.3)\n\n## 4.4. Măsurarea umidității de echilibru\n\nCa material higroscopic, lemnul are proprietatea de a-și schimba umiditatea în funcție de parametrii aerului care îl înconjoară. Menținută timp îndelungat într-un mediu cu o anumită stare, orice piesă de lemn tinde să ajungă la echilibru cu acest mediu, modificându-și umiditatea prin **sorbție** sau **desorbție**, până la atingerea așa-numitei **umidități de echilibru U_{e}** (Fig. 4.4).\n\n![Sorbția și desorbția lemnului](l4-fig44)\n\n*Fig. 4.4. Sorbția și desorbția lemnului (Câmpean și Marinescu 2012).*\n\nExperimental s-a constatat că umiditatea de echilibru **nu depinde aproape deloc de specie**, ci este determinată numai de parametrii de stare ai aerului (T și φ). Pe această bază a fost elaborată **diagrama umidității de echilibru** (Fig. 4.5): punctul definit de temperatura aerului (pe orizontală) și umiditatea relativă (pe verticală) cade pe curba — sau între curbele — umidității de echilibru corespunzătoare.\n\n![Diagrama umidității de echilibru](l4-fig45)\n\n*Fig. 4.5. Diagrama umidității de echilibru (prelucrare după Trübswetter 2006).*\n\nRelația dintre cei trei parametri T, φ și U_{e} stă la baza schemelor de reglare automată a parametrilor procesului de uscare, atunci când nu se măsoară direct umiditatea relativă φ, ci umiditatea de echilibru U_{e}.\n\nPentru măsurarea umidității de echilibru în timpul procesului de uscare se utilizează **traductori speciali**, care au ca senzor propriu-zis o **plăcuță subțire din furnir de limba sau celuloză**. Fiind foarte higroscopică, plăcuța ajunge aproape instantaneu la echilibru cu mediul care o înconjoară. Ea se poziționează cu strângere între doi electrozi din oțel inoxidabil, întregul ansamblu fiind amplasat pe peretele instalației, sub o placă protectoare, pentru a evita infiltrarea condensului. La instalațiile cu circulație reversibilă a aerului sunt necesari **doi astfel de traductori**.\n\n| ![Traductorul de umiditate de echilibru — construcție](l4-fig46a) | ![Traductorul de umiditate de echilibru — amplasare](l4-fig46b) |\n| a — detaliu privind construcția senzorului | b — modul de amplasare a senzorului în instalația de uscare |\n\n*Fig. 4.6. Traductorul pentru măsurarea umidității de echilibru (SECEA 2010; Popa 2012): 1 — piesă din oțel inoxidabil; 2 — plăcuță celulozică; 3 — piulițe randalinate; 4 — resort; 5 — piesă izolatoare; 6 — papuc de fixare a cablului; 7 — cablul de legătură; 8 — conector; 9 — suport izolator pentru conectori.*\n\nPrincipiul de măsurare este cel **rezistiv**: are la bază variația rezistenței electrice a plăcuței higroscopice în funcție de umiditatea ei. Rezistența traductorului este dată de Ecuația /* Modul profesor este închis cu un cod ales de cadrul didactic. Codul nu se
   păstrează niciodată în clar — se compară o amprentă a lui. */
const PIN_SALT = "caiet-laborator|";
async function hashPin(pin) {
  const txt = PIN_SALT + String(pin);
  try {
    if (typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return "h" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { }
  /* pagina deschisă direct de pe disc nu are funcții criptografice */
  return "s" + hashStr(txt).toString(36) + hashStr(txt + "|2" + pin).toString(36);
}
function pinSet() { return !!LS.get(K.pin, ""); }
function sessUnlocked() {

}
function setUnlocked(v, keep) {

  if (keep === true) LS.set(K.keep, true);
  if (keep === false || !v) LS.del(K.keep);
}

/* Lucrările livrate cu pagina (BUILTIN) rămân în pagină. În browser se salvează

let USER_LABS = [], HIDDEN = [];
/* Paginile publice nu conțin baremul (vezi tools/barem.py). Profesorul îl
   încarcă o dată, ca fișier; se păstrează doar în browserul lui. */
let BAREM = {};
function withBarem(l) {
  const b = l.stripped && BAREM[l.id];
  if (!b) return l;
  (l.questions || []).forEach(q => Object.assign(q, (b.questions || {})[q.id] || {}));
  delete l.stripped;
  return l;
}
function rebuildLabs() {
  const byId = {};
  USER_LABS.forEach(l => { if (l && l.id) byId[l.id] = l; });
  const out = [];
  BUILTIN.forEach(b => {
    if (HIDDEN.indexOf(b.id) >= 0) return;
    out.push(withBarem(byId[b.id] ? byId[b.id] : JSON.parse(JSON.stringify(b))));
  });
  USER_LABS.forEach(l => { if (!BUILTIN.some(b => b.id === l.id) && HIDDEN.indexOf(l.id) < 0) out.push(l); });
  S.labs = out;
  if (!S.labId || !S.labs.some(l => l.id === S.labId)) S.labId = S.labs[0] ? S.labs[0].id : null;
}
let saveErr = false;
async function persistLabs() {

function storeLab(l) {

  HIDDEN = HIDDEN.filter(id => id !== copy.id);

function removeLab(id) {

/* O lucrare livrată cu pagina, dar salvată (modificată sau importată) în acest browser:
   copia locală are prioritate, inclusiv la corectare. */
function localCopyOf(id) { return isBuiltin(id) ? USER_LABS.find(x => x && x.id === id) || null : null; }
function differsFromBuiltin(id) {
  const c = localCopyOf(id), b = BUILTIN.find(x => x.id === id);
  if (!c || !b) return false;
  return c.title !== b.title || c.body !== b.body || JSON.stringify(c.questions) !== JSON.stringify(b.questions);
}
function resetToBuiltin(id) {
  USER_LABS = USER_LABS.filter(x => !(x && x.id === id));

function autoPts(l) { return (l.questions || []).filter(q => q.type !== "open").reduce((a, q) => a + (Number(q.points) || 0), 0); }

function stripLab(l) {
  const c = JSON.parse(JSON.stringify(l));
  c.stripped = true;
  (c.questions || []).forEach(q => {
    delete q.explain; delete q.model; delete q.solution;
    if (!l.selfCheck) { delete q.correct; delete q.expr; delete q.tolPct; delete q.tolAbs; }
  });
  if (!l.selfCheck) c.selfCheck = false;

}
/* corectare automată; `full` = laboratorul cu răspunsuri (la profesor) */
function givenFor(q, sub) {
  if (q.type !== "num") return {};
  if (sub.given && sub.given[q.id]) return sub.given[q.id];
  if (sub.seed != null) return genVars(q, sub.seed);
  return {};
}
function gradeSub(full, sub) {
  const res = { items: [], auto: 0, autoMax: 0, openMax: 0 };
  (full.questions || []).forEach(q => {
    const pts = Number(q.points) || 0;
    const given = givenFor(q, sub);
    const a = sub.answers ? sub.answers[q.id] : undefined;
    const it = { id: q.id, type: q.type, points: pts, answer: a, given: given, ok: null, earned: 0, correct: null };
    if (q.type === "mcq") {
      res.autoMax += pts;
      if (typeof q.correct === "number") { it.correct = q.correct; it.ok = Number(a) === q.correct; it.earned = it.ok ? pts : 0; res.auto += it.earned; }
    } else if (q.type === "num") {
      res.autoMax += pts;
      if (q.expr) {
        const cv = evalExpr(q.expr, given);
        it.correct = cv;
        const av = parseNum(a);
        const tol = Math.max(Number(q.tolAbs) || 0, (Number(q.tolPct) || 0) / 100 * Math.abs(cv));
        it.ok = isFinite(av) && isFinite(cv) && Math.abs(av - cv) <= (tol || Math.abs(cv) * 0.02);
        it.earned = it.ok ? pts : 0; res.auto += it.earned;
      }
    } else { res.openMax += pts; }
    res.items.push(it);
  });
  return res;
}

/* Toate grilele unei lucrări formează un singur test „Grilă”, afișat în locul primei grile.

function qBlocks(l) {
  const qs = l.questions || [], mcqs = qs.filter(q => q.type === "mcq"), out = [];
  let n = 0;
  qs.forEach(q => {
    if (q.type !== "mcq") { out.push({ q: q, i: n++ }); return; }
    if (q === mcqs[0]) out.push({ grila: true, items: mcqs.map(m => ({ q: m, i: n++ })) });
  });

}
function isAnswered(q) { const v = S.ans[q.id]; return v !== undefined && v !== null && String(v).trim() !== ""; }
function renderQList(l, ready, submitted) {

}

  const given = q.type === "num" ? qGiven(q) : {};
  const decMap = {}; (q.vars || []).forEach(v => decMap[v.name] = Number(v.dec) || 0);
  const label = q.type === "num" ? "Aplicație numerică" : q.type === "open" ? "Răspuns liber" : "Întrebare grilă";
  const val = S.ans[q.id];
  let inner = "";

  if (q.type === "mcq") {
    const hasFig = (q.options || []).some(o => /!\[[^\]]*\]\(/.test(String(o)));
    inner = '<div class="opts' + (hasFig ? " grid" : "") + '">' + (q.options || []).map((o, k) => {
      let cls = "opt" + (Number(val) === k ? " sel" : "");
      if (submitted && S.result) {
        const it = S.result.items.find(x => x.id === q.id);
        if (it && it.correct != null) { if (k === it.correct) cls += " ok"; else if (Number(val) === k) cls += " bad"; }
      }
      return '<label class="' + cls + '"><input type="radio" name="opt-' + esc(q.id) + '" value="' + k + '" data-q="' + esc(q.id) + '"' +
        (Number(val) === k ? " checked" : "") + (submitted ? " disabled" : "") + '><span class="lt">' + "abcdefgh"[k] + ")</span><span>" + inl(o) + "</span></label>";
    }).join("") + "</div>";
  } else if (q.type === "num") {
    inner = (ready && (q.vars || []).length ? '<div class="given">' + (q.vars || []).map(v =>
      "<span>" + esc(v.name) + " = " + fmt(given[v.name], Number(v.dec) || 0) + (v.unit ? " " + esc(v.unit) : "") + "</span>").join("") + "</div>" : "") +
      '<div class="numline"><input type="text" inputmode="decimal" data-q="' + esc(q.id) + '" value="' + esc(val == null ? "" : val) + '" placeholder="' + (ready ? "valoarea calculată" : "completează întâi numele") + '"' + (submitted || !ready ? " disabled" : "") + ">" +
      (q.unit ? '<span class="unit">' + esc(q.unit) + "</span>" : "") + "</div>";
  } else {
    inner = '<textarea data-q="' + esc(q.id) + '" rows="' + (Number(q.rows) || 4) + '" placeholder="Scrie răspunsul tău…"' + (submitted ? " disabled" : "") + ">" + esc(val == null ? "" : val) + "</textarea>";
  }

  let fb = "";
  if (submitted && S.result) {
    const it = S.result.items.find(x => x.id === q.id);
    if (it) {
      if (q.type === "open") fb = '<div class="fb note"><b>Se evaluează de către cadrul didactic.</b>' + (q.model ? " Reper: " + inl(q.model) : "") + "</div>";
      else if (it.ok === true) fb = '<div class="fb ok"><b>Corect</b> · ' + it.earned + " p" + (q.explain ? " — " + inl(q.explain) : "") + "</div>";
      else if (it.ok === false) fb = '<div class="fb bad"><b>Greșit</b> · 0 din ' + it.points + " p" +
        (q.type === "num" && it.correct != null ? " — valoarea corectă: <b>" + fmt(it.correct, q.dec == null ? 2 : q.dec) + " " + esc(q.unit || "") + "</b>" : "") +
        (q.solution ? "<br>" + inl(subVars(q.solution, it.given, decMap)) : (q.explain ? " — " + inl(q.explain) : "")) + "</div>";
      else fb = '<div class="fb note">Răspuns înregistrat. Corectarea se face de către cadrul didactic.</div>';
    }
  }

  const tag = inGrila ? "div" : "section";
  return "<" + tag + ' class="' + (inGrila ? "gq" : "q") + '" id="' + esc(q.id) + '">' +
    '<div class="qhead"><span class="qnum">' + (inGrila ? "Întrebarea " + (i + 1) : (i + 1) + " · " + label) + '</span><span class="pill">' + (Number(q.points) || 0) + " p</span></div>" +
    '<div class="qtext">' + inl(subVars(q.text, given, decMap)) + "</div>" + inner + fb + "</" + tag + ">";
}

/* ============================ partajare și coduri QR ============================ */
function canShare() { try { return typeof navigator !== "undefined" && typeof navigator.share === "function"; } catch (e) { return false; } }
function subjectFor(l) {
  return "Laborator: " + (l ? l.title : "") + " — " + (S.student.name || "") + " (" + (S.student.group || "") + ")";
}
function mailtoFor(l, r) {
  const body = "Bună ziua,\n\nTrimit codul de predare pentru laboratorul „" + l.title + "”.\n\n" + r.code +
    "\n\n" + (S.student.name || "") + ", grupa " + (S.student.group || "");
  return "mailto:" + encodeURIComponent(l.teacherEmail || "") + "?subject=" + encodeURIComponent(subjectFor(l)) + "&body=" + encodeURIComponent(body);
}
async function shareSubmission() {
  const l = lab(), r = S.result;
  if (!l || !r) return;
  const payload = { title: subjectFor(l), text: subjectFor(l) + "\n\n" + r.code };
  try { await navigator.share(payload); return; }
  catch (e) { if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) { if (e.name === "AbortError") return; } }
  await copyText(r.code);
  toast("Partajarea nu e disponibilă aici — codul a fost copiat");
}
function qrBlock(text, opts) {
  opts = opts || {};
  try {
    return '<div class="qrwrap' + (opts.big ? " big" : "") + (opts.small ? " small" : "") + '">' +
      (opts.who ? '<div class="who">' + esc(opts.who) + "</div>" : "") +
      qrSvg(text, { ec: opts.ec || "L", label: opts.label || "cod QR" }) +
      (opts.after ? '<div class="after">' + esc(opts.after) + "</div>" : "") + "</div>";
  } catch (e) {
    return '<div class="fb bad">Codul este prea lung pentru un cod QR. Folosește trimiterea pe e-mail sau copierea codului.</div>';
  }
}
function printModal() { try { window.print(); } catch (e) { toast("Tipărirea nu este disponibilă aici"); } }

function renderQEdit(q, i, n) {
  const T = { mcq: "Grilă", num: "Aplicație numerică", open: "Răspuns liber" };
  let h = '<div class="qedit"><div class="qeHead"><div class="row" style="gap:7px">' +
    '<span class="qnum">' + (i + 1) + "</span><span class='pill accent'>" + T[q.type] + "</span>" +

    "</div><div class='row' style='gap:4px'>" +
    '<button type="button" class="btn tiny" data-act="qUp" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
    '<button type="button" class="btn tiny" data-act="qDown" data-i="' + i + '"' + (i === n - 1 ? " disabled" : "") + ">↓</button>" +
    '<button type="button" class="btn tiny danger" data-act="qDel" data-i="' + i + '">✕</button></div></div>';

  h += '<label class="fld"><span>Enunț' + (q.type === "num" ? " — folosește {{nume_variabilă}} pentru datele generate" : "") + '</span>' +
    '<textarea data-qi="' + i + '" data-f="text" rows="3">' + esc(q.text) + "</textarea></label>";

  if (q.type === "mcq") {
    h += '<div class="small" style="margin-top:9px;color:var(--ink-2)">Variante (bifează varianta corectă)</div>';
    h += (q.options || []).map((o, k) =>
      '<div class="optedit"><input type="radio" name="corr-' + i + '" data-act="setCorrect" data-i="' + i + '" data-k="' + k + '"' + (q.correct === k ? " checked" : "") + ">" +
      '<input type="text" data-qi="' + i + '" data-opt="' + k + '" value="' + esc(o) + '" placeholder="varianta ' + "abcdefgh"[k] + '">' +

function studKey(c) {
  return (c.name || "").trim().toLowerCase().replace(/\s+/g, " ") + "|" + (c.group || "").trim().toLowerCase();
}
function notaOf(c) {
  const r = catRow(c);
  const typed = c.nota != null && String(c.nota).trim() !== "" ? parseNum(c.nota) : NaN;
  if (isFinite(typed)) return { nota: typed, propusa: false, r: r };
  if (r.max) return { nota: 1 + 9 * r.total / r.max, propusa: true, r: r };
  return { nota: null, propusa: true, r: r };
}
function gradebook() {
  const order = S.labs.map(l => l.id);
  const used = [], byStud = {};
  S.catalog.forEach(c => {
    const k = studKey(c);
    if (!byStud[k]) byStud[k] = { key: k, name: c.name, group: c.group, labs: {} };
    const n = notaOf(c);
    const prev = byStud[k].labs[c.labId];
    /* dacă un student a predat de două ori aceeași lucrare, rămâne fișa cea mai recentă */
    if (!prev || String(c.submittedAt || "") >= String(prev.submittedAt || "")) {
      byStud[k].labs[c.labId] = { nota: n.nota, propusa: n.propusa, total: n.r.total, max: n.r.max, pending: n.r.pending, submittedAt: c.submittedAt, subKey: c.key };
    }
    if (used.indexOf(c.labId) < 0) used.push(c.labId);
  });
  used.sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const rows = Object.keys(byStud).map(k => {
    const st = byStud[k];
    const notes = used.map(id => st.labs[id] ? st.labs[id].nota : null).filter(n => n != null && isFinite(n));
    st.count = notes.length;
    st.final = notes.length ? notes.reduce((a, b) => a + b, 0) / notes.length : null;
    let tot = 0, max = 0;
    used.forEach(id => { const x = st.labs[id]; if (x && x.max) { tot += x.total; max += x.max; } });
    st.pct = max ? tot / max * 100 : null;
    st.anyPending = used.some(id => st.labs[id] && st.labs[id].pending);
    return st;
  }).sort((a, b) => (a.group + " " + a.name).localeCompare(b.group + " " + b.name, "ro"));
  return { used: used, rows: rows };
}
function labShort(id) {
  const l = S.labs.find(x => x.id === id);

  const m = String(l.course || l.title).match(/(\d+)/);
  return m ? "L" + m[1] : (l.course || l.title).slice(0, 8);
}

  const groups = {};
  g.rows.forEach(st => { if (st.pct == null) return; (groups[st.group || "—"] = groups[st.group || "—"] || []).push(st); });
  const names = S.rankNames;
  let b = '<label class="row small" style="gap:7px;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="rankNames"' + (names ? " checked" : "") +
    ' style="width:auto;accent-color:var(--accent)"><span>Arată numele studenților</span></label>';
  const keys = Object.keys(groups).sort((a, b2) => a.localeCompare(b2, "ro"));
  if (!keys.length) return b + '<div class="empty">Nicio fișă evaluată încă.</div>';
  b += keys.map(gr => {
    const list = groups[gr].slice().sort((a, b2) => b2.pct - a.pct);
    return '<div style="margin-bottom:20px"><div class="eyebrow" style="margin-bottom:8px">Grupa ' + esc(gr) + "</div>" +
      '<div class="rank">' + list.map((st, i) => {

        return '<div class="rankrow' + cls + '"><span class="pos">' + (i + 1) + "</span>" +
          '<span class="who">' + esc(names ? st.name : "Student " + (i + 1)) + "</span>" +

  }).join("");
  return b;
}
function renderHelp() {
  return '<div class="card doc" style="max-width:76ch">' + renderMd(
    "## Confiden\u021bialitatea r\u0103spunsurilor\n\n\u00cen fila *Acces studen\u021bi*, butonul **Genereaz\u0103 cheile** creeaz\u0103 o pereche de chei: cheia **public\u0103** pleac\u0103 la studen\u021bi \u00een codurile QR, cheia **privat\u0103** r\u0103m\u00e2ne doar la tine. De atunci, fiecare fi\u0219\u0103 predat\u0103 este criptat\u0103 pentru tine: nici studentul care a scris-o, nici colegii lui nu o mai pot deschide, chiar dac\u0103 \u00ee\u0219i trimit codurile \u00eentre ei. \u00cen catalog, fi\u0219ele primite criptat sunt marcate cu un lac\u0103t.\n\n> **P\u0103streaz\u0103 fi\u0219ierul cheii.** La generare se descarc\u0103 automat un fi\u0219ier `cheie-profesor-XXXXXX.json`. Cheia privat\u0103 exist\u0103 doar \u00een browserul acestui calculator; dac\u0103 o pierzi, fi\u0219ele deja primite nu mai pot fi deschise de nimeni. Pune fi\u0219ierul \u00een dou\u0103 locuri sigure \u0219i import\u0103-l pe orice alt calculator pe care corectezi.\n\nStudentul deschide fi\u0219a prin codul QR, care con\u021bine \u0219i cheia. Dac\u0103 ajunge la aplica\u021bie altfel \u0219i nu are cheia, codul lui iese necriptat \u0219i aplica\u021bia \u00eei spune asta \u2014 tu \u00eel vezi \u00een catalog f\u0103r\u0103 lac\u0103t. Pe calculatoarele din laborator, deschide aplica\u021bia o dat\u0103 cu adresa care con\u021bine cheia (o g\u0103se\u0219ti sub fiecare cod QR): aplica\u021bia o re\u021bine pentru urm\u0103toarele deschideri de pe acel calculator.\n\n## Accesul la modul profesor\n\nModul profesor este \u00eenchis cu un cod pe care \u00eel alegi tu, la prima intrare. Studen\u021bii care deschid linkul v\u0103d doar fi\u0219a de laborator \u2014 comutatorul *Student / Profesor* nici nu apare la ei. Ca s\u0103 intri, apas\u0103 insigna **LAB** din col\u021bul st\u00e2nga sus \u0219i scrie codul; la ie\u0219ire, ape\u0219i lac\u0103tul din dreapta sus. Pe calculatoarele din laborator **nu bifa** „\u021aine minte pe acest calculator\u201d.\n\n> Codul \u021bine studen\u021bii departe de editor, de catalog \u0219i de note. Nu este \u00eens\u0103 o \u00eencuietoare de seif: cine se pricepe poate citi codul-surs\u0103 al paginii. Pentru lucr\u0103ri notate, apărarea real\u0103 r\u0103m\u00e2ne faptul c\u0103 fiecare student prime\u0219te alte date numerice.\n\n## Pe scurt\n\n1. **Creezi sau editezi lucrarea** \u00een fila *Editor*: antet, descriere, figuri, \u00eentreb\u0103ri gril\u0103, aplica\u021bii numerice cu date generate individual \u0219i \u00eentreb\u0103ri cu r\u0103spuns liber.\n2. **Afi\u0219ezi codul QR** al lucr\u0103rii din fila *Acces studen\u021bi*. Fiecare lucrare are propriul cod, care se actualizeaz\u0103 singur c\u00e2nd ad\u0103ugi sau sco\u021bi lucr\u0103ri.\n3. **Studentul** \u00ee\u0219i scrie numele \u0219i grupa (a\u0219a prime\u0219te propriul set de date numerice), r\u0103spunde \u0219i apas\u0103 *Finalizeaz\u0103*. Fi\u0219a se salveaz\u0103 automat pe parcurs, deci poate \u00eenchide pagina \u0219i relua mai t\u00e2rziu.\n4. **Trimiterea**: dintr-o ap\u0103sare, prin e-mail, WhatsApp sau Teams \u2014 sau, f\u0103r\u0103 semnal, ca un cod QR pe care \u00eel scanezi de pe ecranul lui.\n5. **Tu** lipe\u0219ti \u00een *Catalog* tot ce ai primit \u2014 un e-mail, o conversa\u021bie, oric\u00e2t text: aplica\u021bia g\u0103se\u0219te singur\u0103 toate codurile. Corecteaz\u0103 automat grilele \u0219i aplica\u021biile numerice; tu acorzi punctajul la r\u0103spunsurile libere.\n6. **Nota final\u0103** apare \u00een fila *Note finale*: media notelor de la lucr\u0103rile predate, cu export \u00een Excel \u0219i clasament pe grupe pentru proiec\u021bie.\n\n## Cum adaugi o lucrare nou\u0103, f\u0103r\u0103 ajutor din afar\u0103\n\n1. *Laboratoare* \u2192 **Laborator nou**.\n2. Completezi antetul \u0219i descrierea. Textul accept\u0103 titluri (`## Titlu`), liste, \u00eengro\u0219at (`**text**`), tabele cu `|`, indici `x_{i}` \u0219i exponen\u021bi `x^{2}`.\n3. **Figurile**: butonul *Figuri disponibile* \u2192 *Adaug\u0103 figuri din calculator*. Aplica\u021bia le mic\u0219oreaz\u0103 singur\u0103 \u0219i le salveaz\u0103 \u00een lucrare; le inserezi cu un clic, care copiaz\u0103 codul `![descriere](cheie)`.\n4. Adaugi \u00eentreb\u0103rile \u0219i ape\u0219i *Salveaz\u0103*. Lucrarea apare imediat \u00een list\u0103 \u0219i prime\u0219te automat propriul cod QR.\n5. Din c\u00e2nd \u00een c\u00e2nd apas\u0103 **Export\u0103 pachetul** \u2014 un singur fi\u0219ier cu toate lucr\u0103rile \u0219i figurile lor, pe care \u00eel po\u021bi reimporta oric\u00e2nd, pe orice calculator.\n\n## Aplica\u021bii numerice individuale\n\nFiecare aplica\u021bie numeric\u0103 poate avea variabile cu interval, pas \u0219i unitate de m\u0103sur\u0103. Valorile se genereaz\u0103 dintr-un *cod de date* derivat din numele \u0219i grupa studentului: sunt diferite de la student la student, dar identice la fiecare redeschidere pentru acela\u0219i student. Corectarea folose\u0219te exact valorile primite de el. Dac\u0103 pui aceea\u0219i valoare la *min* \u0219i la *max*, \u00eentrebarea devine fix\u0103, cu datele din \u00eendrumar.\n\n## R\u0103spunsurile corecte\n\nCu *autoevaluarea* pornit\u0103, studentul \u00ee\u0219i vede punctajul imediat \u2014 dar r\u0103spunsurile corecte se afl\u0103 \u00een pachetul trimis lui. Pentru lucr\u0103ri notate, oprete autoevaluarea: pachetul studentului va con\u021bine doar enun\u021burile, iar corectarea se face la tine.\n\nLucrările livrate cu pagina publică nu conțin baremul. Pe calculatorul tău, încarcă o dată fișierul de barem (`barem-lucrari.json`) din *Laboratoare* → **Importă…**: aplicația îl păstrează în acest browser și corectează cu el. Nu îl încărca pe calculatoarele din laborator și nu îl pune pe site.\n\n## Unde se p\u0103streaz\u0103 datele\n\nLucr\u0103rile livrate cu pagina vin odat\u0103 cu fi\u0219ierul. Lucr\u0103rile pe care le creezi sau le modifici tu, figurile lor \u0219i catalogul se salveaz\u0103 **\u00een browserul acestui calculator**, \u00eentr-o baz\u0103 de date local\u0103 care suport\u0103 \u0219i imagini. Nu se sincronizeaz\u0103 \u00eentre dispozitive \u0219i se pierd dac\u0103 \u0219tergi datele browserului \u2014 de aceea *Export\u0103 pachetul* \u0219i *Backup JSON* din Catalog sunt importante.\n\n## \u0218tergerea unei lucr\u0103ri\n\n*\u0218terge* scoate lucrarea din list\u0103 \u0219i o \u021bine ascuns\u0103 \u0219i dup\u0103 reînc\u0103rcarea paginii. Dac\u0103 te r\u0103zg\u00e2nde\u0219ti, \u00een capul listei apare butonul *Readu-le*.") + "</div>";
}

let draftT = null, savedT = null;
function flashSaved() {
  const el = $("#savedTag"); if (!el) return;
  const l = lab(); if (!l) return;
  el.textContent = "salvat ✓";
  el.style.color = "var(--good)";
  clearTimeout(savedT);

function saveDraft() {
  const l = lab(); if (!l) return;
  flashSaved();
  clearTimeout(draftT);
  draftT = setTimeout(() => LS.set(K.draft(l.id), { ans: S.ans, sub: S.result ? { code: S.result.code, qr: S.result.qr, submittedAt: S.result.submittedAt } : null, who: S.student }), 350);
}
function restoreDraft() {
  const l = lab(); if (!l) { S.ans = {}; S.result = null; return; }
  const d = LS.get(K.draft(l.id), null);
  S.ans = d && d.ans ? d.ans : {};
  S.result = null;
  if (d && d.sub && d.sub.code) {
    const sub = { labId: l.id, answers: S.ans, given: {} };
    (l.questions || []).forEach(q => { if (q.type === "num") sub.given[q.id] = genVars(q, mySeed()); });
    const r = gradeSub(l, sub);
    r.code = d.sub.code; r.qr = d.sub.qr || d.sub.code; r.submittedAt = d.sub.submittedAt;
    r.enc = /^LAB[23]\./.test(r.code || "");
    S.result = r;
  }
}

/* ============================ predare ============================ */
async function doSubmit() {
  const l = lab(); if (!l || !identOK()) return;
  const n = (l.questions || []).length, d = answeredCount(l);
  if (d < n) {
    const ok = await confirmModal("Fișă incompletă", "Ai completat " + d + " din " + n + " întrebări. Întrebările necompletate se punctează cu zero. Trimiți fișa acum?", "Trimit fișa");
    if (!ok) return;
  }
  const given = {}, answers = {};
  (l.questions || []).forEach(q => {
    if (q.type === "num") given[q.id] = genVars(q, mySeed());
    const v = S.ans[q.id];
    if (v !== undefined && String(v).trim() !== "") answers[q.id] = v;
  });
  const sub = {
    v: 1, labId: l.id, labTitle: l.title, name: (S.student.name || "").trim(), group: (S.student.group || "").trim(),
    seed: mySeed(), submittedAt: new Date().toISOString(), answers: answers, given: given
  };
  const r = gradeSub(l, sub);
  r.submittedAt = sub.submittedAt;
  r.code = await encodePayload(sub);
  r.qr = await encodePayload(compactSub(sub));
  r.enc = /^LAB[23]\./.test(r.code);
  S.result = r;
  saveDraft();
  if (LMS.present()) { try { LMS.done(r.autoMax ? r.auto / r.autoMax * 100 : 0); } catch (e) { } }
  render();
  toast("Fișa a fost finalizată — trimite codul cadrului didactic");
  setTimeout(() => { const c = $("#codeBox"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); }, 60);
}

/* ============================ figuri proprii ============================ */
function fileToDataURL(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error("citire"));
    r.readAsDataURL(f);
  });
}
/* micșorează imaginea în browser, ca fișierul lucrării să rămână mic */
function shrinkImage(dataUrl, maxW) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const w = Math.min(maxW || 900, im.naturalWidth || maxW);
      const h = Math.max(1, Math.round((im.naturalHeight || 1) * w / (im.naturalWidth || w)));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      let out = null;
      try { out = c.toDataURL("image/webp", 0.8); } catch (e) { }
      if (!out || out.indexOf("data:image/webp") !== 0) { try { out = c.toDataURL("image/jpeg", 0.82); } catch (e) { out = null; } }
      res(out || dataUrl);
    };
    im.onerror = () => res(null);
    im.src = dataUrl;
  });
}
function slugKey(name, taken) {
  let b = String(name || "figura").replace(/\.[^.]+$/, "").toLowerCase()
    .replace(/[ăâà]/g, "a").replace(/[îí]/g, "i").replace(/ș|ş/g, "s").replace(/ț|ţ/g, "t").replace(/[éè]/g, "e")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28);
  if (!b) b = "figura";
  let k = b, n = 2;
  while (taken.indexOf(k) >= 0) { k = b + "-" + n; n++; }
  return k;
}
async function addFigures() {
  if (!S.edit) return;
  const files = (await pickFile("image/*", true)).filter(f => /^image\//.test(f.type));
  if (!files.length) return;
  S.edit.images = S.edit.images || {};
  let added = 0, failed = 0;
  for (const f of files) {
    try {
      const raw = await fileToDataURL(f);
      const small = await shrinkImage(raw, 900);
      if (!small) { failed++; continue; }
      const k = slugKey(f.name, Object.keys(S.edit.images).concat(Object.keys(IMG)));
      S.edit.images[k] = small;
      added++;
    } catch (e) { failed++; }
  }
  toast(added + " figuri adăugate" + (failed ? " · " + failed + " nu au putut fi citite" : ""));
  openFigModal();
}

/* ============================ import / export ============================ */
function pickFile(accept, multiple) {
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = accept || ".json,.txt"; if (multiple) inp.multiple = true;
    inp.style.display = "none"; document.body.appendChild(inp);
    inp.addEventListener("change", () => { const f = Array.from(inp.files || []); inp.remove(); res(f); });
    inp.click();
  });
}
async function readFiles(files) { return Promise.all(files.map(f => f.text())); }
async function parseAny(text) {
  const t = String(text || "").trim();
  if (!t) throw new Error("gol");
  if (t[0] === "{" || t[0] === "[") return JSON.parse(t);
  return await decodePayload(t);
}
function isLab(o) { return o && typeof o === "object" && Array.isArray(o.questions) && o.title != null; }
function isSub(o) { return o && typeof o === "object" && ((o.answers && o.labId) || (o.a && o.l)); }

async function importLabText(text) {
  const o = await parseAny(text);
  if (o && o.caietBarem && o.labs) {
    Object.assign(BAREM, o.labs);
    await Store.set(K.barem, BAREM);
    rebuildLabs(); restoreDraft();
    toast("Baremul a fost încărcat pentru " + Object.keys(o.labs).length + " lucrări");
    return;
  }
  const arr = Array.isArray(o) ? o : [o];
  let n = 0;
  arr.forEach(x => {
    if (!isLab(x)) return;
    if (!x.id) x.id = uid("lab");
    storeLab(x);
    S.labId = x.id; n++;
  });
  if (!n) throw new Error("Fișierul nu conține un laborator valid.");
  restoreDraft();
  toast(n + " laborator(oare) importate");
}
function subKey(s) { return hashStr((s.labId || "") + "|" + (s.name || "").toLowerCase().trim() + "|" + (s.group || "").toLowerCase().trim() + "|" + (s.submittedAt || "")).toString(36); }
async function importSubsText(text) {
  let added = 0, dup = 0, bad = 0;
  const push = (raw) => {
    const sb = normalizeSub(raw);
    if (!isSub(sb)) { bad++; return; }
    const key = subKey(sb);
    if (S.catalog.some(c => c.key === key)) { dup++; return; }
    S.catalog.push(Object.assign({}, sb, { key: key, manual: {}, feedback: "", nota: null, importedAt: new Date().toISOString() }));
    added++;
  };
  const ingest = async (o) => {
    if (o && typeof o === "object" && o.code && !o.answers && !o.a) {
      try { o = await decodePayload(o.code); } catch (e) { bad++; return; }
    }
    push(o);
  };
  const t = String(text || "").trim();
  let handled = false;
  /* un fișier JSON întreg (exportul unui student sau un backup de catalog) */
  if (t[0] === "{" || t[0] === "[") {
    try {
      const o = JSON.parse(t);
      const arr = Array.isArray(o) ? o : [o];
      for (const x of arr) await ingest(x);
      handled = true;
    } catch (e) { }
  }
  /* altfel: se caută toate codurile de predare din text, oriunde ar fi */
  if (!handled) {
    const codes = t.match(/LAB[0-3]\.[A-Za-z0-9_-]{8,}/g) || [];
    if (codes.length) {
      for (const c of codes) {
        try { await ingest(await decodePayload(c)); } catch (e) { bad++; }
      }
    } else { bad++; }
  }
  saveCat();
  toast(added + " fișe adăugate" + (dup ? " · " + dup + " deja existau" : "") + (bad ? " · " + bad + " neinterpretabile" : ""));
}

function openSubModal(key) {

  const r = catRow(c);
  const full = r.full;
  let b = '<div class="row" style="justify-content:space-between;margin-bottom:14px">' +
    "<div><b style='font-size:16px'>" + esc(c.name) + "</b> · grupa " + esc(c.group) +

    (r.g ? "<div style='text-align:right'><div class='mono' style='font-size:20px'>" + fmt(r.total, r.total % 1 ? 1 : 0) + "/" + r.max +
      "</div><div class='small muted'>automat: " + fmt(r.g.auto, r.g.auto % 1 ? 1 : 0) + "/" + r.g.autoMax + "</div></div>" : "") + "</div>";

  if (full && full.stripped) b += '<div class="fb bad" style="margin-bottom:12px">Baremul acestei lucrări nu este încărcat în acest browser, deci punctajul automat lipsește. Încarcă fișierul de barem din fila „Laboratoare” → „Importă…”.</div>';
  if (!full) {
    b += '<div class="fb bad">Laboratorul <b>' + esc(c.labId) + "</b> nu se află în biblioteca acestui browser, deci răspunsurile nu pot fi corectate automat. Importă laboratorul complet în fila „Laboratoare”.</div>";
    b += '<div class="codebox" style="margin-top:12px;max-height:260px">' + esc(JSON.stringify(c.answers, null, 1)) + "</div>";
  } else {
    b += (full.questions || []).map((q, i) => {
      const it = r.g.items.find(x => x.id === q.id) || {};
      const decMap = {}; (q.vars || []).forEach(v => decMap[v.name] = Number(v.dec) || 0);
      const given = givenFor(q, c);
      let ansHtml = "";
      if (q.type === "mcq") {
        const k = Number(c.answers[q.id]);
        ansHtml = isFinite(k) ? "<b>" + ("abcdefgh"[k] || "?") + ")</b> " + inl((q.options || [])[k] || "—") : "<i>fără răspuns</i>";
      } else if (q.type === "num") {
        ansHtml = '<span class="mono">' + esc(c.answers[q.id] == null ? "—" : c.answers[q.id]) + " " + esc(q.unit || "") + "</span>" +
          (it.correct != null ? ' <span class="muted small">(corect: ' + fmt(it.correct, q.dec == null ? 2 : q.dec) + " " + esc(q.unit || "") + ")</span>" : "");
      } else {
        ansHtml = '<div style="white-space:pre-wrap;background:var(--surface-2);border-radius:7px;padding:9px 11px;margin-top:5px">' + esc(c.answers[q.id] || "— fără răspuns —") + "</div>";
      }
      const badge = q.type === "open" ? '<span class="pill warn">manual</span>' : it.ok ? '<span class="pill good">corect · ' + it.earned + " p</span>" : '<span class="pill crit">greșit · 0 p</span>';
      return '<div class="qedit" style="background:var(--surface)"><div class="qeHead"><span class="qnum">' + (i + 1) + " · " + (Number(q.points) || 0) + " p</span>" + badge + "</div>" +
        '<div class="small" style="color:var(--ink-2);margin-bottom:7px">' + inl(subVars(q.text, given, decMap)) + "</div>" + ansHtml +
        (q.type === "open" ? '<div class="row" style="margin-top:10px;align-items:flex-end">' +
          '<label class="fld" style="flex:0 1 150px"><span>Punctaj acordat (max ' + (Number(q.points) || 0) + ')</span>' +
          '<input type="number" min="0" step="0.5" max="' + (Number(q.points) || 0) + '" data-mq="' + esc(q.id) + '" value="' + ((c.manual || {})[q.id] != null ? c.manual[q.id] : "") + '"></label>' +
          (q.model ? '<div class="small muted" style="flex:1 1 220px">Barem: ' + inl(q.model) + "</div>" : "") + "</div>" : "") + "</div>";
    }).join("");
    const sugg = r.max ? (1 + 9 * r.total / r.max) : null;
    b += '<div class="card" style="margin-top:14px;background:var(--surface-2)"><div class="row" style="align-items:flex-end">' +
      '<label class="fld" style="flex:0 1 130px"><span>Nota finală</span><input type="text" id="notaIn" value="' + esc(c.nota == null ? "" : c.nota) + '" placeholder="' + (sugg ? fmt(sugg, 2) : "") + '"></label>' +
      (sugg ? '<button type="button" class="btn tiny" id="btnSugg">Propune ' + fmt(sugg, 2) + "</button>" : "") +
      '<label class="fld" style="flex:1 1 240px"><span>Observații pentru student</span><input type="text" id="fbIn" value="' + esc(c.feedback || "") + '"></label>' +
      "</div></div>";
  }
  openModal("Fișa studentului", b,
    '<button type="button" class="btn" data-mclose>Închide</button>' +
    (full ? '<button type="button" class="btn primary" id="btnSaveGrade">Salvează evaluarea</button>' : ""));
}
function saveGrade() {
  const c = S.catalog.find(x => x.key === S.openSub); if (!c) return;
  c.manual = c.manual || {};
  $$("[data-mq]", $("#modalBody")).forEach(inp => {
    const v = parseNum(inp.value);
    if (isFinite(v)) c.manual[inp.dataset.mq] = v; else delete c.manual[inp.dataset.mq];
  });
  const n = $("#notaIn"), f = $("#fbIn");
  c.nota = n && n.value.trim() ? n.value.trim() : null;
  c.feedback = f ? f.value : "";
  saveCat(); closeModal(); render(); toast("Evaluare salvată");
}
function confirmModal(title, msg, okLabel) {
  return new Promise(res => {
    openModal(title, '<p style="max-width:60ch">' + esc(msg) + "</p>",
      '<button type="button" class="btn" data-mclose>Renunță</button><button type="button" class="btn primary" id="cfmOk">' + esc(okLabel || "Continuă") + "</button>");
    const done = v => { closeModal(); res(v); };
    $("#cfmOk").onclick = () => done(true);
    $("#modalX").onclick = () => done(false);
    $("#modalFoot").querySelector("[data-mclose]").onclick = () => done(false);
  });
}
function importModal(kind) {
  const isLabKind = kind === "lab";
  openModal(isLabKind ? "Importă laborator" : "Importă fișe de la studenți",
    '<p class="small muted" style="margin-bottom:10px">' +
    (isLabKind ? "Lipește conținutul fișierului .json primit sau codul laboratorului."
      : "Lipește codurile de predare — <b>câte unul pe linie</b> — sau încarcă fișierele primite de la studenți.") + "</p>" +
    '<textarea id="impTa" rows="9" class="mono" style="font-size:12px" placeholder="LAB1.…"></textarea>',
    '<button type="button" class="btn" id="impFile">Încarcă fișier…</button>' +
    '<button type="button" class="btn" data-mclose>Renunță</button>' +
    '<button type="button" class="btn primary" id="impGo">Importă</button>');
  const run = async (text) => {
    try {
      if (isLabKind) await importLabText(text); else await importSubsText(text);
      closeModal(); render();
    } catch (e) { toast("Nu am putut citi datele: " + (e && e.message ? e.message : "format necunoscut")); }
  };
  $("#impGo").onclick = () => run($("#impTa").value);
  $("#impFile").onclick = async () => {
    const fs = await pickFile(".json,.txt", !isLabKind);
    if (!fs.length) return;
    const texts = await readFiles(fs);
    run(texts.join("\n"));
  };
}

  if (t.id === "btnMdPrev") { openModal("Previzualizare text", '<div class="doc">' + renderMd(e.body) + "</div>"); return; }

    openModal("Exportul nu este disponibil aici",
      '<div class="doc">' + renderMd(
        "Aplica\u021bia \u00ee\u0219i poate scrie o copie doar c\u00e2nd este deschis\u0103 **de la o adres\u0103 web** \u2014 de pe platforma eLearning sau de la o g\u0103zduire.\n\nDintr-un fi\u0219ier deschis cu dublu-click, browserul nu \u00eei d\u0103 voie s\u0103 \u00ee\u0219i citeasc\u0103 propriul con\u021binut. Urc\u0103 o dat\u0103 fi\u0219ierul pe platform\u0103, deschide-l de acolo \u0219i apas\u0103 din nou acest buton.") + "</div>");
    return;
  }
  const A = "/*PRESET-START*/", B = "/*PRESET-END*/";
  const i = src.indexOf(A), j = src.indexOf(B);
  if (j < i) { toast("Fișierul sursă nu are locul pentru setări"); return; }
  const preset = {
    v: 1, creat: new Date().toISOString(),
    pub: pubKey(),
    link: guessLink(),
    hidden: HIDDEN.slice(),
    labs: USER_LABS.map(l => stripLab(l))
  };
  const js = "window.__CL_PRESET=" + JSON.stringify(preset).replace(/</g, "\\u003c").replace(/\*\//g, "*\\/") + ";";
  const out = src.slice(0, i + A.length) + js + src.slice(j);
  await saveFile("caiet-laborator-studenti.html", out);
  toast("Copia pentru studenți a fost creată" + (pubKey() ? " · cheia este inclusă" : " · fără cheie de criptare"));
}

/* pachetul complet: toate lucrările, cu figurile lor proprii */
function exportPack() {
  const pack = S.labs.map(l => JSON.parse(JSON.stringify(l)));
  saveFile("pachet-lucrari-" + todayISO() + ".json", JSON.stringify(pack, null, 1));
}
function exportNotesCSV() {
  const g = gradebook();
  const head = ["Nume", "Grupa"].concat(g.used.map(id => {
    const l = S.labs.find(x => x.id === id);
    return l ? (l.course || l.title) : id;
  })).concat(["Lucrari predate", "Nota finala"]);
  const rows = [head];
  g.rows.forEach(st => {
    rows.push([st.name, st.group]
      .concat(g.used.map(id => st.labs[id] && st.labs[id].nota != null ? fmt(st.labs[id].nota, 2) : ""))
      .concat([st.count, st.final != null ? fmt(st.final, 2) : ""]));
  });
  saveFile("note-finale-" + todayISO() + ".csv", toCSV(rows));
}
function exportCSV() {
  const rows = [["Nume", "Grupa", "Laborator", "Data predarii", "Punctaj automat", "Punctaj manual", "Punctaj total", "Punctaj maxim", "Procent", "Nota", "Observatii"]];
  S.catalog.slice().sort((a, b) => (a.group + a.name).localeCompare(b.group + b.name, "ro")).forEach(c => {
    const r = catRow(c);
    rows.push([c.name, c.group, c.labTitle || c.labId, roDate(c.submittedAt),
    r.g ? r.g.auto : "", r.manual || "", r.max != null ? r.total : "", r.max != null ? r.max : "",
    r.max ? Math.round(r.total / r.max * 100) + "%" : "", c.nota == null ? "" : c.nota, c.feedback || ""]);
  });
  saveFile("catalog-laborator.csv", toCSV(rows));
}

/* ============================ pornire ============================ */
/* lucrarea cerută prin link: ...#lab=lucrarea-3 */
function hashLab() {
  try {
    const m = (location.hash || "").match(/lab=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  } catch (e) { return null; }
}
/* cheia publică a cadrului didactic, adusă de codul QR */
function adoptKeyFromHash() {
  try {
    const m = (location.hash || "").match(/[#&]k=([A-Za-z0-9_-]{80,})/);
    if (m && m[1] !== pubKey()) { LS.set(K.pub, m[1]); return true; }
  } catch (e) { }
  return false;
}
async function init() {
  const th = LS.get(K.theme, null);
  if (th) document.documentElement.setAttribute("data-theme", th);
  document.documentElement.style.height = "100%";
  S.unlocked = sessUnlocked() || (pinSet() && LS.get(K.keep, false) === true);
  if (!S.unlocked) S.role = "student";
  rebuildLabs(); render();

  USER_LABS = (await Store.get(K.labs, null)) || LS.get(K.labs, []) || [];
  HIDDEN = (await Store.get(K.hidden, null)) || LS.get(K.hidden, []) || [];
  S.catalog = (await Store.get(K.cat, null)) || LS.get(K.cat, []) || [];
  BAREM = (await Store.get(K.barem, null)) || {};

  /* o singură dată: se elimină laboratoarele demonstrative din versiunile vechi */
  if (!LS.get("cl.mig2", false)) {
    const before = USER_LABS.length;
    USER_LABS = USER_LABS.filter(l => l && l.id !== "demo-vam" && l.id !== "demo-stat");
    HIDDEN = HIDDEN.filter(id => id !== "demo-vam" && id !== "demo-stat");
    LS.set("cl.mig2", true);
    if (before !== USER_LABS.length) persistLabs();
  }

  /* setări livrate odată cu fișierul */
  try {
    const P = window.__CL_PRESET;
    if (P && typeof P === "object") {
      /* cheia publică inclusă în pagină; în browserul profesorului (unde există cheia privată) rămâne cheia lui */
      if (P.pub && P.pub !== pubKey() && !(await privKey())) LS.set(K.pub, P.pub);
      if (P.link && !LS.get(K.link, "")) LS.set(K.link, P.link);
      if (Array.isArray(P.labs) && P.labs.length) {
        P.labs.forEach(l => { if (l && l.id && !USER_LABS.some(x => x.id === l.id)) USER_LABS.push(l); });
      }
      if (Array.isArray(P.hidden) && !HIDDEN.length) HIDDEN = P.hidden.slice();
    }
  } catch (e) { }

  /* nume preluat din platforma eLearning */
  if (LMS.present()) {
    LMS.init();
    const who = LMS.student();
    if (who && who.name) { S.fromLMS = true; S.student.name = who.name; LS.set(K.stud, S.student); }
  }

  adoptKeyFromHash();
  S.unlocked = sessUnlocked() || (pinSet() && LS.get(K.keep, false) === true);
  if (!S.unlocked) { S.role = "student"; }
  const want = hashLab();
  rebuildLabs();
  if (want && S.labs.some(l => l.id === want)) S.labId = want;
  restoreDraft();
  if (S.role === "prof") S.tab = "labs";
  render();
  try { if (/(^|[#&])prof(esor)?(&|$)/.test(location.hash || "") && !S.unlocked) openGate(); } catch (e) { }
}
init();
window.addEventListener("hashchange", () => {
  adoptKeyFromHash();
  const want = hashLab();
  if (want && S.labs.some(l => l.id === want)) { S.labId = want; restoreDraft(); render(); window.scrollTo(0, 0); }
});
